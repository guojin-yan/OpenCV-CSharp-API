name: docs

on:
  push:
    branches: [main, opencv5.x]
  pull_request:
    branches: [main, opencv5.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Check project invariants
        shell: pwsh
        run: pwsh -NoProfile -File .\scripts\Test-ProjectInvariants.ps1
      - name: Restore
        run: dotnet restore .\OpenCV-CSharp-API.slnx
      - name: Build managed API
        run: dotnet build .\src\OpenCvSharp\OpenCvSharp.csproj -c Release --no-restore
      - name: Restore documentation tools
        run: dotnet tool restore
      - name: Build docfx site
        run: dotnet tool run docfx ./docs/docfx.json
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/_site

  deploy-pages:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
