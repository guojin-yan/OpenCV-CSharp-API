name: docs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-docs:
    if: github.repository == 'grape-yan/OpenCV-CSharp-API' || (github.repository == 'guojin-yan/OpenCV-CSharp-API' && github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Check project invariants
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Initialize-UpstreamMapSourceEvidence.ps1
          pwsh -NoProfile -File .\scripts\Test-ProjectInvariants.ps1
      - name: Restore
        run: dotnet restore .\OpenCV-CSharp-API.slnx
      - name: Build managed API
        run: dotnet build .\src\OpenCvSharp\OpenCvSharp.csproj -c Release --no-restore
      - name: Restore documentation tools
        run: dotnet tool restore
      - name: Build docfx site
        run: dotnet tool run docfx ./docs/docfx.json
      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/_site

  deploy-pages:
    if: github.repository == 'guojin-yan/OpenCV-CSharp-API' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build-docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
