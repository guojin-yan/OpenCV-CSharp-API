    if: ${{ inputs.rid == 'debian.12-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini') && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04
    container: debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
    steps:
      - name: Verify Debian 12 container and install tooling
        shell: bash
        env:
          MICROSOFT_SIGNING_KEY_SHA256: 2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
          MICROSOFT_SIGNING_KEY_FINGERPRINT: BC528686B50D79E339D3721CEB3E94ADBE1229CF
          POWERSHELL_DEBIAN_PACKAGE_VERSION: 7.6.4-1.deb
          POWERSHELL_PACKAGE_SEMANTIC_VERSION: 7.6.4
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          if [ "${ID:-}" != "debian" ]; then
            echo "Expected Debian container, got ${ID:-unknown}." >&2
            exit 1
          fi
          case "${VERSION_ID:-}" in
            12|12.*) ;;
            *)
              echo "Expected Debian 12 container, got ${VERSION_ID:-unknown}." >&2
              exit 1
              ;;
          esac
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"
          container_libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n 1)"
          printf '%s\n' "$container_libc" | grep -Eq '^glibc 2\.36($|\.)'

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            apt-transport-https \
            binutils \
            ca-certificates \
            curl \
            git \
            gnupg \
            gzip \
            libicu72 \
            libssl3 \
            tar \
            unzip \
            zlib1g
          install -d -m 0755 /etc/apt/keyrings
          microsoft_key_url="https://packages.microsoft.com/keys/microsoft.asc"
          microsoft_key="/tmp/microsoft-packages-key.asc"
          curl --proto "=https" --tlsv1.2 -fsSL "$microsoft_key_url" -o "$microsoft_key"
          echo "$MICROSOFT_SIGNING_KEY_SHA256  $microsoft_key" | sha256sum -c -
          microsoft_key_metadata="$(gpg --batch --show-keys --with-colons --fingerprint "$microsoft_key")"
          microsoft_key_fingerprints="$(printf '%s\n' "$microsoft_key_metadata" | awk -F: '$1 == "fpr" { print $10 }')"
          test "$microsoft_key_fingerprints" = "$MICROSOFT_SIGNING_KEY_FINGERPRINT"
          printf '%s\n' "$microsoft_key_metadata" | awk -F: '$1 == "uid" { print $10 }' | grep -Fqx "Microsoft (Release signing) <gpgsecurity@microsoft.com>"
          gpg --batch --yes --dearmor --output /etc/apt/keyrings/packages.microsoft.gpg "$microsoft_key"
          installed_key_fingerprints="$(gpg --batch --show-keys --with-colons --fingerprint /etc/apt/keyrings/packages.microsoft.gpg | awk -F: '$1 == "fpr" { print $10 }')"
          test "$installed_key_fingerprints" = "$MICROSOFT_SIGNING_KEY_FINGERPRINT"
          chmod go+r /etc/apt/keyrings/packages.microsoft.gpg
          rm -f "$microsoft_key"
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/microsoft-prod.list
          echo "MICROSOFT_APT_TRUST_EVIDENCE rid=debian.12-x64 key_sha256=$MICROSOFT_SIGNING_KEY_SHA256 key_fingerprint=$MICROSOFT_SIGNING_KEY_FINGERPRINT signed_by=/etc/apt/keyrings/packages.microsoft.gpg repository=debian/12/prod"
          apt-get update
          apt-get install -y --no-install-recommends "powershell=$POWERSHELL_DEBIAN_PACKAGE_VERSION"
          installed_powershell_package_version="$(dpkg-query -W -f='${Version}' powershell)"
          installed_powershell_package_architecture="$(dpkg-query -W -f='${Architecture}' powershell)"
          test "$installed_powershell_package_version" = "$POWERSHELL_DEBIAN_PACKAGE_VERSION"
          test "$installed_powershell_package_architecture" = "amd64"
          installed_powershell_version="$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | tr -d '\r')"
          process_architecture="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()' | tr -d '\r')"
          test "$installed_powershell_version" = "$POWERSHELL_PACKAGE_SEMANTIC_VERSION"
          test "$process_architecture" = "X64"
          echo "POWERSHELL_APT_TOOLCHAIN_EVIDENCE rid=debian.12-x64 package=powershell package_version=$installed_powershell_package_version semantic_version=$installed_powershell_version package_arch=$installed_powershell_package_architecture process_arch=$process_architecture key_fingerprint=$installed_key_fingerprints"
          echo "DEBIAN_12_X64_CONTAINER_EVIDENCE profile=${{ inputs.runtime_profile }} ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) PROCESS_ARCH=$process_architecture DPKG_ARCH=$(dpkg --print-architecture) LIBC=$container_libc"
