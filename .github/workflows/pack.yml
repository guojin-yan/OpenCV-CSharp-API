name: pack

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: OpenCV version aligned with package version
        required: true
        default: 5.0.0
      package_revision:
        description: Package revision for this OpenCV version
        required: true
        default: "0"
      package_version:
        description: Exact four-part package version with optional lowercase prerelease suffix
        required: true
        default: 5.0.0.0-preview.1
      rid:
        description: Runtime identifier to pack; use all for the configured matrix
        required: true
        default: all
      runtime_profile:
        description: Runtime profile to pack; use all for full and mini
        required: true
        default: all
      validate_synthetic_runtime:
        description: Use synthetic runtime inputs for package-surface validation only
        required: true
        default: "true"
      native_runtime_dir:
        description: Existing real native wrapper runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_runtime_dir:
        description: Existing real OpenCV runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_source_dir:
        description: Existing real OpenCV source directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      real_runtime_artifact_run_id:
        description: Optional workflow run id containing runtime-input-<rid>-<profile> artifact handoffs when synthetic validation is false
        required: false
        default: ""
      publish_github_packages:
        description: Publish packages to GitHub Packages; requires real runtime inputs
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'guojin-yan/OpenCV-CSharp-API'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Reject synthetic publish inputs
        if: ${{ inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Publishing packages requires real native runtime inputs; synthetic runtime inputs validate package shape only."
      - name: Validate package version
        shell: pwsh
        env:
          PACKAGE_VERSION_INPUT: ${{ inputs.package_version }}
          OPENCV_VERSION_INPUT: ${{ inputs.opencv_version }}
          PACKAGE_REVISION_INPUT: ${{ inputs.package_revision }}
        run: |
          . ./scripts/PackageVersion.ps1
          $packageRevision = [int]$env:PACKAGE_REVISION_INPUT
          Assert-OpenCvCSharpPackageVersion `
            -Version $env:PACKAGE_VERSION_INPUT `
            -OpenCvVersion $env:OPENCV_VERSION_INPUT `
            -PackageRevision $packageRevision | Out-Null
      - name: Validate runtime selection
        shell: pwsh
        env:
          RID_INPUT: ${{ inputs.rid }}
          RUNTIME_PROFILE_INPUT: ${{ inputs.runtime_profile }}
          VALIDATE_SYNTHETIC_RUNTIME_INPUT: ${{ inputs.validate_synthetic_runtime }}
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $allowedRids = @('all') + @($matrix.rids | ForEach-Object { [string]$_.rid })
          $allowedProfiles = @('all') + @($matrix.profiles | ForEach-Object { [string]$_.name })

          if ($allowedRids -notcontains $env:RID_INPUT) {
            throw "Unknown runtime RID input: $($env:RID_INPUT)"
          }
          if ($allowedProfiles -notcontains $env:RUNTIME_PROFILE_INPUT) {
            throw "Unknown runtime profile input: $($env:RUNTIME_PROFILE_INPUT)"
          }
          if ($env:RID_INPUT -eq 'win-x86' -and
              $env:RUNTIME_PROFILE_INPUT -eq 'mini' -and
              $env:VALIDATE_SYNTHETIC_RUNTIME_INPUT -ne 'true') {
            throw "win-x86/mini has no approved real runtime producer or target-execution evidence and cannot be packed as a real candidate."
          }
      - name: Check project invariants
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./scripts/Initialize-UpstreamMapSourceEvidence.ps1
          pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1

  pack-managed:
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Restore
        run: dotnet restore ./OpenCV-CSharp-API.slnx
      - name: Build
        run: dotnet build ./OpenCV-CSharp-API.slnx -c Release --no-restore
      - name: Pack managed API
        shell: pwsh
        env:
          PACKAGE_VERSION_INPUT: ${{ inputs.package_version }}
        run: |
          $packageRevision = [int]'${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Pack-Managed.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -PackageRevision $packageRevision `
            -PackageVersion $env:PACKAGE_VERSION_INPUT `
            -NoBuild `
            -NoRestore
      - name: Upload managed package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg-managed
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish managed package
        if: inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime != 'true'
        shell: pwsh
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate

  pack-runtime:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: full
            os: windows-latest
          - rid: win-x64
            profile: mini
            os: windows-latest
          - rid: win-x86
            profile: full
            os: windows-latest
          - rid: win-x86
            profile: mini
            os: windows-latest
          - rid: win-arm64
            profile: full
            os: windows-11-vs2026-arm
          - rid: win-arm64
            profile: mini
            os: windows-11-vs2026-arm
          - rid: ubuntu.22.04-x64
            profile: full
            os: ubuntu-22.04
          - rid: ubuntu.22.04-x64
            profile: mini
            os: ubuntu-22.04
          - rid: ubuntu.22.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.22.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-x64
            profile: full
            os: ubuntu-24.04
          - rid: ubuntu.24.04-x64
            profile: mini
            os: ubuntu-24.04
          - rid: ubuntu.24.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: debian.12-x64
            profile: full
            os: ubuntu-24.04
          - rid: debian.12-x64
            profile: mini
            os: ubuntu-24.04
          - rid: debian.12-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: debian.12-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: fedora.40-x64
            profile: full
            os: ubuntu-24.04
          - rid: fedora.40-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: full
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm64
            profile: full
            os: ubuntu-24.04
          - rid: android-arm64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm
            profile: full
            os: ubuntu-24.04
          - rid: android-arm
            profile: mini
            os: ubuntu-24.04
          - rid: android-x64
            profile: full
            os: ubuntu-24.04
          - rid: android-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-x86
            profile: full
            os: ubuntu-24.04
          - rid: android-x86
            profile: mini
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Reject synthetic publish
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Synthetic runtime inputs validate package shape only and must not be published."
      - name: Skip unmatched matrix entry
        if: ${{ !((inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile)) }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - name: Create synthetic runtime inputs
        id: synthetic
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: |
          $result = pwsh -NoProfile -File ./scripts/New-SyntheticRuntimeInputs.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' | ConvertFrom-Json
          "native_runtime_dir=$($result.NativeWrapperDir)" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$($result.OpenCvRuntimeDir)" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$($result.OpenCvSourceDir)" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$($result.OpenCvInstallDir)" >> $env:GITHUB_OUTPUT
      - name: Download real runtime input artifact
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' && inputs.real_runtime_artifact_run_id != '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          run-id: ${{ inputs.real_runtime_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
      - name: Validate real runtime input paths
        id: real
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          $missingGuidance = "pack.yml does not build real runtime inputs; provide paths that already exist on the selected runner or set real_runtime_artifact_run_id to download runtime-input-${{ matrix.rid }}-${{ matrix.profile }} before disabling synthetic validation."
          $nativeRuntimeDir = '${{ inputs.native_runtime_dir }}'
          $openCvRuntimeDir = '${{ inputs.opencv_runtime_dir }}'
          $openCvSourceDir = '${{ inputs.opencv_source_dir }}'
          $openCvInstallDir = ''
          $artifactRunId = '${{ inputs.real_runtime_artifact_run_id }}'

          if (-not [string]::IsNullOrWhiteSpace($artifactRunId)) {
            $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}'
            $nativeRuntimeDir = Join-Path $artifactRoot 'native-wrapper'
            $openCvRuntimeDir = Join-Path $artifactRoot 'opencv-runtime'
            $openCvSourceDir = Join-Path $artifactRoot 'opencv-source'

            $artifactInstallDir = Join-Path $artifactRoot 'opencv-install'
            if (Test-Path -LiteralPath $artifactInstallDir -PathType Container) {
              $openCvInstallDir = $artifactInstallDir
            }
            else {
              $openCvInstallDir = ''
            }
          }

          if ([string]::IsNullOrWhiteSpace($nativeRuntimeDir) -or -not (Test-Path -LiteralPath $nativeRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires native_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvRuntimeDir) -or -not (Test-Path -LiteralPath $openCvRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvSourceDir) -or -not (Test-Path -LiteralPath $openCvSourceDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_source_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if (-not [string]::IsNullOrWhiteSpace($openCvInstallDir) -and -not (Test-Path -LiteralPath $openCvInstallDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_install_dir to be an existing directory when provided. $missingGuidance"
          }

          "native_runtime_dir=$nativeRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$openCvRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$openCvSourceDir" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$openCvInstallDir" >> $env:GITHUB_OUTPUT
      - name: Validate Ubuntu 22.04 x64 mini runtime input provenance
        if: ${{ matrix.rid == 'ubuntu.22.04-x64' && matrix.profile == 'mini' && inputs.rid == 'ubuntu.22.04-x64' && inputs.runtime_profile == 'mini' && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace('${{ inputs.real_runtime_artifact_run_id }}')) {
            throw "Non-synthetic ubuntu.22.04-x64/mini packaging requires an explicit runtime-input producer run id."
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/real-runtime-inputs/ubuntu.22.04-x64-mini'
          $provenance = Get-Content -LiteralPath (Join-Path $artifactRoot 'runtime-input.provenance.json') -Raw | ConvertFrom-Json
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $profile = @($matrix.profiles | Where-Object { $_.name -eq 'mini' })
          if ($profile.Count -ne 1) {
            throw "Selected mini runtime profile was not found exactly once."
          }

          $expectedModules = @($profile[0].modules)
          $expectedModuleCount = 6
          $expectedOpenCvFileCount = 18
          $expectedPayloadFileCount = 19
          if ($expectedModules.Count -ne $expectedModuleCount) {
            throw "Mini runtime matrix must retain exactly six OpenCV modules."
          }
          $expectedRuntimeNames = @($expectedModules | ForEach-Object {
              "libopencv_$_.so"
              "libopencv_$_.so.500"
              "libopencv_$_.so.${{ inputs.opencv_version }}"
            })
          $actualModules = @($provenance.RequiredModules)
          $actualRuntimeNames = @($provenance.RuntimeFiles | ForEach-Object { [string]$_.FileName })
          $actualLoaderNames = @($provenance.NativeLoaderFiles | ForEach-Object { [string]$_.FileName })
          if ($provenance.Rid -ne 'ubuntu.22.04-x64' -or
              $provenance.OpenCvRid -ne 'ubuntu.22.04-x64' -or
              $provenance.PlatformFamily -ne 'linux' -or
              $provenance.Distro -ne 'ubuntu' -or
              $provenance.DistroVersion -ne '22.04' -or
              $provenance.RuntimeProfile -ne 'mini' -or
              $provenance.RuntimeProfilePackageIdSuffix -ne '.mini' -or
              $provenance.BuildList -ne 'core,imgproc,imgcodecs,videoio,geometry,flann' -or
              [bool]$provenance.SyntheticRuntimeInputs -or
              $actualModules.Count -ne $expectedModuleCount -or
              @($expectedModules | Where-Object { $actualModules -notcontains $_ }).Count -ne 0 -or
              @($actualModules | Where-Object { $expectedModules -notcontains $_ }).Count -ne 0 -or
              $actualRuntimeNames.Count -ne $expectedOpenCvFileCount -or
              @($expectedRuntimeNames | Where-Object { $actualRuntimeNames -notcontains $_ }).Count -ne 0 -or
              @($actualRuntimeNames | Where-Object { $expectedRuntimeNames -notcontains $_ }).Count -ne 0 -or
              $actualLoaderNames.Count -ne 1 -or
              $actualLoaderNames -notcontains 'libJYPPX.OpenCV.Native.so'
          ) {
            throw "Ubuntu 22.04 x64 mini provenance does not match the exact six-module 19-file producer contract."
          }

          foreach ($requiredValue in @(
              [string]$provenance.RunnerImage,
              [string]$provenance.RunnerImageVersion,
              [string]$provenance.HostedDistro,
              [string]$provenance.HostedDistroVersion,
              [string]$provenance.HostedArchitecture,
              [string]$provenance.HostedProcessArchitecture,
              [string]$provenance.HostedPackageArchitecture,
              [string]$provenance.HostedLibc,
              [string]$provenance.HostedCpuModel,
              [string]$provenance.HostedMemoryBytes,
              [string]$provenance.HostedDiskAvailableBytes,
              [string]$provenance.CMakeVersion,
              [string]$provenance.CMakeGenerator,
              [string]$provenance.BuildConfiguration,
              [string]$provenance.CompilerPath,
              [string]$provenance.CompilerVersion,
              [string]$provenance.AssemblerVersion,
              [string]$provenance.NinjaVersion,
              [string]$provenance.PowerShellVersion,
              [string]$provenance.DotNetVersion,
              [string]$provenance.OpenCvCMakeArguments,
              [string]$provenance.OpenCvCpuConfiguration,
              [string]$provenance.NativeWrapperSources,
              [string]$provenance.ElfAuditEvidence)) {
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Ubuntu 22.04 x64 mini provenance is missing required runner, toolchain, profile, or ELF evidence."
            }
          }

          try {
            $nativeWrapperSources = @(([string]$provenance.NativeWrapperSources | ConvertFrom-Json))
            $openCvCMakeArguments = @(([string]$provenance.OpenCvCMakeArguments | ConvertFrom-Json))
          }
          catch {
            throw "Ubuntu 22.04 x64 mini provenance contains invalid source or OpenCV CMake argument JSON."
          }
          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          $miniMatch = [regex]::Match($cmakeText, '(?s)set\(OPENCV_CSHARP_MINI_NATIVE_SOURCES(?<body>.*?)\)')
          if (-not $miniMatch.Success) {
            throw "Native mini CMake source list was not found."
          }
          $expectedSources = @(
            [regex]::Matches($miniMatch.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') |
              ForEach-Object { $_.Groups[1].Value }
          )
          if ($expectedSources.Count -ne 9 -or
              [int]$provenance.NativeWrapperSourceCount -ne 9 -or
              [int]$provenance.NativeAbiFunctionCount -ne 526 -or
              $nativeWrapperSources.Count -ne 9 -or
              @($expectedSources | Where-Object { $nativeWrapperSources -notcontains $_ }).Count -ne 0 -or
              @($nativeWrapperSources | Where-Object { $expectedSources -notcontains $_ }).Count -ne 0 -or
              -not [string]::IsNullOrWhiteSpace([string]$provenance.OpenCvExtraCMakeArgs)) {
            throw "Ubuntu 22.04 x64 mini provenance does not retain the exact 9-source/526-ABI profile and empty extra CMake arguments."
          }

          foreach ($containerValue in @(
              [string]$provenance.ContainerImage,
              [string]$provenance.ContainerImageId,
              [string]$provenance.ContainerImageDigest,
              [string]$provenance.ContainerDistro,
              [string]$provenance.ContainerDistroVersion,
              [string]$provenance.ContainerArchitecture,
              [string]$provenance.ContainerPackageArchitecture,
              [string]$provenance.ContainerLibc,
              [string]$provenance.PowerShellArchiveSha256)) {
            if (-not [string]::IsNullOrWhiteSpace($containerValue)) {
              throw "Ubuntu 22.04 x64 hosted provenance must not contain container-only evidence."
            }
          }

          $cmakeArgumentText = $openCvCMakeArguments -join "`n"
          $expectedElfPattern = '^UBUNTU_22_04_X64_PRODUCER_ELF_EVIDENCE profile=mini files=7 runtime_files=19 machine=X86-64 origin=7 producer_paths=0 direct_opencv=6 missing_dependencies=0$'
          if ($provenance.MatrixRunner -ne 'ubuntu-22.04' -or
              $provenance.HostedRunner -ne 'ubuntu-22.04' -or
              $provenance.RunnerImage -ne 'ubuntu22' -or
              $provenance.HostedDistro -ne 'ubuntu' -or
              $provenance.HostedDistroVersion -ne '22.04' -or
              $provenance.HostedArchitecture -ne 'x86_64' -or
              $provenance.HostedProcessArchitecture -ne 'X64' -or
              $provenance.HostedPackageArchitecture -ne 'amd64' -or
              $provenance.HostedLibc -notmatch '^glibc 2\.35(?:$|\.)' -or
              [long]$provenance.HostedMemoryBytes -le 0 -or
              [long]$provenance.HostedDiskAvailableBytes -le 0 -or
              $provenance.CMakeVersion -notmatch '^cmake version ' -or
              $provenance.CMakeGenerator -ne 'Ninja' -or
              $provenance.BuildConfiguration -ne 'Release' -or
              $provenance.CompilerPath -notmatch '(?i)(?:^|/)g\+\+$' -or
              $provenance.CompilerVersion -notmatch 'x86_64' -or
              $provenance.AssemblerVersion -notmatch 'x86_64' -or
              $cmakeArgumentText.IndexOf('-G', [System.StringComparison]::Ordinal) -lt 0 -or
              $cmakeArgumentText.IndexOf('Ninja', [System.StringComparison]::Ordinal) -lt 0 -or
              $cmakeArgumentText.IndexOf('-DBUILD_LIST=core,imgproc,imgcodecs,videoio,geometry,flann', [System.StringComparison]::Ordinal) -lt 0 -or
              $provenance.OpenCvCpuConfiguration -notmatch '(?i)(?:SSE|AVX)' -or
              $provenance.ElfAuditEvidence -notmatch $expectedElfPattern) {
            throw "Ubuntu 22.04 x64 mini provenance runner, toolchain, CPU, profile, or ELF evidence is not factual."
          }

          $forbiddenEvidence = @(
            [string]$provenance.CompilerVersion,
            [string]$provenance.AssemblerVersion,
            [string]$provenance.OpenCvCMakeArguments,
            [string]$provenance.OpenCvCpuConfiguration,
            [string]$provenance.ElfAuditEvidence
          ) -join "`n"
          foreach ($forbiddenToken in @('AArch64', 'arm64', 'QEMU', 'emulation', 'cross-compile', '--platform', 'CV_AVXVNNI_AVAILABLE=0')) {
            if ($forbiddenEvidence.IndexOf($forbiddenToken, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Ubuntu 22.04 x64 mini provenance retained forbidden foreign or workaround evidence: $forbiddenToken"
            }
          }
          Write-Host "UBUNTU_22_04_X64_RUNTIME_INPUT_PROVENANCE_OK profile=mini files=$expectedPayloadFileCount modules=$expectedModuleCount sources=9 abi_functions=526 synthetic=false"
      - name: Validate Debian 12 x64 mini runtime input provenance
        if: ${{ matrix.rid == 'debian.12-x64' && matrix.profile == 'mini' && inputs.rid == 'debian.12-x64' && inputs.runtime_profile == 'mini' && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace('${{ inputs.real_runtime_artifact_run_id }}')) {
            throw "Non-synthetic debian.12-x64/mini packaging requires an explicit runtime-input producer run id."
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/real-runtime-inputs/debian.12-x64-mini'
          $provenance = Get-Content -LiteralPath (Join-Path $artifactRoot 'runtime-input.provenance.json') -Raw | ConvertFrom-Json
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $profile = @($matrix.profiles | Where-Object { $_.name -eq 'mini' })
          if ($profile.Count -ne 1) {
            throw "Selected Debian 12 x64 mini runtime profile was not found exactly once."
          }

          $expectedModules = @($profile[0].modules)
          $expectedModuleCount = 6
          $expectedCanonicalCount = 7
          $expectedOpenCvFileCount = 18
          $expectedPayloadFileCount = 19
          if ($expectedModules.Count -ne $expectedModuleCount) {
            throw "Mini runtime matrix must retain exactly six OpenCV modules."
          }
          $expectedRuntimeNames = @($expectedModules | ForEach-Object {
              "libopencv_$_.so"
              "libopencv_$_.so.500"
              "libopencv_$_.so.${{ inputs.opencv_version }}"
            })
          $actualModules = @($provenance.RequiredModules)
