  verify-targeted-real-ubuntu2204-arm64:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'ubuntu.22.04-arm64' && inputs.runtime_profile == 'full' && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-managed
      - name: Download Ubuntu 22.04 ARM64 runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-ubuntu.22.04-arm64-full
          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-ubuntu.22.04-arm64-full
      - name: Verify and run selected real Ubuntu 22.04 ARM64 package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.opencv_version }}.${{ inputs.package_revision }}
          POWERSHELL_VERSION: 7.4.17
          POWERSHELL_SHA256: 68f3874cdb6cd564acf404103dfc410ee85435b02f0ad648e73a958853175d6c
          UBUNTU_2204_ARM64_IMAGE: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(docker info --format '{{.Architecture}}')" = "aarch64"
          docker pull "$UBUNTU_2204_ARM64_IMAGE"
          test "$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Architecture}}')" = "arm64"
          image_id="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Id}}')"
          image_digests="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{join .RepoDigests ","}}')"
          printf '%s\n' "$image_digests" | grep -Fq 'ubuntu@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982'
