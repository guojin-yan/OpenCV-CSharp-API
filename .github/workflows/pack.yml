          find "$native_dir" -mindepth 1 -maxdepth 1 -type f -printf "%f\n" | sort > "$actual_names"
          test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
          diff -u "$expected_names" "$actual_names"

          mapfile -t opencv_elfs < <(find "$native_dir" -maxdepth 1 -type f -name "libopencv_*.so.$OPENCV_VERSION" | sort)
          test "${#opencv_elfs[@]}" -eq "${#modules[@]}"
          elf_files=("$native_dir/libJYPPX.OpenCV.Native.so" "${opencv_elfs[@]}")
          test "${#elf_files[@]}" -eq "$expected_canonical_count"
          machine_count=0
          origin_count=0
          producer_path_count=0
          missing_dependency_count=0
          for elf in "${elf_files[@]}"; do
            test -f "$elf"
            readelf -h "$elf" | grep -q "Machine:.*X86-64"
            machine_count=$((machine_count + 1))
            dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
            printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
            origin_count=$((origin_count + 1))
            if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then
              producer_path_count=$((producer_path_count + 1))
            fi
            missing="$(ldd "$elf" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              printf "%s\n" "$missing" >&2
              missing_dependency_count=$((missing_dependency_count + 1))
            fi
          done
          for module in "${modules[@]}"; do
            cmp -s "$native_dir/libopencv_${module}.so" "$native_dir/libopencv_${module}.so.500"
            cmp -s "$native_dir/libopencv_${module}.so.500" "$native_dir/libopencv_${module}.so.$OPENCV_VERSION"
          done
          direct_opencv_dependencies="$(readelf -d "$native_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
          test "$machine_count" -eq "$expected_canonical_count"
          test "$origin_count" -eq "$expected_canonical_count"
          test "$producer_path_count" -eq 0
          test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
          test "$missing_dependency_count" -eq 0
          echo "ROCKY_9_X64_PACKAGE_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=X86-64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 triplets_equal=true"
      - name: Restore, build, and run selected real Rocky package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-rocky `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid rocky.9-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}' `
            -RunNativeSmoke

  verify-targeted-real-rhel:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'rhel.9-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini') && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04
    container: registry.access.redhat.com/ubi9/ubi:9.8@sha256:50701171b9917ed51048b614924598d45b00bce9a64b73860c057922fc13bec2
    steps:
      - name: Verify RHEL 9 UBI container and install tooling
        shell: bash
        env:
          MICROSOFT_SIGNING_KEY_SHA256: 2fa9c05d591a1582a9aba276272478c262e95ad00acf60eaee1644d93941e3c6
          MICROSOFT_SIGNING_KEY_FINGERPRINT: BC528686B50D79E339D3721CEB3E94ADBE1229CF
          POWERSHELL_RPM_PACKAGE_NEVRA: powershell-7.6.4-1.rh.x86_64
          POWERSHELL_PACKAGE_SEMANTIC_VERSION: 7.6.4
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          if [ "${ID:-}" != "rhel" ]; then
            echo "Expected a Red Hat Enterprise Linux UBI container, got ${ID:-unknown}." >&2
            exit 1
          fi
          case "${VERSION_ID:-}" in
            9|9.*) ;;
            *)
              echo "Expected Red Hat Enterprise Linux 9, got ${VERSION_ID:-unknown}." >&2
              exit 1
              ;;
          esac
          if [ "${PLATFORM_ID:-}" != "platform:el9" ]; then
            echo "Expected platform:el9, got ${PLATFORM_ID:-unknown}." >&2
            exit 1
          fi
          test "$(uname -m)" = "x86_64"
          test "$(rpm --eval '%{_arch}')" = "x86_64"
          container_libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n 1)"
          printf '%s\n' "$container_libc" | grep -Eq '^glibc 2\.34($|\.)'

          enabled_repositories="$(dnf repolist --enabled)"
          for repository in ubi-9-baseos-rpms ubi-9-appstream-rpms ubi-9-codeready-builder-rpms; do
            grep -q "^${repository}" <<< "$enabled_repositories"
          done
          echo "RHEL_9_UBI_REPOSITORY_EVIDENCE ubi-9-baseos-rpms,ubi-9-appstream-rpms,ubi-9-codeready-builder-rpms"
          dnf install -y \
            binutils \
            ca-certificates \
            curl-minimal \
            diffutils \
            dnf-plugins-core \
            findutils \
            git \
            glibc-common \
            gnupg2 \
            gzip \
            krb5-libs \
            libgcc \
            libicu \
            libstdc++ \
            openssl-libs \
            tar \
            tzdata \
            unzip \
            zlib
          assembler="$(as --version | head -n 1)"
          echo "RHEL_9_UBI_ASSEMBLER_EVIDENCE $assembler"
          microsoft_key_url="https://packages.microsoft.com/keys/microsoft.asc"
          microsoft_key="/tmp/microsoft-packages-key.asc"
          microsoft_local_key="/etc/pki/rpm-gpg/RPM-GPG-KEY-Microsoft"
          curl --proto "=https" --tlsv1.2 -fsSL "$microsoft_key_url" -o "$microsoft_key"
          echo "$MICROSOFT_SIGNING_KEY_SHA256  $microsoft_key" | sha256sum -c -
          microsoft_key_metadata="$(gpg --batch --show-keys --with-colons --fingerprint "$microsoft_key")"
          microsoft_key_fingerprints="$(printf '%s\n' "$microsoft_key_metadata" | awk -F: '$1 == "fpr" { print $10 }')"
          test "$microsoft_key_fingerprints" = "$MICROSOFT_SIGNING_KEY_FINGERPRINT"
          printf '%s\n' "$microsoft_key_metadata" | awk -F: '$1 == "uid" { print $10 }' | grep -Fqx "Microsoft (Release signing) <gpgsecurity@microsoft.com>"
          install -d -m 0755 /etc/pki/rpm-gpg
          install -o root -g root -m 0644 "$microsoft_key" "$microsoft_local_key"
          installed_key_fingerprints="$(gpg --batch --show-keys --with-colons --fingerprint "$microsoft_local_key" | awk -F: '$1 == "fpr" { print $10 }')"
          test "$installed_key_fingerprints" = "$MICROSOFT_SIGNING_KEY_FINGERPRINT"
          rpm --import "$microsoft_local_key"
          installed_microsoft_key_package="$(rpm -q gpg-pubkey-be1229cf-5631588c)"
          rm -f "$microsoft_key"
          # Microsoft's RHEL 9 feed matches this RHEL UBI container and supplies tooling only.
          printf '%s\n' \
            "[packages-microsoft-com-prod]" \
            "name=Microsoft Production" \
            "baseurl=https://packages.microsoft.com/rhel/9/prod/" \
            "enabled=1" \
            "gpgcheck=1" \
            "repo_gpgcheck=1" \
            "gpgkey=file:///etc/pki/rpm-gpg/RPM-GPG-KEY-Microsoft" \
            "sslverify=1" \
            > /etc/yum.repos.d/microsoft-prod.repo
          dnf -y makecache --disablerepo="*" --enablerepo="packages-microsoft-com-prod"
          echo "MICROSOFT_RPM_TRUST_EVIDENCE rid=rhel.9-x64 key_sha256=$MICROSOFT_SIGNING_KEY_SHA256 key_fingerprint=$MICROSOFT_SIGNING_KEY_FINGERPRINT local_key=$microsoft_local_key repository=packages-microsoft-com-prod gpgcheck=1 repo_gpgcheck=1 sslverify=1"
          dnf repoquery --disablerepo="*" --enablerepo="packages-microsoft-com-prod" --qf "%{name}-%{evr}.%{arch}|%{repoid}" "$POWERSHELL_RPM_PACKAGE_NEVRA" | grep -Fqx "$POWERSHELL_RPM_PACKAGE_NEVRA|packages-microsoft-com-prod"
          dnf install -y "$POWERSHELL_RPM_PACKAGE_NEVRA"
          installed_powershell_package_identity="$(rpm -q --qf '%{NAME}|%{VERSION}-%{RELEASE}|%{ARCH}|%{VENDOR}' powershell)"
          test "$installed_powershell_package_identity" = "powershell|7.6.4-1.rh|x86_64|(none)"
          installed_powershell_version="$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | tr -d '\r')"
          process_architecture="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()' | tr -d '\r')"
          test "$installed_powershell_version" = "$POWERSHELL_PACKAGE_SEMANTIC_VERSION"
          test "$process_architecture" = "X64"
          echo "POWERSHELL_RPM_TOOLCHAIN_EVIDENCE rid=rhel.9-x64 package_nevra=$POWERSHELL_RPM_PACKAGE_NEVRA package_identity=$installed_powershell_package_identity semantic_version=$installed_powershell_version process_arch=$process_architecture key_package=$installed_microsoft_key_package key_fingerprint=$installed_key_fingerprints repository=packages-microsoft-com-prod"
          echo "RHEL_9_UBI_CONTAINER_EVIDENCE profile=${{ inputs.runtime_profile }} ID=$ID VERSION_ID=$VERSION_ID PLATFORM_ID=$PLATFORM_ID UNAME=$(uname -m) PROCESS_ARCH=$process_architecture RPM_ARCH=$(rpm --eval '%{_arch}') LIBC=$container_libc"
          pwsh --version
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Download managed package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-rhel/nupkg-managed
      - name: Download RHEL runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-rhel.9-x64-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-rhel/nupkg-rhel.9-x64-${{ inputs.runtime_profile }}
      - name: Verify selected real RHEL package artifacts
