              echo "Expected Debian 12 container, got ${VERSION_ID:-unknown}." >&2
              exit 1
              ;;
          esac
          container_libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n 1)"
          echo "DEBIAN_12_CONTAINER_EVIDENCE ID=$ID VERSION_ID=$VERSION_ID LIBC=$container_libc"

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            apt-transport-https \
            ca-certificates \
            curl \
            git \
            gnupg \
            gzip \
            libicu72 \
            libssl3 \
            tar \
            zlib1g
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg
          chmod go+r /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/microsoft-prod.list
