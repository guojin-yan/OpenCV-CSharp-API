name: pack

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: OpenCV version aligned with package version
        required: true
        default: 5.0.0
      package_revision:
        description: Package revision for this OpenCV version
        required: true
        default: "0"
      rid:
        description: Runtime identifier to pack; use all for the configured matrix
        required: true
        default: all
      runtime_profile:
        description: Runtime profile to pack; use all for full and mini
        required: true
        default: all
      validate_synthetic_runtime:
        description: Use synthetic runtime inputs for package-surface validation only
        required: true
        default: "true"
      native_runtime_dir:
        description: Existing real native wrapper runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_runtime_dir:
        description: Existing real OpenCV runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_source_dir:
        description: Existing real OpenCV source directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_install_dir:
        description: Optional existing real OpenCV install directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      real_runtime_artifact_run_id:
        description: Optional workflow run id containing runtime-input-<rid>-<profile> artifact handoffs when synthetic validation is false
        required: false
        default: ""
      publish_github_packages:
        description: Publish packages to GitHub Packages; requires real runtime inputs
        required: true
        default: "false"

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Reject synthetic publish inputs
        if: ${{ inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Publishing packages requires real native runtime inputs; synthetic runtime inputs validate package shape only."
      - name: Check project invariants
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1

  pack-managed:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Restore
        run: dotnet restore ./OpenCV-CSharp-API.slnx
      - name: Build
        run: dotnet build ./OpenCV-CSharp-API.slnx -c Release --no-restore
      - name: Pack managed API
        shell: pwsh
        run: |
          $packageRevision = [int]'${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Pack-Managed.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -PackageRevision $packageRevision `
            -NoBuild `
            -NoRestore
      - name: Upload managed package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish managed package
        if: inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime != 'true'
        shell: pwsh
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate

  pack-runtime:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: full
            os: windows-latest
          - rid: win-x64
            profile: mini
            os: windows-latest
          - rid: win-x86
            profile: full
            os: windows-latest
          - rid: win-x86
            profile: mini
            os: windows-latest
          - rid: win-arm64
            profile: full
            os: windows-latest
          - rid: win-arm64
            profile: mini
            os: windows-latest
          - rid: ubuntu.22.04-x64
            profile: full
            os: ubuntu-22.04
          - rid: ubuntu.22.04-x64
            profile: mini
            os: ubuntu-22.04
          - rid: ubuntu.22.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.22.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-x64
            profile: full
            os: ubuntu-24.04
          - rid: ubuntu.24.04-x64
            profile: mini
            os: ubuntu-24.04
          - rid: ubuntu.24.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: debian.12-x64
            profile: full
            os: ubuntu-24.04
          - rid: debian.12-x64
            profile: mini
            os: ubuntu-24.04
          - rid: debian.12-arm64
            profile: full
            os: ubuntu-24.04
          - rid: debian.12-arm64
            profile: mini
            os: ubuntu-24.04
          - rid: fedora.40-x64
            profile: full
            os: ubuntu-24.04
          - rid: fedora.40-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: full
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm64
            profile: full
            os: ubuntu-24.04
          - rid: android-arm64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm
            profile: full
            os: ubuntu-24.04
          - rid: android-arm
            profile: mini
            os: ubuntu-24.04
          - rid: android-x64
            profile: full
            os: ubuntu-24.04
          - rid: android-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-x86
            profile: full
            os: ubuntu-24.04
          - rid: android-x86
            profile: mini
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Reject synthetic publish
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Synthetic runtime inputs validate package shape only and must not be published."
      - name: Skip unmatched matrix entry
        if: ${{ !((inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile)) }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - name: Create synthetic runtime inputs
        id: synthetic
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: |
          $result = pwsh -NoProfile -File ./scripts/New-SyntheticRuntimeInputs.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' | ConvertFrom-Json
          "native_runtime_dir=$($result.NativeWrapperDir)" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$($result.OpenCvRuntimeDir)" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$($result.OpenCvSourceDir)" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$($result.OpenCvInstallDir)" >> $env:GITHUB_OUTPUT
      - name: Download real runtime input artifact
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' && inputs.real_runtime_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.real_runtime_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
      - name: Validate real runtime input paths
        id: real
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          $missingGuidance = "pack.yml does not build real runtime inputs; provide paths that already exist on the selected runner or set real_runtime_artifact_run_id to download runtime-input-${{ matrix.rid }}-${{ matrix.profile }} before disabling synthetic validation."
          $nativeRuntimeDir = '${{ inputs.native_runtime_dir }}'
          $openCvRuntimeDir = '${{ inputs.opencv_runtime_dir }}'
          $openCvSourceDir = '${{ inputs.opencv_source_dir }}'
          $openCvInstallDir = '${{ inputs.opencv_install_dir }}'
          $artifactRunId = '${{ inputs.real_runtime_artifact_run_id }}'

          if (-not [string]::IsNullOrWhiteSpace($artifactRunId)) {
            $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}'
            $nativeRuntimeDir = Join-Path $artifactRoot 'native-wrapper'
            $openCvRuntimeDir = Join-Path $artifactRoot 'opencv-runtime'
            $openCvSourceDir = Join-Path $artifactRoot 'opencv-source'

            $artifactInstallDir = Join-Path $artifactRoot 'opencv-install'
            if (Test-Path -LiteralPath $artifactInstallDir -PathType Container) {
              $openCvInstallDir = $artifactInstallDir
            }
            else {
              $openCvInstallDir = ''
            }
          }

          if ([string]::IsNullOrWhiteSpace($nativeRuntimeDir) -or -not (Test-Path -LiteralPath $nativeRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires native_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvRuntimeDir) -or -not (Test-Path -LiteralPath $openCvRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvSourceDir) -or -not (Test-Path -LiteralPath $openCvSourceDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_source_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if (-not [string]::IsNullOrWhiteSpace($openCvInstallDir) -and -not (Test-Path -LiteralPath $openCvInstallDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_install_dir to be an existing directory when provided. $missingGuidance"
          }

          "native_runtime_dir=$nativeRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$openCvRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$openCvSourceDir" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$openCvInstallDir" >> $env:GITHUB_OUTPUT
      - name: Pack runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) }}
        shell: pwsh
        run: |
          $packageRevision = [int]'${{ inputs.package_revision }}'
          $nativeRuntimeDir = '${{ steps.synthetic.outputs.native_runtime_dir }}'
          $openCvRuntimeDir = '${{ steps.synthetic.outputs.opencv_runtime_dir }}'
          $openCvSourceDir = '${{ steps.synthetic.outputs.opencv_source_dir }}'
          $openCvInstallDir = '${{ steps.synthetic.outputs.opencv_install_dir }}'

          if ('${{ inputs.validate_synthetic_runtime }}' -ne 'true') {
            $nativeRuntimeDir = '${{ steps.real.outputs.native_runtime_dir }}'
            $openCvRuntimeDir = '${{ steps.real.outputs.opencv_runtime_dir }}'
            $openCvSourceDir = '${{ steps.real.outputs.opencv_source_dir }}'
            $openCvInstallDir = '${{ steps.real.outputs.opencv_install_dir }}'
          }

          if ([string]::IsNullOrWhiteSpace($nativeRuntimeDir) -or
              [string]::IsNullOrWhiteSpace($openCvRuntimeDir) -or
              [string]::IsNullOrWhiteSpace($openCvSourceDir)) {
            throw "Runtime packaging requires native_runtime_dir, opencv_runtime_dir, and opencv_source_dir when synthetic validation is disabled."
          }

          $packArgs = @(
            '-Rid', '${{ matrix.rid }}',
            '-RuntimeProfile', '${{ matrix.profile }}',
            '-OpenCvVersion', '${{ inputs.opencv_version }}',
            '-PackageRevision', $packageRevision,
            '-StageRuntime',
            '-OpenCvNativeRuntimeDir', $nativeRuntimeDir,
            '-OpenCvRuntimeDir', $openCvRuntimeDir,
            '-OpenCvSourceDir', $openCvSourceDir,
            '-RuntimeProject', './packaging/runtime/JYPPX.OpenCV.runtime/JYPPX.OpenCV.runtime.csproj'
          )

          if (-not [string]::IsNullOrWhiteSpace($openCvInstallDir)) {
            $packArgs += @('-OpenCvInstallDir', $openCvInstallDir)
          }

          if ('${{ inputs.validate_synthetic_runtime }}' -eq 'true') {
            $packArgs += @('-SyntheticRuntimeInputs')
          }

          if ('${{ inputs.publish_github_packages }}' -eq 'true') {
            $packArgs += @('-RequireReleasePreflight')
          }

          pwsh -NoProfile -File ./scripts/Pack-Runtime.ps1 @packArgs
      - name: Upload runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) }}
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate

  verify-artifacts:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'all' && inputs.runtime_profile == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/pack-download
      - name: Verify package artifact matrix
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          $expectedSyntheticRuntimeInputs = '${{ inputs.validate_synthetic_runtime }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-download `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs $expectedSyntheticRuntimeInputs

  verify-consumers:
    needs:
      - verify-artifacts
    if: ${{ inputs.rid == 'all' && inputs.runtime_profile == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/pack-download
      - name: Verify package consumer restore
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-download `
            -ExpectedPackageVersion $packageVersion

  verify-targeted-real:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ ((inputs.rid == 'ubuntu.24.04-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini')) || (inputs.rid == 'ubuntu.22.04-x64' && inputs.runtime_profile == 'full')) && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ${{ inputs.rid == 'ubuntu.22.04-x64' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted/nupkg-managed
      - name: Download selected runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted/nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
      - name: Verify selected real package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          $runtimeRid = '${{ inputs.rid }}'
          $runtimeProfile = '${{ inputs.runtime_profile }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid $runtimeRid `
            -SelectedRuntimeProfile $runtimeProfile
      - name: Restore, build, and run selected real package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          $runtimeRid = '${{ inputs.rid }}'
          $runtimeProfile = '${{ inputs.runtime_profile }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid $runtimeRid `
            -SelectedRuntimeProfile $runtimeProfile `
            -RunNativeSmoke

  verify-targeted-real-ubuntu-arm64:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'ubuntu.24.04-arm64' && inputs.runtime_profile == 'full' && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Verify native Ubuntu ARM64 consumer boundary
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "${ID:-}" = "ubuntu"
          test "${VERSION_ID:-}" = "24.04"
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          libc="$(getconf GNU_LIBC_VERSION)"
          echo "UBUNTU_24_04_ARM64_CONSUMER_EVIDENCE ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown} ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc"
          dotnet --info
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-ubuntu-arm64/nupkg-managed
      - name: Download Ubuntu ARM64 runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-ubuntu.24.04-arm64-full
          path: artifacts/pack-targeted-ubuntu-arm64/nupkg-ubuntu.24.04-arm64-full
      - name: Verify selected real Ubuntu ARM64 package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-ubuntu-arm64 `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid ubuntu.24.04-arm64 `
            -SelectedRuntimeProfile full
      - name: Restore, build, and run selected real Ubuntu ARM64 package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-ubuntu-arm64 `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid ubuntu.24.04-arm64 `
            -SelectedRuntimeProfile full `
            -RunNativeSmoke

  verify-targeted-real-ubuntu2204-arm64:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'ubuntu.22.04-arm64' && inputs.runtime_profile == 'full' && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-managed
      - name: Download Ubuntu 22.04 ARM64 runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-ubuntu.22.04-arm64-full
          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-ubuntu.22.04-arm64-full
      - name: Verify and run selected real Ubuntu 22.04 ARM64 package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.opencv_version }}.${{ inputs.package_revision }}
          POWERSHELL_VERSION: 7.4.17
          POWERSHELL_SHA256: 68f3874cdb6cd564acf404103dfc410ee85435b02f0ad648e73a958853175d6c
          UBUNTU_2204_ARM64_IMAGE: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(docker info --format '{{.Architecture}}')" = "aarch64"
          docker pull "$UBUNTU_2204_ARM64_IMAGE"
          test "$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Architecture}}')" = "arm64"
          image_id="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Id}}')"
          image_digests="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{join .RepoDigests ","}}')"
          printf '%s\n' "$image_digests" | grep -Fq 'ubuntu@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982'
          echo "UBUNTU_22_04_ARM64_CONSUMER_HOST_EVIDENCE ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown} UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) DOCKER_ARCH=$(docker info --format '{{.Architecture}}')"
          echo "UBUNTU_22_04_ARM64_CONSUMER_IMAGE_EVIDENCE IMAGE=$UBUNTU_2204_ARM64_IMAGE IMAGE_ID=$image_id REPO_DIGESTS=$image_digests ARCH=$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Architecture}}') OS=$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Os}}')"

          docker run --rm \
            -e PACKAGE_VERSION="$PACKAGE_VERSION" \
            -e POWERSHELL_VERSION="$POWERSHELL_VERSION" \
            -e POWERSHELL_SHA256="$POWERSHELL_SHA256" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /tmp \
            "$UBUNTU_2204_ARM64_IMAGE" \
            bash -lc '
              set -euo pipefail
              . /etc/os-release
              test "${ID:-}" = "ubuntu"
              test "${VERSION_ID:-}" = "22.04"
              test "$(uname -m)" = "aarch64"
              test "$(dpkg --print-architecture)" = "arm64"

              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                curl \
                gzip \
                libicu70 \
                libssl3 \
                libunwind8 \
                tar \
                zlib1g

              powershell_archive="/tmp/powershell-$POWERSHELL_VERSION-linux-arm64.tar.gz"
              curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v$POWERSHELL_VERSION/powershell-$POWERSHELL_VERSION-linux-arm64.tar.gz" -o "$powershell_archive"
              echo "$POWERSHELL_SHA256  $powershell_archive" | sha256sum -c -
              install -d /opt/microsoft/powershell/7
              tar -xzf "$powershell_archive" -C /opt/microsoft/powershell/7
              chmod +x /opt/microsoft/powershell/7/pwsh
              ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh

              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              bash /tmp/dotnet-install.sh --channel 8.0 --architecture arm64 --install-dir /usr/share/dotnet
              ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet

              libc="$(getconf GNU_LIBC_VERSION)"
              echo "UBUNTU_22_04_ARM64_CONSUMER_EVIDENCE ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc POWERSHELL_VERSION=$POWERSHELL_VERSION POWERSHELL_SHA256=$POWERSHELL_SHA256"
              pwsh --version
              dotnet --info

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackArtifactMatrixSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-ubuntu2204-arm64 \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid ubuntu.22.04-arm64 \
                -SelectedRuntimeProfile full

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackConsumerRestoreSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-ubuntu2204-arm64 \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid ubuntu.22.04-arm64 \
                -SelectedRuntimeProfile full \
                -RunNativeSmoke
            '

