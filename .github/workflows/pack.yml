              esac
              if [ "$(uname -m)" != "x86_64" ]; then
                echo "Expected Alpine x86_64, got $(uname -m)." >&2
                exit 1
              fi
              grep -q "/v3.20/main" /etc/apk/repositories
              grep -q "/v3.20/community" /etc/apk/repositories
              echo "ALPINE_3_20_REPOSITORY_EVIDENCE v3.20/main,v3.20/community"

              apk add --no-cache \
                ca-certificates \
                dotnet8-sdk \
                powershell

              musl_loader="/lib/ld-musl-x86_64.so.1"
              test -x "$musl_loader"
              musl_version="$("$musl_loader" 2>&1 | sed -n "s/^Version //p" | head -n 1)"
              test -n "$musl_version"
              echo "ALPINE_3_20_CONTAINER_EVIDENCE ID=$ID VERSION_ID=$VERSION_ID ARCH=$(uname -m) LIBC=musl $musl_version"
              pwsh --version
              dotnet --info

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackArtifactMatrixSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-alpine \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid alpine.3.20-x64 \
                -SelectedRuntimeProfile full

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackConsumerRestoreSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-alpine \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid alpine.3.20-x64 \
                -SelectedRuntimeProfile full \
                -RunNativeSmoke
            '
