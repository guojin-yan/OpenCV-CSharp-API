  verify-targeted-real-alpine:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'alpine.3.20-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini') && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download managed package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-alpine/nupkg-managed
      - name: Download Alpine runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-alpine.3.20-x64-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-alpine/nupkg-alpine.3.20-x64-${{ inputs.runtime_profile }}
      - name: Verify and run selected real Alpine package inside Alpine 3.20
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
          OPENCV_VERSION: ${{ inputs.opencv_version }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          POWERSHELL_ALPINE_PACKAGE_VERSION: 7.4.6-r1
          POWERSHELL_ALPINE_SEMANTIC_VERSION: 7.4.6
          ALPINE_3_20_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
        run: |
          set -euo pipefail
          docker pull "$ALPINE_3_20_IMAGE"
          test "$(docker image inspect "$ALPINE_3_20_IMAGE" --format '{{.Architecture}}')" = "amd64"
          alpine_image_id="$(docker image inspect "$ALPINE_3_20_IMAGE" --format '{{.Id}}')"
          alpine_image_digests="$(docker image inspect "$ALPINE_3_20_IMAGE" --format '{{join .RepoDigests ","}}')"
          printf '%s\n' "$alpine_image_digests" | grep -Fq 'alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          echo "ALPINE_3_20_CONSUMER_HOST_EVIDENCE ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown} UNAME=$(uname -m) DOCKER_ARCH=$(docker info --format '{{.Architecture}}')"
          echo "ALPINE_3_20_CONSUMER_IMAGE_EVIDENCE IMAGE=$ALPINE_3_20_IMAGE IMAGE_ID=$alpine_image_id REPO_DIGESTS=$alpine_image_digests ARCH=$(docker image inspect "$ALPINE_3_20_IMAGE" --format '{{.Architecture}}') OS=$(docker image inspect "$ALPINE_3_20_IMAGE" --format '{{.Os}}')"
          docker run --rm \
            -e PACKAGE_VERSION="$PACKAGE_VERSION" \
            -e OPENCV_VERSION="$OPENCV_VERSION" \
            -e RUNTIME_PROFILE="$RUNTIME_PROFILE" \
            -e POWERSHELL_ALPINE_PACKAGE_VERSION="$POWERSHELL_ALPINE_PACKAGE_VERSION" \
            -e POWERSHELL_ALPINE_SEMANTIC_VERSION="$POWERSHELL_ALPINE_SEMANTIC_VERSION" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /tmp \
            "$ALPINE_3_20_IMAGE" \
            sh -ec '
              set -eu
              cat /etc/os-release
              . /etc/os-release
              if [ "${ID:-}" != "alpine" ]; then
                echo "Expected Alpine Linux container, got ${ID:-unknown}." >&2
                exit 1
              fi
              case "${VERSION_ID:-}" in
                3.20|3.20.*) ;;
                *)
                  echo "Expected Alpine Linux 3.20, got ${VERSION_ID:-unknown}." >&2
                  exit 1
                  ;;
              esac
              if [ "$(uname -m)" != "x86_64" ]; then
                echo "Expected Alpine x86_64, got $(uname -m)." >&2
                exit 1
              fi
              test "$(apk --print-arch)" = "x86_64"
              grep -q "/v3.20/main" /etc/apk/repositories
              grep -q "/v3.20/community" /etc/apk/repositories
              echo "ALPINE_3_20_REPOSITORY_EVIDENCE v3.20/main,v3.20/community"

              apk add --no-cache \
                binutils \
                ca-certificates \
                dotnet8-sdk \
                powershell=$POWERSHELL_ALPINE_PACKAGE_VERSION \
                unzip

              installed_powershell_package="$(apk info -e -vv powershell)"
              test "$installed_powershell_package" = "powershell-$POWERSHELL_ALPINE_PACKAGE_VERSION - A cross-platform automation and configuration tool/framework"
              installed_powershell_version="$(pwsh -NoProfile -Command "\$PSVersionTable.PSVersion.ToString()" | tr -d "\\r")"
              powershell_process_architecture="$(pwsh -NoProfile -Command "[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()" | tr -d "\\r")"
              test "$installed_powershell_version" = "$POWERSHELL_ALPINE_SEMANTIC_VERSION"
              test "$powershell_process_architecture" = "X64"
              echo "POWERSHELL_APK_TOOLCHAIN_EVIDENCE rid=alpine.3.20-x64 package=powershell package_version=$POWERSHELL_ALPINE_PACKAGE_VERSION semantic_version=$installed_powershell_version process_arch=$powershell_process_architecture repository=v3.20/community"

              musl_loader="/lib/ld-musl-x86_64.so.1"
              test -x "$musl_loader"
              musl_version="$("$musl_loader" 2>&1 | sed -n "s/^Version //p" | head -n 1)"
              test -n "$musl_version"
              test "$musl_version" = "1.2.5"
              echo "ALPINE_3_20_CONTAINER_EVIDENCE ID=$ID VERSION_ID=$VERSION_ID ARCH=$(uname -m) LIBC=musl $musl_version"
              pwsh --version
              dotnet --info

              case "$RUNTIME_PROFILE" in
                full)
                  modules="core imgproc imgcodecs videoio flann geometry calib stereo dnn ml objdetect photo features video highgui stitching ptcloud"
                  expected_canonical_count=18
                  expected_opencv_count=17
                  expected_runtime_file_count=52
                  expected_direct_opencv=17
                  ;;
                mini)
                  modules="core imgproc imgcodecs videoio geometry flann"
                  expected_canonical_count=7
                  expected_opencv_count=6
                  expected_runtime_file_count=19
                  expected_direct_opencv=6
                  ;;
                *)
                  echo "Unsupported Alpine package profile: $RUNTIME_PROFILE" >&2
                  exit 1
                  ;;
              esac

              runtime_artifact_dir="/workspace/artifacts/pack-targeted-alpine/nupkg-alpine.3.20-x64-$RUNTIME_PROFILE"
              package_path="$(find "$runtime_artifact_dir" -maxdepth 1 -type f -name "*.nupkg" -print -quit)"
              test -n "$package_path"
              extract_root="/tmp/opencv-alpine-package-audit-$RUNTIME_PROFILE"
              rm -rf "$extract_root"
              mkdir -p "$extract_root"
              unzip -q "$package_path" -d "$extract_root"
              native_dir="$extract_root/runtimes/alpine.3.20-x64/native"
              test -d "$native_dir"
              expected_names="/tmp/alpine-$RUNTIME_PROFILE-expected-runtime-files.txt"
              actual_names="/tmp/alpine-$RUNTIME_PROFILE-actual-runtime-files.txt"
              printf "%s\n" "libJYPPX.OpenCV.Native.so" > "$expected_names"
              for module in $modules; do
                printf "%s\n" "libopencv_${module}.so" "libopencv_${module}.so.500" "libopencv_${module}.so.$OPENCV_VERSION" >> "$expected_names"
              done
              sort -o "$expected_names" "$expected_names"
              for path in "$native_dir"/*; do basename "$path"; done | sort > "$actual_names"
              test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
              diff -u "$expected_names" "$actual_names"

              alpine_elf_count=0
              alpine_origin_count=0
              alpine_producer_path_count=0
              alpine_missing_dependency_count=0
              alpine_opencv_count=0
              for elf in "$native_dir/libJYPPX.OpenCV.Native.so" "$native_dir"/libopencv_*.so."$OPENCV_VERSION"; do
                test -f "$elf"
                readelf -h "$elf" | grep -q "Machine:.*X86-64"
                case "$(basename "$elf")" in libopencv_*) alpine_opencv_count=$((alpine_opencv_count + 1)) ;; esac
                alpine_elf_count=$((alpine_elf_count + 1))
                dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
                printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
                alpine_origin_count=$((alpine_origin_count + 1))
                if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then alpine_producer_path_count=$((alpine_producer_path_count + 1)); fi
                missing="$(ldd "$elf" | grep "not found" || true)"
                if [ -n "$missing" ]; then printf "%s\n" "$missing" >&2; alpine_missing_dependency_count=$((alpine_missing_dependency_count + 1)); fi
              done
              direct_opencv_dependencies="$(readelf -d "$native_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
              test "$alpine_opencv_count" -eq "$expected_opencv_count"
              test "$alpine_elf_count" -eq "$expected_canonical_count"
              test "$alpine_origin_count" -eq "$expected_canonical_count"
              test "$alpine_producer_path_count" -eq 0
              test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
              test "$alpine_missing_dependency_count" -eq 0
              echo "ALPINE_3_20_PACKAGE_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=X86-64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0"

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackArtifactMatrixSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-alpine \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid alpine.3.20-x64 \
                 -SelectedRuntimeProfile "$RUNTIME_PROFILE"

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackConsumerRestoreSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-alpine \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid alpine.3.20-x64 \
                 -SelectedRuntimeProfile "$RUNTIME_PROFILE" \
                -RunNativeSmoke
            '
