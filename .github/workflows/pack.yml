          test "$missing_dependency_count" -eq 0
          echo "DEBIAN_12_X64_PACKAGE_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=X86-64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 triplets_equal=true"
      - name: Restore, build, and run selected real Debian package consumer
