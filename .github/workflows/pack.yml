name: pack

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: OpenCV version aligned with package version
        required: true
        default: 5.0.0
      package_revision:
        description: Package revision for this OpenCV version
        required: true
        default: "0"
      rid:
        description: Runtime identifier to pack; use all for the configured matrix
        required: true
        default: all
      runtime_profile:
        description: Runtime profile to pack; use all for full and mini
        required: true
        default: all
      validate_synthetic_runtime:
        description: Use synthetic runtime inputs for package-surface validation only
        required: true
        default: "true"
      native_runtime_dir:
        description: Existing real native wrapper runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_runtime_dir:
        description: Existing real OpenCV runtime directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_source_dir:
        description: Existing real OpenCV source directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      opencv_install_dir:
        description: Optional existing real OpenCV install directory on the selected runner when synthetic validation is false
        required: false
        default: ""
      real_runtime_artifact_run_id:
        description: Optional workflow run id containing runtime-input-<rid>-<profile> artifact handoffs when synthetic validation is false
        required: false
        default: ""
      publish_github_packages:
        description: Publish packages to GitHub Packages; requires real runtime inputs
        required: true
        default: "false"

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Reject synthetic publish inputs
        if: ${{ inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Publishing packages requires real native runtime inputs; synthetic runtime inputs validate package shape only."
      - name: Check project invariants
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1

  pack-managed:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Restore
        run: dotnet restore ./OpenCV-CSharp-API.slnx
      - name: Build
        run: dotnet build ./OpenCV-CSharp-API.slnx -c Release --no-restore
      - name: Pack managed API
        shell: pwsh
        run: |
          $packageRevision = [int]'${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Pack-Managed.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -PackageRevision $packageRevision `
            -NoBuild `
            -NoRestore
      - name: Upload managed package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish managed package
        if: inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime != 'true'
        shell: pwsh
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate

  pack-runtime:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: full
            os: windows-latest
          - rid: win-x64
            profile: mini
            os: windows-latest
          - rid: win-x86
            profile: full
            os: windows-latest
          - rid: win-x86
            profile: mini
            os: windows-latest
          - rid: win-arm64
            profile: full
            os: windows-11-vs2026-arm
          - rid: win-arm64
            profile: mini
            os: windows-11-vs2026-arm
          - rid: ubuntu.22.04-x64
            profile: full
            os: ubuntu-22.04
          - rid: ubuntu.22.04-x64
            profile: mini
            os: ubuntu-22.04
          - rid: ubuntu.22.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.22.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-x64
            profile: full
            os: ubuntu-24.04
          - rid: ubuntu.24.04-x64
            profile: mini
            os: ubuntu-24.04
          - rid: ubuntu.24.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: debian.12-x64
            profile: full
            os: ubuntu-24.04
          - rid: debian.12-x64
            profile: mini
            os: ubuntu-24.04
          - rid: debian.12-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: debian.12-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: fedora.40-x64
            profile: full
            os: ubuntu-24.04
          - rid: fedora.40-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rhel.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: full
            os: ubuntu-24.04
          - rid: rocky.9-x64
            profile: mini
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: full
            os: ubuntu-24.04
          - rid: alpine.3.20-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm64
            profile: full
            os: ubuntu-24.04
          - rid: android-arm64
            profile: mini
            os: ubuntu-24.04
          - rid: android-arm
            profile: full
            os: ubuntu-24.04
          - rid: android-arm
            profile: mini
            os: ubuntu-24.04
          - rid: android-x64
            profile: full
            os: ubuntu-24.04
          - rid: android-x64
            profile: mini
            os: ubuntu-24.04
          - rid: android-x86
            profile: full
            os: ubuntu-24.04
          - rid: android-x86
            profile: mini
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Reject synthetic publish
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: throw "Synthetic runtime inputs validate package shape only and must not be published."
      - name: Skip unmatched matrix entry
        if: ${{ !((inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile)) }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - name: Create synthetic runtime inputs
        id: synthetic
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime == 'true' }}
        shell: pwsh
        run: |
          $result = pwsh -NoProfile -File ./scripts/New-SyntheticRuntimeInputs.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' | ConvertFrom-Json
          "native_runtime_dir=$($result.NativeWrapperDir)" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$($result.OpenCvRuntimeDir)" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$($result.OpenCvSourceDir)" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$($result.OpenCvInstallDir)" >> $env:GITHUB_OUTPUT
      - name: Download real runtime input artifact
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' && inputs.real_runtime_artifact_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.real_runtime_artifact_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
      - name: Validate real runtime input paths
        id: real
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          $missingGuidance = "pack.yml does not build real runtime inputs; provide paths that already exist on the selected runner or set real_runtime_artifact_run_id to download runtime-input-${{ matrix.rid }}-${{ matrix.profile }} before disabling synthetic validation."
          $nativeRuntimeDir = '${{ inputs.native_runtime_dir }}'
          $openCvRuntimeDir = '${{ inputs.opencv_runtime_dir }}'
          $openCvSourceDir = '${{ inputs.opencv_source_dir }}'
          $openCvInstallDir = '${{ inputs.opencv_install_dir }}'
          $artifactRunId = '${{ inputs.real_runtime_artifact_run_id }}'

          if (-not [string]::IsNullOrWhiteSpace($artifactRunId)) {
            $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'artifacts/real-runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}'
            $nativeRuntimeDir = Join-Path $artifactRoot 'native-wrapper'
            $openCvRuntimeDir = Join-Path $artifactRoot 'opencv-runtime'
            $openCvSourceDir = Join-Path $artifactRoot 'opencv-source'

            $artifactInstallDir = Join-Path $artifactRoot 'opencv-install'
            if (Test-Path -LiteralPath $artifactInstallDir -PathType Container) {
              $openCvInstallDir = $artifactInstallDir
            }
            else {
              $openCvInstallDir = ''
            }
          }

          if ([string]::IsNullOrWhiteSpace($nativeRuntimeDir) -or -not (Test-Path -LiteralPath $nativeRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires native_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvRuntimeDir) -or -not (Test-Path -LiteralPath $openCvRuntimeDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_runtime_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if ([string]::IsNullOrWhiteSpace($openCvSourceDir) -or -not (Test-Path -LiteralPath $openCvSourceDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_source_dir to be an existing directory on the selected runner. $missingGuidance"
          }

          if (-not [string]::IsNullOrWhiteSpace($openCvInstallDir) -and -not (Test-Path -LiteralPath $openCvInstallDir -PathType Container)) {
            throw "Real runtime packaging requires opencv_install_dir to be an existing directory when provided. $missingGuidance"
          }

          "native_runtime_dir=$nativeRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_runtime_dir=$openCvRuntimeDir" >> $env:GITHUB_OUTPUT
          "opencv_source_dir=$openCvSourceDir" >> $env:GITHUB_OUTPUT
          "opencv_install_dir=$openCvInstallDir" >> $env:GITHUB_OUTPUT
      - name: Validate Windows x64 runtime input provenance
        if: ${{ matrix.rid == 'win-x64' && (matrix.profile == 'full' || matrix.profile == 'mini') && inputs.rid == 'win-x64' && inputs.runtime_profile == matrix.profile && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          $profileName = '${{ matrix.profile }}'
          if ([string]::IsNullOrWhiteSpace('${{ inputs.real_runtime_artifact_run_id }}')) {
            throw "Non-synthetic win-x64/$profileName packaging requires an explicit runtime-input producer run id."
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/real-runtime-inputs/win-x64-$profileName"
          $provenancePath = Join-Path $artifactRoot 'runtime-input.provenance.json'
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $profile = @($matrix.profiles | Where-Object { $_.name -eq $profileName })
          if ($profile.Count -ne 1) {
            throw "Selected Windows runtime profile was not found exactly once: $profileName"
          }

          $binarySuffix = (('${{ inputs.opencv_version }}' -split '\.') | Select-Object -First 3) -join ''
          $compatibilityLoaderName = 'Open' + 'Cv5Sharp.Native.dll'
          $expectedModules = @($profile[0].modules)
          $expectedRuntimeFileCount = $expectedModules.Count
          $expectedPayloadFileCount = $expectedModules.Count + 2
          $actualModules = @($provenance.RequiredModules)
          $expectedRuntimeNames = @($expectedModules | ForEach-Object { "opencv_$($_)$binarySuffix.dll" })
          $actualRuntimeNames = @($provenance.RuntimeFiles | ForEach-Object { [string]$_.FileName })
          $actualLoaderNames = @($provenance.NativeLoaderFiles | ForEach-Object { [string]$_.FileName })
          $missingModules = @($expectedModules | Where-Object { $actualModules -notcontains $_ })
          $unexpectedModules = @($actualModules | Where-Object { $expectedModules -notcontains $_ })
          $missingRuntimeFiles = @($expectedRuntimeNames | Where-Object { $actualRuntimeNames -notcontains $_ })
          $unexpectedRuntimeFiles = @($actualRuntimeNames | Where-Object { $expectedRuntimeNames -notcontains $_ })

          if ($provenance.Rid -ne 'win-x64' -or
              $provenance.PlatformFamily -ne 'windows' -or
              $provenance.RuntimeProfile -ne $profileName -or
              $provenance.RuntimeProfilePackageIdSuffix -ne [string]$profile[0].packageIdSuffix -or
              $provenance.BuildList -ne [string]$profile[0].buildList -or
              [bool]$provenance.SyntheticRuntimeInputs -or
              $actualModules.Count -ne $expectedModules.Count -or
              $missingModules.Count -ne 0 -or
              $unexpectedModules.Count -ne 0 -or
              $actualRuntimeNames.Count -ne $expectedRuntimeFileCount -or
              $missingRuntimeFiles.Count -ne 0 -or
              $unexpectedRuntimeFiles.Count -ne 0 -or
              $actualLoaderNames.Count -ne 2 -or
              $actualLoaderNames -notcontains 'JYPPX.OpenCV.Native.dll' -or
              $actualLoaderNames -notcontains $compatibilityLoaderName) {
            throw "Windows runtime-input provenance does not match the exact win-x64/$profileName $expectedPayloadFileCount-DLL producer contract."
          }

          foreach ($requiredValue in @(
              [string]$provenance.RunnerImage,
              [string]$provenance.RunnerImageVersion,
              [string]$provenance.HostedOsCaption,
              [string]$provenance.HostedOsVersion,
              [string]$provenance.HostedOsBuildNumber,
              [string]$provenance.HostedCpuModel,
              [string]$provenance.HostedDiskAvailableBytes,
              [string]$provenance.VisualStudioVersion,
              [string]$provenance.MsvcVersion,
              [string]$provenance.WindowsSdkVersion,
              [string]$provenance.CMakeVersion,
              [string]$provenance.CompilerPath,
              [string]$provenance.OpenCvCMakeArguments,
              [string]$provenance.OpenCvCpuConfiguration,
              [string]$provenance.ExcludedForeignToolDirectories,
              [string]$provenance.OpenCvAsmConfiguration)) {
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Windows runtime-input provenance is missing required host/toolchain evidence."
            }
          }

          try {
            $excludedForeignToolDirectories = @(([string]$provenance.ExcludedForeignToolDirectories | ConvertFrom-Json))
          }
          catch {
            throw "Windows runtime-input provenance contains invalid excluded foreign tool directory JSON."
          }
          foreach ($excludedDirectory in $excludedForeignToolDirectories) {
            if ([string]::IsNullOrWhiteSpace([string]$excludedDirectory) -or
                -not [System.IO.Path]::IsPathRooted([string]$excludedDirectory)) {
              throw "Windows runtime-input provenance contains an invalid excluded PATH directory: $excludedDirectory"
            }
          }

          if ($profileName -eq 'mini') {
            try {
              $nativeWrapperSources = @(([string]$provenance.NativeWrapperSources | ConvertFrom-Json))
            }
            catch {
              throw "Windows mini runtime-input provenance contains invalid native wrapper source JSON."
            }
            $expectedMiniSources = @(
              'src/error_state.cpp',
              'src/version.cpp',
              'src/core/mat.cpp',
              'src/core/decomp.cpp',
              'src/core/operations.cpp',
              'src/videoio/videoio.cpp',
              'src/imgcodecs.cpp',
              'src/imgproc.cpp'
            )
            $missingSources = @($expectedMiniSources | Where-Object { $nativeWrapperSources -notcontains $_ })
            $unexpectedSources = @($nativeWrapperSources | Where-Object { $expectedMiniSources -notcontains $_ })
            if ([int]$provenance.NativeWrapperSourceCount -ne 8 -or
                [int]$provenance.NativeAbiFunctionCount -ne 304 -or
                $nativeWrapperSources.Count -ne 8 -or
                $missingSources.Count -ne 0 -or
                $unexpectedSources.Count -ne 0 -or
                $provenance.OpenCvExtraCMakeArgs -ne '-DCMAKE_ASM_COMPILER:FILEPATH=NOTFOUND' -or
                ([string]$provenance.OpenCvCMakeArguments).IndexOf('-DCMAKE_ASM_COMPILER:FILEPATH=NOTFOUND', [System.StringComparison]::Ordinal) -lt 0) {
              throw "Windows mini runtime-input provenance does not retain the exact 8-source/304-ABI reduced build evidence."
            }
          }

          $expectedAsmPattern = if ($profileName -eq 'mini') {
            '^CMAKE_ASM_COMPILER=NOTFOUND;OPENCV_DNN_MLAS_ENABLED=NOT_BUILT;OPENCV_DNN_MLAS_SKIP_REASON=dnn excluded by mini profile$'
          }
          else {
            '^CMAKE_ASM_COMPILER=NOTFOUND;OPENCV_DNN_MLAS_ENABLED=0;OPENCV_DNN_MLAS_SKIP_REASON=no ASM compiler available for (?:AMD64|amd64)$'
          }
          $peProfile = [regex]::Escape($profileName)
          $expectedPePattern = "^WINDOWS_PE_AUDIT_OK rid=win-x64 profile=$peProfile files=$expectedPayloadFileCount machine=AMD64 packaged_modules=$expectedRuntimeFileCount reachable_modules=$expectedRuntimeFileCount loader_opencv_imports=\d+ opencv_import_edges=\d+ missing_opencv_imports=0 loader_equal=true$"
          if ($provenance.HostedArchitecture -ne 'X64' -or
              $provenance.HostedProcessArchitecture -ne 'X64' -or
              $provenance.HostedPackageArchitecture -ne 'AMD64' -or
              -not ([string]$provenance.VisualStudioVersion).StartsWith('18.', [System.StringComparison]::Ordinal) -or
              $provenance.CMakeGenerator -ne 'Visual Studio 18 2026' -or
              $provenance.CMakePlatform -ne 'x64' -or
              $provenance.BuildConfiguration -ne 'Release' -or
              $provenance.OpenCvAsmConfiguration -notmatch $expectedAsmPattern -or
              $provenance.PeAuditEvidence -notmatch $expectedPePattern) {
            throw "Windows runtime-input provenance host, build, or PE evidence is not factual win-x64/$profileName."
          }
          Write-Host "WINDOWS_X64_RUNTIME_INPUT_PROVENANCE_OK profile=$profileName files=$expectedPayloadFileCount modules=$expectedRuntimeFileCount synthetic=false"
      - name: Validate Windows ARM64 runtime input provenance
        if: ${{ matrix.rid == 'win-arm64' && (matrix.profile == 'full' || matrix.profile == 'mini') && inputs.rid == 'win-arm64' && inputs.runtime_profile == matrix.profile && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          $profileName = '${{ matrix.profile }}'
          if ([string]::IsNullOrWhiteSpace('${{ inputs.real_runtime_artifact_run_id }}')) {
            throw "Non-synthetic win-arm64/$profileName packaging requires an explicit runtime-input producer run id."
          }

          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts/real-runtime-inputs/win-arm64-$profileName"
          $provenancePath = Join-Path $artifactRoot 'runtime-input.provenance.json'
          $provenance = Get-Content -LiteralPath $provenancePath -Raw | ConvertFrom-Json
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $profile = @($matrix.profiles | Where-Object { $_.name -eq $profileName })
          if ($profile.Count -ne 1) {
            throw "Selected Windows ARM64 runtime profile was not found exactly once: $profileName"
          }

          $binarySuffix = (('${{ inputs.opencv_version }}' -split '\.') | Select-Object -First 3) -join ''
          $compatibilityLoaderName = 'Open' + 'Cv5Sharp.Native.dll'
          $expectedModules = @($profile[0].modules)
          $expectedRuntimeFileCount = $expectedModules.Count
          $expectedPayloadFileCount = $expectedModules.Count + 2
          $expectedRuntimeNames = @($expectedModules | ForEach-Object { "opencv_$($_)$binarySuffix.dll" })
          $actualModules = @($provenance.RequiredModules)
          $actualRuntimeNames = @($provenance.RuntimeFiles | ForEach-Object { [string]$_.FileName })
          $actualLoaderNames = @($provenance.NativeLoaderFiles | ForEach-Object { [string]$_.FileName })
          if ($provenance.Rid -ne 'win-arm64' -or
              $provenance.PlatformFamily -ne 'windows' -or
              $provenance.RuntimeProfile -ne $profileName -or
              $provenance.RuntimeProfilePackageIdSuffix -ne [string]$profile[0].packageIdSuffix -or
              $provenance.BuildList -ne [string]$profile[0].buildList -or
              [bool]$provenance.SyntheticRuntimeInputs -or
              $actualModules.Count -ne $expectedRuntimeFileCount -or
              @($expectedModules | Where-Object { $actualModules -notcontains $_ }).Count -ne 0 -or
              @($actualModules | Where-Object { $expectedModules -notcontains $_ }).Count -ne 0 -or
              $actualRuntimeNames.Count -ne $expectedRuntimeFileCount -or
              @($expectedRuntimeNames | Where-Object { $actualRuntimeNames -notcontains $_ }).Count -ne 0 -or
              @($actualRuntimeNames | Where-Object { $expectedRuntimeNames -notcontains $_ }).Count -ne 0 -or
              $actualLoaderNames.Count -ne 2 -or
              $actualLoaderNames -notcontains 'JYPPX.OpenCV.Native.dll' -or
              $actualLoaderNames -notcontains $compatibilityLoaderName) {
            throw "Windows ARM64 runtime-input provenance does not match the exact win-arm64/$profileName $expectedPayloadFileCount-DLL producer contract."
          }

          foreach ($requiredValue in @(
              [string]$provenance.RunnerImage,
              [string]$provenance.RunnerImageVersion,
              [string]$provenance.HostedOsCaption,
              [string]$provenance.HostedOsVersion,
              [string]$provenance.HostedOsBuildNumber,
              [string]$provenance.HostedCpuModel,
              [string]$provenance.HostedMemoryBytes,
              [string]$provenance.HostedDiskAvailableBytes,
              [string]$provenance.VisualStudioVersion,
              [string]$provenance.MsvcVersion,
              [string]$provenance.WindowsSdkVersion,
              [string]$provenance.CMakeVersion,
              [string]$provenance.CompilerPath,
              [string]$provenance.OpenCvCMakeArguments,
              [string]$provenance.OpenCvCpuConfiguration,
              [string]$provenance.ExcludedForeignToolDirectories,
              [string]$provenance.OpenCvAsmConfiguration,
              [string]$provenance.OpenCvSourcePatchEvidence,
              [string]$provenance.NativeWrapperSources,
              [string]$provenance.PeAuditEvidence)) {
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Windows ARM64 runtime-input provenance is missing required host/toolchain/profile evidence."
            }
          }

          try {
            $nativeWrapperSources = @(([string]$provenance.NativeWrapperSources | ConvertFrom-Json))
            $excludedForeignToolDirectories = @(([string]$provenance.ExcludedForeignToolDirectories | ConvertFrom-Json))
            $sourcePatchEvidence = [string]$provenance.OpenCvSourcePatchEvidence | ConvertFrom-Json
          }
          catch {
            throw "Windows ARM64 runtime-input provenance contains invalid source, PATH, or OpenCV patch evidence JSON."
          }
          $expectedPatchPath = 'packaging/runtime/patches/windows-arm64-mlas-processor-case.patch'
          $expectedPatchTarget = '3rdparty/mlas/CMakeLists.txt'
          $expectedPatchReason = 'accept-uppercase-cmake-arm64-for-mlas-detection'
          $expectedPatchSha256 = (Get-FileHash -LiteralPath $expectedPatchPath -Algorithm SHA256).Hash
          if ($sourcePatchEvidence.Path -ne $expectedPatchPath -or
              $sourcePatchEvidence.Target -ne $expectedPatchTarget -or
              $sourcePatchEvidence.Reason -ne $expectedPatchReason -or
              $sourcePatchEvidence.Sha256 -ne $expectedPatchSha256) {
            throw "Windows ARM64 provenance does not retain the audited OpenCV MLAS processor-case patch."
          }
          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          function Get-NativeSourceList([string]$variableName) {
            $match = [regex]::Match($cmakeText, "(?s)set\($variableName(?<body>.*?)\)")
            if (-not $match.Success) {
              throw "Native CMake source list was not found: $variableName"
            }
            return @(
              [regex]::Matches($match.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') |
                ForEach-Object { $_.Groups[1].Value }
            )
          }
          $miniSources = @(Get-NativeSourceList 'OPENCV_CSHARP_MINI_NATIVE_SOURCES')
          $fullOnlySources = @(Get-NativeSourceList 'OPENCV_CSHARP_FULL_ONLY_NATIVE_SOURCES')
          $expectedSources = if ($profileName -eq 'mini') { @($miniSources) } else { @($miniSources + $fullOnlySources) }
          $expectedSourceCount = if ($profileName -eq 'mini') { 8 } else { 45 }
