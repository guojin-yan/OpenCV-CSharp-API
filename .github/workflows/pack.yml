          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-managed
      - name: Download Ubuntu 22.04 ARM64 runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-ubuntu.22.04-arm64-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-ubuntu2204-arm64/nupkg-ubuntu.22.04-arm64-${{ inputs.runtime_profile }}
      - name: Verify and run selected real Ubuntu 22.04 ARM64 package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.opencv_version }}.${{ inputs.package_revision }}
          OPENCV_VERSION: ${{ inputs.opencv_version }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          POWERSHELL_VERSION: 7.4.17
          POWERSHELL_SHA256: 68f3874cdb6cd564acf404103dfc410ee85435b02f0ad648e73a958853175d6c
          UBUNTU_2204_ARM64_IMAGE: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
        run: |
          set -euo pipefail
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          test "$(docker info --format '{{.Architecture}}')" = "aarch64"
          docker pull "$UBUNTU_2204_ARM64_IMAGE"
          test "$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Architecture}}')" = "arm64"
          image_id="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Id}}')"
          image_digests="$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{join .RepoDigests ","}}')"
          printf '%s\n' "$image_digests" | grep -Fq 'ubuntu@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982'
          echo "UBUNTU_22_04_ARM64_CONSUMER_HOST_EVIDENCE ImageOS=${ImageOS:-unknown} ImageVersion=${ImageVersion:-unknown} UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) DOCKER_ARCH=$(docker info --format '{{.Architecture}}')"
          echo "UBUNTU_22_04_ARM64_CONSUMER_IMAGE_EVIDENCE IMAGE=$UBUNTU_2204_ARM64_IMAGE IMAGE_ID=$image_id REPO_DIGESTS=$image_digests ARCH=$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Architecture}}') OS=$(docker image inspect "$UBUNTU_2204_ARM64_IMAGE" --format '{{.Os}}')"

          docker run --rm \
            -e PACKAGE_VERSION="$PACKAGE_VERSION" \
            -e OPENCV_VERSION="$OPENCV_VERSION" \
            -e RUNTIME_PROFILE="$RUNTIME_PROFILE" \
            -e POWERSHELL_VERSION="$POWERSHELL_VERSION" \
            -e POWERSHELL_SHA256="$POWERSHELL_SHA256" \
            -v "$GITHUB_WORKSPACE:/workspace:ro" \
            -w /tmp \
            "$UBUNTU_2204_ARM64_IMAGE" \
            bash -lc '
              set -euo pipefail
              . /etc/os-release
              test "${ID:-}" = "ubuntu"
              test "${VERSION_ID:-}" = "22.04"
              test "$(uname -m)" = "aarch64"
              test "$(dpkg --print-architecture)" = "arm64"

              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends \
                ca-certificates \
                binutils \
                curl \
                gzip \
                libicu70 \
                libssl3 \
                libunwind8 \
                tar \
                unzip \
                zlib1g

              powershell_archive="/tmp/powershell-$POWERSHELL_VERSION-linux-arm64.tar.gz"
              curl -fsSL "https://github.com/PowerShell/PowerShell/releases/download/v$POWERSHELL_VERSION/powershell-$POWERSHELL_VERSION-linux-arm64.tar.gz" -o "$powershell_archive"
              echo "$POWERSHELL_SHA256  $powershell_archive" | sha256sum -c -
              install -d /opt/microsoft/powershell/7
              tar -xzf "$powershell_archive" -C /opt/microsoft/powershell/7
              chmod +x /opt/microsoft/powershell/7/pwsh
              ln -sf /opt/microsoft/powershell/7/pwsh /usr/bin/pwsh

              curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
              bash /tmp/dotnet-install.sh --channel 8.0 --architecture arm64 --install-dir /usr/share/dotnet
              ln -sf /usr/share/dotnet/dotnet /usr/bin/dotnet

              libc="$(getconf GNU_LIBC_VERSION)"
              echo "UBUNTU_22_04_ARM64_CONSUMER_EVIDENCE profile=$RUNTIME_PROFILE ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc POWERSHELL_VERSION=$POWERSHELL_VERSION POWERSHELL_SHA256=$POWERSHELL_SHA256"
              pwsh --version
              dotnet --info

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackArtifactMatrixSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-ubuntu2204-arm64 \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid ubuntu.22.04-arm64 \
                -SelectedRuntimeProfile "$RUNTIME_PROFILE"

              case "$RUNTIME_PROFILE" in
                full)
                  modules=(core imgproc imgcodecs videoio flann geometry calib stereo dnn objdetect photo features video highgui stitching ptcloud)
                  expected_canonical_count=18
                  expected_runtime_file_count=50
                  expected_direct_opencv=16
                  ;;
                mini)
                  modules=(core imgproc imgcodecs videoio geometry flann)
                  expected_canonical_count=8
                  expected_runtime_file_count=20
                  expected_direct_opencv=6
                  ;;
                *)
                  echo "Unsupported Ubuntu 22.04 ARM64 package profile: $RUNTIME_PROFILE" >&2
                  exit 1
                  ;;
              esac

              runtime_artifact_dir="/workspace/artifacts/pack-targeted-ubuntu2204-arm64/nupkg-ubuntu.22.04-arm64-$RUNTIME_PROFILE"
              mapfile -t packages < <(find "$runtime_artifact_dir" -maxdepth 1 -type f -name "*.nupkg" | sort)
              test "${#packages[@]}" -eq 1
              extract_root="/tmp/opencv-ubuntu2204-arm64-package-audit-$RUNTIME_PROFILE"
              rm -rf "$extract_root"
              mkdir -p "$extract_root"
              unzip -q "${packages[0]}" -d "$extract_root"
              native_dir="$extract_root/runtimes/ubuntu.22.04-arm64/native"
              test -d "$native_dir"

              compatibility_loader="$(find "$native_dir" -maxdepth 1 -type f -name "lib*.Native.so" ! -name "libJYPPX.OpenCV.Native.so" -print -quit)"
              test -n "$compatibility_loader"
              expected_names="/tmp/ubuntu2204-arm64-$RUNTIME_PROFILE-expected-runtime-files.txt"
              actual_names="/tmp/ubuntu2204-arm64-$RUNTIME_PROFILE-actual-runtime-files.txt"
              printf "%s\n" "libJYPPX.OpenCV.Native.so" "$(basename "$compatibility_loader")" > "$expected_names"
              for module in "${modules[@]}"; do
                printf "%s\n" \
                  "libopencv_${module}.so" \
                  "libopencv_${module}.so.500" \
                  "libopencv_${module}.so.$OPENCV_VERSION" \
                  >> "$expected_names"
              done
              sort -o "$expected_names" "$expected_names"
              find "$native_dir" -mindepth 1 -maxdepth 1 -type f -printf "%f\n" | sort > "$actual_names"
              test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
              diff -u "$expected_names" "$actual_names"

              mapfile -t opencv_elfs < <(find "$native_dir" -maxdepth 1 -type f -name "libopencv_*.so.$OPENCV_VERSION" | sort)
              test "${#opencv_elfs[@]}" -eq "${#modules[@]}"
              elf_files=("$native_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader" "${opencv_elfs[@]}")
              test "${#elf_files[@]}" -eq "$expected_canonical_count"
              machine_count=0
              origin_count=0
              producer_path_count=0
              missing_dependency_count=0
              for elf in "${elf_files[@]}"; do
                test -f "$elf"
                readelf -h "$elf" | grep -q "Machine:.*AArch64"
                machine_count=$((machine_count + 1))
                dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
                printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
                origin_count=$((origin_count + 1))
                if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then
                  producer_path_count=$((producer_path_count + 1))
                fi
                missing="$(ldd "$elf" | grep "not found" || true)"
                if [ -n "$missing" ]; then
                  printf "%s\n" "$missing" >&2
                  missing_dependency_count=$((missing_dependency_count + 1))
                fi
              done
              direct_opencv_dependencies="$(readelf -d "$native_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
              test "$machine_count" -eq "$expected_canonical_count"
              test "$origin_count" -eq "$expected_canonical_count"
              test "$producer_path_count" -eq 0
              test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
              test "$missing_dependency_count" -eq 0
              cmp -s "$native_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader"
              echo "UBUNTU_22_04_ARM64_PACKAGE_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=AArch64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 loader_equal=true"

              pwsh -NoProfile -File /workspace/scripts/Test-GitHubPackConsumerRestoreSurface.ps1 \
                -ArtifactRoot /workspace/artifacts/pack-targeted-ubuntu2204-arm64 \
                -ExpectedPackageVersion "$PACKAGE_VERSION" \
                -ExpectedSyntheticRuntimeInputs false \
                -SelectedRid ubuntu.22.04-arm64 \
                -SelectedRuntimeProfile "$RUNTIME_PROFILE" \
                -RunNativeSmoke
            '

  verify-targeted-real-debian:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'debian.12-x64' && inputs.runtime_profile == 'full' && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ubuntu-24.04
    container: debian:12
    steps:
      - name: Verify Debian 12 container and install tooling
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          if [ "${ID:-}" != "debian" ]; then
            echo "Expected Debian container, got ${ID:-unknown}." >&2
            exit 1
          fi
          case "${VERSION_ID:-}" in
            12|12.*) ;;
            *)
              echo "Expected Debian 12 container, got ${VERSION_ID:-unknown}." >&2
              exit 1
              ;;
          esac
          container_libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n 1)"
          echo "DEBIAN_12_CONTAINER_EVIDENCE ID=$ID VERSION_ID=$VERSION_ID LIBC=$container_libc"

          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            apt-transport-https \
            ca-certificates \
            curl \
            git \
            gnupg \
            gzip \
            libicu72 \
            libssl3 \
            tar \
            zlib1g
          install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg
          chmod go+r /etc/apt/keyrings/packages.microsoft.gpg
          echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" > /etc/apt/sources.list.d/microsoft-prod.list
          apt-get update
          apt-get install -y --no-install-recommends powershell
          pwsh --version
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-debian/nupkg-managed
      - name: Download Debian runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-debian.12-x64-full
          path: artifacts/pack-targeted-debian/nupkg-debian.12-x64-full
      - name: Verify selected real Debian package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-debian `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid debian.12-x64 `
            -SelectedRuntimeProfile full
      - name: Restore, build, and run selected real Debian package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-debian `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid debian.12-x64 `
            -SelectedRuntimeProfile full `
            -RunNativeSmoke

