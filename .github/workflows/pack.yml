  verify-targeted-real-windows-x64:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'win-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini') && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Require actual Windows x64 package consumer
        shell: pwsh
        run: |
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64' -or
              $osArchitecture -ne 'X64' -or
              $processArchitecture -ne 'X64' -or
              -not [Environment]::Is64BitProcess) {
            throw "Packaged win-x64/${{ inputs.runtime_profile }} execution requires an actual AMD64 Windows host and x64 process."
          }

          $compatibilityNativeRuntimeDir = 'Open' + 'Cv5SharpNativeRuntimeDir'
          $compatibilityRuntimeRoot = 'OPENCV' + '5SHARP_OPENCV_RUNTIME_ROOT'
          foreach ($name in @('OpenCvNativeRuntimeDir', $compatibilityNativeRuntimeDir, 'OPENCV_CSHARP_OPENCV_RUNTIME_ROOT', $compatibilityRuntimeRoot)) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Packaged Windows consumer must not use a native runtime search override: $name"
            }
          }
          foreach ($forbiddenPath in @('artifacts\real-runtime-inputs', 'opencv-build', 'opencv-install', 'native-linked')) {
            if (($env:PATH -split ';') | Where-Object { $_.IndexOf($forbiddenPath, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 }) {
              throw "Packaged Windows consumer PATH contains a producer directory: $forbiddenPath"
            }
          }
          Write-Host "WINDOWS_X64_PACKAGE_CONSUMER_HOST_OK PROCESSOR_ARCHITECTURE=$($env:PROCESSOR_ARCHITECTURE) OSArchitecture=$osArchitecture ProcessArchitecture=$processArchitecture Is64BitProcess=$([Environment]::Is64BitProcess)"
      - name: Download managed package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-windows/nupkg-managed
      - name: Download Windows x64 runtime package artifact
        uses: actions/download-artifact@v4
        with:
          name: nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-windows/nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
      - name: Verify selected Windows package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}'
      - name: Audit packaged Windows x64 PE closure
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimeArtifactDirectory = Join-Path ./artifacts/pack-targeted-windows 'nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}'
          $packages = @(Get-ChildItem -LiteralPath $runtimeArtifactDirectory -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Exactly one win-x64/${{ inputs.runtime_profile }} runtime package was expected."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'opencv-windows-x64-package-audit'
          if (Test-Path -LiteralPath $extractRoot -PathType Container) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $extractRoot)
          $nativeDirectory = Join-Path $extractRoot 'runtimes/win-x64/native'
          pwsh -NoProfile -File ./scripts/Test-WindowsRuntimePeClosure.ps1 `
            -RuntimeDirectory $nativeDirectory `
            -Rid win-x64 `
            -RuntimeProfile '${{ inputs.runtime_profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}'
      - name: Restore, build, and run Windows x64 package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.opencv_version }}.${{ inputs.package_revision }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}' `
            -CompileNativeSmoke `
            -RunNativeSmoke

