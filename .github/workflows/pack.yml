              [string]$provenance.HostedArchitecture,
              [string]$provenance.HostedProcessArchitecture,
              [string]$provenance.HostedPackageArchitecture,
              [string]$provenance.HostedLibc,
              [string]$provenance.HostedCpuModel,
              [string]$provenance.HostedMemoryBytes,
              [string]$provenance.HostedDiskAvailableBytes,
              [string]$provenance.CMakeVersion,
              [string]$provenance.CMakeGenerator,
              [string]$provenance.BuildConfiguration,
              [string]$provenance.CompilerPath,
              [string]$provenance.CompilerVersion,
              [string]$provenance.AssemblerVersion,
              [string]$provenance.NinjaVersion,
              [string]$provenance.DotNetVersion,
              [string]$provenance.OpenCvCMakeArguments,
              [string]$provenance.ElfAuditEvidence,
              [string]$provenance.OpenCvCpuConfiguration,
              [string]$provenance.NativeWrapperSources,
              [string]$provenance.ContainerImage,
              [string]$provenance.ContainerImageId,
              [string]$provenance.ContainerImageDigest,
              [string]$provenance.ContainerDistro,
              [string]$provenance.ContainerDistroVersion,
              [string]$provenance.ContainerArchitecture,
              [string]$provenance.ContainerPackageArchitecture,
              [string]$provenance.ContainerLibc,
              [string]$provenance.PowerShellVersion)) {
            if ([string]::IsNullOrWhiteSpace($requiredValue)) {
              throw "Alpine runtime-input provenance is missing required host, target container, toolchain, profile, or ELF evidence."
            }
          }

          try {
            $nativeWrapperSources = @(([string]$provenance.NativeWrapperSources | ConvertFrom-Json))
            $openCvCMakeArguments = @(([string]$provenance.OpenCvCMakeArguments | ConvertFrom-Json))
          }
          catch {
            throw "Alpine runtime-input provenance contains invalid source or OpenCV CMake argument JSON."
          }
          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          function Get-NativeSourceList([string]$variableName) {
            $match = [regex]::Match($cmakeText, "(?s)set\($variableName(?<body>.*?)\)")
            if (-not $match.Success) { throw "Native CMake source list was not found: $variableName" }
            return @([regex]::Matches($match.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') | ForEach-Object { $_.Groups[1].Value })
          }
          $miniSources = @(Get-NativeSourceList 'OPENCV_CSHARP_MINI_NATIVE_SOURCES')
          $fullOnlySources = @(Get-NativeSourceList 'OPENCV_CSHARP_FULL_ONLY_NATIVE_SOURCES')
          $expectedSources = if ($profileName -eq 'mini') { @($miniSources) } else { @($miniSources + $fullOnlySources) }
          $expectedSourceCount = if ($profileName -eq 'mini') { 9 } else { 49 }
          $expectedAbiFunctionCount = if ($profileName -eq 'mini') { 526 } else { 2656 }
          if ([int]$provenance.NativeWrapperSourceCount -ne $expectedSourceCount -or
              [int]$provenance.NativeAbiFunctionCount -ne $expectedAbiFunctionCount -or
              $nativeWrapperSources.Count -ne $expectedSourceCount -or
              @($expectedSources | Where-Object { $nativeWrapperSources -notcontains $_ }).Count -ne 0 -or
              @($nativeWrapperSources | Where-Object { $expectedSources -notcontains $_ }).Count -ne 0 -or
              -not [string]::IsNullOrWhiteSpace([string]$provenance.OpenCvExtraCMakeArgs)) {
            throw "Alpine provenance does not retain the exact $expectedSourceCount-source/$expectedAbiFunctionCount-ABI $profileName profile and empty extra CMake arguments."
          }

          $cmakeArgumentText = $openCvCMakeArguments -join "`n"
          $expectedBuildListArgument = "-DBUILD_LIST=$([string]$profile[0].buildList)"
          $elfProfile = [regex]::Escape($profileName)
          $expectedElfPattern = "^ALPINE_3_20_PRODUCER_ELF_EVIDENCE profile=$elfProfile files=$expectedCanonicalCount runtime_files=$expectedPayloadFileCount machine=X86-64 origin=$expectedCanonicalCount producer_paths=0 direct_opencv=$expectedModuleCount missing_dependencies=0$"
          $expectedImage = 'alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          $expectedImageDigest = 'alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc'
          if ($provenance.HostedRunner -ne 'ubuntu-24.04' -or
              $provenance.HostedDistro -ne 'ubuntu' -or
              $provenance.HostedDistroVersion -ne '24.04' -or
              $provenance.HostedArchitecture -ne 'x86_64' -or
              $provenance.HostedProcessArchitecture -ne 'X64' -or
              $provenance.HostedPackageArchitecture -ne 'amd64' -or
              $provenance.HostedLibc -notmatch '^glibc ' -or
              [long]$provenance.HostedMemoryBytes -le 0 -or
              [long]$provenance.HostedDiskAvailableBytes -le 0 -or
              $provenance.ContainerImage -ne $expectedImage -or
              $provenance.ContainerImageId -notmatch '^sha256:' -or
              $provenance.ContainerImageDigest.IndexOf($expectedImageDigest, [System.StringComparison]::Ordinal) -lt 0 -or
              $provenance.ContainerDistro -ne 'alpine' -or
              $provenance.ContainerDistroVersion -notmatch '^3\.20(?:\..*)?$' -or
              $provenance.ContainerArchitecture -ne 'x86_64' -or
              $provenance.ContainerPackageArchitecture -ne 'x86_64' -or
              $provenance.ContainerLibc -notmatch '^musl 1\.2\.5$' -or
              $provenance.PowerShellVersion -notmatch '^7\.4\.6' -or
              $provenance.CMakeVersion -notmatch '^cmake version 3\.29\.3$' -or
              $provenance.CMakeGenerator -ne 'Ninja' -or
              $provenance.BuildConfiguration -ne 'Release' -or
              $provenance.CompilerPath -notmatch '(?i)(?:^|/)g\+\+$' -or
              $provenance.CompilerVersion -notmatch '13\.2\.1' -or
              $provenance.CompilerVersion -notmatch 'x86_64' -or
              $provenance.AssemblerVersion -notmatch '2\.42' -or
              $provenance.NinjaVersion -notmatch '^1\.9' -or
              $cmakeArgumentText.IndexOf('-G', [System.StringComparison]::Ordinal) -lt 0 -or
              $cmakeArgumentText.IndexOf('Ninja', [System.StringComparison]::Ordinal) -lt 0 -or
              $cmakeArgumentText.IndexOf($expectedBuildListArgument, [System.StringComparison]::Ordinal) -lt 0 -or
              $provenance.ElfAuditEvidence -notmatch $expectedElfPattern) {
            throw "Alpine runtime-input provenance host, target container, toolchain, CPU, profile, or ELF evidence is not factual alpine.3.20-x64/$profileName."
          }
          $forbiddenEvidence = @([string]$provenance.CompilerPath,[string]$provenance.CompilerVersion,[string]$provenance.AssemblerVersion,[string]$provenance.OpenCvCMakeArguments,[string]$provenance.OpenCvExtraCMakeArgs,[string]$provenance.ElfAuditEvidence) -join "`n"
          foreach ($forbiddenToken in @('QEMU','emulation','cross-compile','--platform','CV_AVXVNNI_AVAILABLE=0','glibc 2.')) {
            if ($forbiddenEvidence.IndexOf($forbiddenToken, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) { throw "Alpine provenance retained forbidden foreign or workaround evidence: $forbiddenToken" }
          }
          Write-Host "ALPINE_3_20_RUNTIME_INPUT_PROVENANCE_OK profile=$profileName files=$expectedPayloadFileCount modules=$expectedModuleCount sources=$expectedSourceCount abi_functions=$expectedAbiFunctionCount synthetic=false"
      - name: Pack runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) }}
        shell: pwsh
        env:
          PACKAGE_VERSION_INPUT: ${{ inputs.package_version }}
        run: |
          $packageRevision = [int]'${{ inputs.package_revision }}'
          $nativeRuntimeDir = '${{ steps.synthetic.outputs.native_runtime_dir }}'
          $openCvRuntimeDir = '${{ steps.synthetic.outputs.opencv_runtime_dir }}'
          $openCvSourceDir = '${{ steps.synthetic.outputs.opencv_source_dir }}'
          $openCvInstallDir = '${{ steps.synthetic.outputs.opencv_install_dir }}'

          if ('${{ inputs.validate_synthetic_runtime }}' -ne 'true') {
            $nativeRuntimeDir = '${{ steps.real.outputs.native_runtime_dir }}'
            $openCvRuntimeDir = '${{ steps.real.outputs.opencv_runtime_dir }}'
            $openCvSourceDir = '${{ steps.real.outputs.opencv_source_dir }}'
            $openCvInstallDir = '${{ steps.real.outputs.opencv_install_dir }}'
          }

          if ([string]::IsNullOrWhiteSpace($nativeRuntimeDir) -or
              [string]::IsNullOrWhiteSpace($openCvRuntimeDir) -or
              [string]::IsNullOrWhiteSpace($openCvSourceDir)) {
            throw "Runtime packaging requires native_runtime_dir, opencv_runtime_dir, and opencv_source_dir when synthetic validation is disabled."
          }

          $packArgs = @(
            '-Rid', '${{ matrix.rid }}',
            '-RuntimeProfile', '${{ matrix.profile }}',
            '-OpenCvVersion', '${{ inputs.opencv_version }}',
            '-PackageRevision', $packageRevision,
            '-PackageVersion', $env:PACKAGE_VERSION_INPUT,
            '-StageRuntime',
            '-OpenCvNativeRuntimeDir', $nativeRuntimeDir,
            '-OpenCvRuntimeDir', $openCvRuntimeDir,
            '-OpenCvSourceDir', $openCvSourceDir,
            '-RuntimeProject', './packaging/runtime/JYPPX.OpenCV.runtime/JYPPX.OpenCV.runtime.csproj'
          )

          if (-not [string]::IsNullOrWhiteSpace($openCvInstallDir)) {
            $packArgs += @('-OpenCvInstallDir', $openCvInstallDir)
          }

          if ('${{ inputs.validate_synthetic_runtime }}' -eq 'true') {
            $packArgs += @('-SyntheticRuntimeInputs')
          }

          if ('${{ inputs.publish_github_packages }}' -eq 'true') {
            $packArgs += @('-RequireReleasePreflight')
          }

          pwsh -NoProfile -File ./scripts/Pack-Runtime.ps1 @packArgs
      - name: Upload runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: nupkg-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Publish runtime package
        if: ${{ (inputs.rid == 'all' || inputs.rid == matrix.rid) && (inputs.runtime_profile == 'all' || inputs.runtime_profile == matrix.profile) && inputs.publish_github_packages == 'true' && inputs.validate_synthetic_runtime != 'true' }}
        shell: pwsh
        run: |
          dotnet nuget push ./artifacts/packages/*.nupkg `
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --api-key "${{ secrets.GITHUB_TOKEN }}" `
            --skip-duplicate

  verify-artifacts:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'all' && inputs.runtime_profile == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/pack-download
      - name: Verify package artifact matrix
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          $expectedSyntheticRuntimeInputs = '${{ inputs.validate_synthetic_runtime }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-download `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs $expectedSyntheticRuntimeInputs

  verify-consumers:
    needs:
      - verify-artifacts
    if: ${{ inputs.rid == 'all' && inputs.runtime_profile == 'all' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts/pack-download
      - name: Verify package consumer restore
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-download `
            -ExpectedPackageVersion $packageVersion

  verify-targeted-real:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ ((inputs.rid == 'ubuntu.24.04-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini')) || (inputs.rid == 'ubuntu.22.04-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini'))) && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: ${{ inputs.rid == 'ubuntu.22.04-x64' && 'ubuntu-22.04' || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Record hosted Ubuntu x64 consumer evidence
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "${ID:-}" = "ubuntu"
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"
          process_architecture="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()' | tr -d '\r')"
          test "$process_architecture" = "X64"
          runner_image="${ImageOS:-unknown}"
          runner_image_version="${ImageVersion:-unknown}"
          test "$runner_image_version" != "unknown"
          libc="$(getconf GNU_LIBC_VERSION)"

          case '${{ inputs.rid }}' in
            ubuntu.22.04-x64)
              test "${VERSION_ID:-}" = "22.04"
              test "$runner_image" = "ubuntu22"
              printf '%s\n' "$libc" | grep -Eq '^glibc 2\.35($|\.)'
              echo "UBUNTU_22_04_X64_CONSUMER_EVIDENCE profile=${{ inputs.runtime_profile }} ImageOS=$runner_image ImageVersion=$runner_image_version ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) PROCESS_ARCH=$process_architecture DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc"
              ;;
            ubuntu.24.04-x64)
              test "${VERSION_ID:-}" = "24.04"
              test "$runner_image" = "ubuntu24"
              printf '%s\n' "$libc" | grep -Eq '^glibc 2\.39($|\.)'
              echo "UBUNTU_24_04_X64_CONSUMER_EVIDENCE profile=${{ inputs.runtime_profile }} ImageOS=$runner_image ImageVersion=$runner_image_version ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) PROCESS_ARCH=$process_architecture DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc"
              ;;
            *)
              echo "Unsupported hosted Ubuntu x64 consumer RID: ${{ inputs.rid }}" >&2
              exit 1
              ;;
          esac
      - name: Download managed package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted/nupkg-managed
      - name: Download selected runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted/nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
      - name: Verify selected real package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          $runtimeRid = '${{ inputs.rid }}'
          $runtimeProfile = '${{ inputs.runtime_profile }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid $runtimeRid `
            -SelectedRuntimeProfile $runtimeProfile
      - name: Restore, build, and run selected real package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          $runtimeRid = '${{ inputs.rid }}'
          $runtimeProfile = '${{ inputs.runtime_profile }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid $runtimeRid `
            -SelectedRuntimeProfile $runtimeProfile `
            -RunNativeSmoke

  verify-targeted-real-windows-x86:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'win-x86' && inputs.runtime_profile == 'full' && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Require AMD64 Windows host and install factual x86 .NET runtime
        id: dotnet_x86
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($env:RUNNER_ARCH -ne 'X64' -or
              $env:PROCESSOR_ARCHITECTURE -ne 'AMD64' -or
              $osArchitecture -ne 'X64' -or
              $processArchitecture -ne 'X64' -or
              -not [Environment]::Is64BitProcess -or
              -not [Environment]::Is64BitOperatingSystem) {
            throw "Packaged win-x86/full verification requires an AMD64 Windows host with supported WoW64."
          }
          foreach ($name in @('OpenCvNativeRuntimeDir', ('Open' + 'Cv5SharpNativeRuntimeDir'), 'OPENCV_CSHARP_OPENCV_RUNTIME_ROOT', ('OPENCV' + '5SHARP_OPENCV_RUNTIME_ROOT'))) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Packaged Windows x86 consumer must not use a native runtime search override: $name"
            }
          }
          foreach ($forbiddenPath in @('artifacts\real-runtime-inputs', 'opencv-build', 'opencv-install', 'native-linked')) {
            if (($env:PATH -split ';') | Where-Object { $_.IndexOf($forbiddenPath, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 }) {
              throw "Packaged Windows x86 consumer PATH contains a producer directory: $forbiddenPath"
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installationPath = (& $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $installationPath 'VC/Tools/MSVC') -Recurse -File -Filter dumpbin.exe |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Hostx64[\\/]x86[\\/]dumpbin\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $dumpbin) {
            throw "Factual Hostx64/x86 dumpbin.exe was not found."
          }

          $runtimeVersions = @(
            dotnet --list-runtimes |
              ForEach-Object {
                $match = [regex]::Match([string]$_, '^Microsoft\.NETCore\.App (8\.0\.\d+) ')
                if ($match.Success) { [version]$match.Groups[1].Value }
              } |
              Sort-Object -Descending)
          if ($runtimeVersions.Count -eq 0) {
            throw "No exact .NET 8 runtime version was available for x86 installation."
          }
          $runtimeVersion = $runtimeVersions[0].ToString()
          $installRoot = Join-Path $env:RUNNER_TEMP "dotnet-x86-$runtimeVersion"
          $installScript = Join-Path $env:RUNNER_TEMP 'dotnet-install-x86.ps1'
          $expectedInstallScriptSha256 = 'BB1CE92F4397E24D4736A4658B9728FB8F9DB64A0D3F8E636BA408A866A6661D'
          Invoke-WebRequest -Uri https://raw.githubusercontent.com/dotnet/install-scripts/9c8552ae791982d3674fbb4d6ad887e536e7f506/src/dotnet-install.ps1 -OutFile $installScript
          $installScriptSha256 = (Get-FileHash -LiteralPath $installScript -Algorithm SHA256).Hash
          if (-not $installScriptSha256.Equals($expectedInstallScriptSha256, [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "The commit-pinned dotnet-install.ps1 payload hash does not match the audited source. Expected $expectedInstallScriptSha256, actual $installScriptSha256."
          }
          & $installScript -Runtime dotnet -Version $runtimeVersion -Architecture x86 -InstallDir $installRoot -NoPath
          if ($LASTEXITCODE -ne 0) {
            throw "Exact .NET $runtimeVersion x86 runtime installation failed."
          }
          $x86Host = Join-Path $installRoot 'dotnet.exe'
          $stream = [System.IO.File]::OpenRead($x86Host)
          $reader = [System.IO.BinaryReader]::new($stream)
          try {
            $stream.Position = 0x3c
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550 -or $reader.ReadUInt16() -ne 0x014c) {
              throw "Installed x86 dotnet host is not an I386/0x014c PE image."
            }
          }
          finally {
            $reader.Dispose()
            $stream.Dispose()
          }
          $hostInfo = @(& $x86Host --info 2>&1)
          $hostExitCode = $LASTEXITCODE
          $hostInfo | ForEach-Object { Write-Host $_ }
          $hostInfoText = $hostInfo -join [Environment]::NewLine
          if ($hostExitCode -ne 0 -or
              $hostInfoText -notmatch '(?m)^\s*Architecture:\s+x86\s*$' -or
              $hostInfoText -notmatch '(?m)^\s*RID:\s+win-x86\s*$') {
            throw "Installed .NET runtime host did not report factual win-x86 architecture."
          }
          Write-Host "WINDOWS_X86_DOTNET_HOST_OK version=$runtimeVersion machine=I386 host=$x86Host install_script_sha256=$installScriptSha256 OSArchitecture=$osArchitecture verifier_process=$processArchitecture"
          "host_path=$x86Host" >> $env:GITHUB_OUTPUT
          "dumpbin_path=$($dumpbin.FullName)" >> $env:GITHUB_OUTPUT
          "runtime_version=$runtimeVersion" >> $env:GITHUB_OUTPUT
          "install_script_sha256=$installScriptSha256" >> $env:GITHUB_OUTPUT
      - name: Download managed package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-windows-x86/nupkg-managed
      - name: Download Windows x86 full runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-win-x86-full
          path: artifacts/pack-targeted-windows-x86/nupkg-win-x86-full
      - name: Verify selected Windows x86 package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows-x86 `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x86 `
            -SelectedRuntimeProfile full
      - name: Audit packaged Windows x86 full PE closure
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimeArtifactDirectory = Join-Path ./artifacts/pack-targeted-windows-x86 'nupkg-win-x86-full'
          $packages = @(Get-ChildItem -LiteralPath $runtimeArtifactDirectory -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Exactly one win-x86/full runtime package was expected."
          }
          $extractRoot = Join-Path $env:RUNNER_TEMP 'opencv-windows-x86-package-audit'
          if (Test-Path -LiteralPath $extractRoot -PathType Container) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $extractRoot)
          $nativeDirectory = Join-Path $extractRoot 'runtimes/win-x86/native'
          pwsh -NoProfile -File ./scripts/Test-WindowsRuntimePeClosure.ps1 `
            -RuntimeDirectory $nativeDirectory `
            -Rid win-x86 `
            -RuntimeProfile full `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -DumpbinPath '${{ steps.dotnet_x86.outputs.dumpbin_path }}'
      - name: Restore, build, and run Windows x86 package consumer in an X86 process
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows-x86 `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x86 `
            -SelectedRuntimeProfile full `
            -CompileNativeSmoke `
            -RunNativeSmoke `
            -NativeExecutionHost '${{ steps.dotnet_x86.outputs.host_path }}'

  verify-targeted-real-windows-x64:
    needs:
      - pack-managed
      - pack-runtime
    if: ${{ inputs.rid == 'win-x64' && (inputs.runtime_profile == 'full' || inputs.runtime_profile == 'mini') && inputs.validate_synthetic_runtime != 'true' && inputs.publish_github_packages != 'true' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Require actual Windows x64 package consumer
        shell: pwsh
        run: |
          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64' -or
              $osArchitecture -ne 'X64' -or
              $processArchitecture -ne 'X64' -or
              -not [Environment]::Is64BitProcess) {
            throw "Packaged win-x64/${{ inputs.runtime_profile }} execution requires an actual AMD64 Windows host and x64 process."
          }

          foreach ($name in @('OpenCvNativeRuntimeDir', 'OPENCV_CSHARP_OPENCV_RUNTIME_ROOT')) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Packaged Windows consumer must not use a native runtime search override: $name"
            }
          }
          foreach ($forbiddenPath in @('artifacts\real-runtime-inputs', 'opencv-build', 'opencv-install', 'native-linked')) {
            if (($env:PATH -split ';') | Where-Object { $_.IndexOf($forbiddenPath, [System.StringComparison]::OrdinalIgnoreCase) -ge 0 }) {
              throw "Packaged Windows consumer PATH contains a producer directory: $forbiddenPath"
            }
          }
          Write-Host "WINDOWS_X64_PACKAGE_CONSUMER_HOST_OK PROCESSOR_ARCHITECTURE=$($env:PROCESSOR_ARCHITECTURE) OSArchitecture=$osArchitecture ProcessArchitecture=$processArchitecture Is64BitProcess=$([Environment]::Is64BitProcess)"
      - name: Download managed package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-managed
          path: artifacts/pack-targeted-windows/nupkg-managed
      - name: Download Windows x64 runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-windows/nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}
      - name: Verify selected Windows package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}'
      - name: Audit packaged Windows x64 PE closure
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $runtimeArtifactDirectory = Join-Path ./artifacts/pack-targeted-windows 'nupkg-${{ inputs.rid }}-${{ inputs.runtime_profile }}'
          $packages = @(Get-ChildItem -LiteralPath $runtimeArtifactDirectory -File -Filter '*.nupkg')
          if ($packages.Count -ne 1) {
            throw "Exactly one win-x64/${{ inputs.runtime_profile }} runtime package was expected."
          }

          $extractRoot = Join-Path $env:RUNNER_TEMP 'opencv-windows-x64-package-audit'
          if (Test-Path -LiteralPath $extractRoot -PathType Container) {
            Remove-Item -LiteralPath $extractRoot -Recurse -Force
          }
          [System.IO.Compression.ZipFile]::ExtractToDirectory($packages[0].FullName, $extractRoot)
          $nativeDirectory = Join-Path $extractRoot 'runtimes/win-x64/native'
          pwsh -NoProfile -File ./scripts/Test-WindowsRuntimePeClosure.ps1 `
            -RuntimeDirectory $nativeDirectory `
            -Rid win-x64 `
            -RuntimeProfile '${{ inputs.runtime_profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}'
      - name: Restore, build, and run Windows x64 package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-windows `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid win-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}' `
            -CompileNativeSmoke `
            -RunNativeSmoke

