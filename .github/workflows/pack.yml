      - name: Download Fedora runtime package artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: nupkg-fedora.40-x64-${{ inputs.runtime_profile }}
          path: artifacts/pack-targeted-fedora/nupkg-fedora.40-x64-${{ inputs.runtime_profile }}
      - name: Verify selected real Fedora package artifacts
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackArtifactMatrixSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-fedora `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid fedora.40-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}'
      - name: Audit selected Fedora package ELF closure
        shell: bash
        env:
          OPENCV_VERSION: ${{ inputs.opencv_version }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
        run: |
          set -euo pipefail
          case "$RUNTIME_PROFILE" in
            full)
              modules=(core imgproc imgcodecs videoio flann geometry calib stereo dnn ml objdetect photo features video highgui stitching ptcloud)
              expected_canonical_count=18
              expected_runtime_file_count=52
              expected_direct_opencv=17
              ;;
            mini)
              modules=(core imgproc imgcodecs videoio geometry flann)
              expected_canonical_count=7
              expected_runtime_file_count=19
              expected_direct_opencv=6
              ;;
            *)
              echo "Unsupported Fedora 40 x64 package profile: $RUNTIME_PROFILE" >&2
              exit 1
              ;;
          esac

          runtime_artifact_dir="$GITHUB_WORKSPACE/artifacts/pack-targeted-fedora/nupkg-fedora.40-x64-$RUNTIME_PROFILE"
          mapfile -t packages < <(find "$runtime_artifact_dir" -maxdepth 1 -type f -name "*.nupkg" | sort)
          test "${#packages[@]}" -eq 1
          extract_root="/tmp/opencv-fedora40-x64-package-audit-$RUNTIME_PROFILE"
          rm -rf "$extract_root"
          mkdir -p "$extract_root"
          unzip -q "${packages[0]}" -d "$extract_root"
          native_dir="$extract_root/runtimes/fedora.40-x64/native"
          test -d "$native_dir"

          expected_names="/tmp/fedora40-x64-$RUNTIME_PROFILE-expected-runtime-files.txt"
          actual_names="/tmp/fedora40-x64-$RUNTIME_PROFILE-actual-runtime-files.txt"
          printf "%s\n" "libJYPPX.OpenCV.Native.so" > "$expected_names"
          for module in "${modules[@]}"; do
            printf "%s\n" \
              "libopencv_${module}.so" \
              "libopencv_${module}.so.500" \
              "libopencv_${module}.so.$OPENCV_VERSION" \
              >> "$expected_names"
          done
          sort -o "$expected_names" "$expected_names"
          find "$native_dir" -mindepth 1 -maxdepth 1 -type f -printf "%f\n" | sort > "$actual_names"
          test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
          diff -u "$expected_names" "$actual_names"

          mapfile -t opencv_elfs < <(find "$native_dir" -maxdepth 1 -type f -name "libopencv_*.so.$OPENCV_VERSION" | sort)
          test "${#opencv_elfs[@]}" -eq "${#modules[@]}"
          elf_files=("$native_dir/libJYPPX.OpenCV.Native.so" "${opencv_elfs[@]}")
          test "${#elf_files[@]}" -eq "$expected_canonical_count"
          machine_count=0
          origin_count=0
          producer_path_count=0
          missing_dependency_count=0
          for elf in "${elf_files[@]}"; do
            test -f "$elf"
            readelf -h "$elf" | grep -q "Machine:.*X86-64"
            machine_count=$((machine_count + 1))
            dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
            printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
            origin_count=$((origin_count + 1))
            if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then
              producer_path_count=$((producer_path_count + 1))
            fi
            missing="$(ldd "$elf" | grep "not found" || true)"
            if [ -n "$missing" ]; then
              printf "%s\n" "$missing" >&2
              missing_dependency_count=$((missing_dependency_count + 1))
            fi
          done
          for module in "${modules[@]}"; do
            cmp -s "$native_dir/libopencv_${module}.so" "$native_dir/libopencv_${module}.so.500"
            cmp -s "$native_dir/libopencv_${module}.so.500" "$native_dir/libopencv_${module}.so.$OPENCV_VERSION"
          done
          direct_opencv_dependencies="$(readelf -d "$native_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
          test "$machine_count" -eq "$expected_canonical_count"
          test "$origin_count" -eq "$expected_canonical_count"
          test "$producer_path_count" -eq 0
          test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
          test "$missing_dependency_count" -eq 0
          echo "FEDORA_40_X64_PACKAGE_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=X86-64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 triplets_equal=true"
      - name: Restore, build, and run selected real Fedora package consumer
        shell: pwsh
        run: |
          $packageVersion = '${{ inputs.package_version }}'
          pwsh -NoProfile -File ./scripts/Test-GitHubPackConsumerRestoreSurface.ps1 `
            -ArtifactRoot ./artifacts/pack-targeted-fedora `
            -ExpectedPackageVersion $packageVersion `
            -ExpectedSyntheticRuntimeInputs false `
            -SelectedRid fedora.40-x64 `
            -SelectedRuntimeProfile '${{ inputs.runtime_profile }}' `
            -RunNativeSmoke

