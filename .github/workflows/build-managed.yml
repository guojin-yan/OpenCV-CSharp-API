name: build-managed

on:
  push:
    branches: [main, opencv5.x]
  pull_request:
    branches: [main, opencv5.x]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'grape-yan/OpenCV-CSharp-API' || (github.repository == 'guojin-yan/OpenCV-CSharp-API' && github.event_name == 'workflow_dispatch')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: |
            10.0.302
            9.0.316
            8.0.423
      - name: Check project invariants
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\Initialize-UpstreamMapSourceEvidence.ps1
          pwsh -NoProfile -File .\scripts\Test-ProjectInvariants.ps1
      - name: Restore
        run: dotnet restore .\OpenCV-CSharp-API.slnx
      - name: Build
        run: dotnet build .\OpenCV-CSharp-API.slnx -c Release --no-restore
