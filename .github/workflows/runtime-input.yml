name: runtime-input

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: OpenCV version used for real runtime input production
        required: true
        default: 5.0.0
      rid:
        description: Real producer target; exact Windows x64/ARM64 full/mini, approved Linux full targets, and independently proven Linux mini targets
        required: true
        default: ubuntu.24.04-x64
      runtime_profile:
        description: Real producer profile; full for all targets, mini only for explicitly approved linked/platform boundaries
        required: true
        default: full

permissions:
  contents: read

jobs:
  validate-target:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate real producer target
        shell: pwsh
        run: |
          $supportedTargets = @(
            'win-x64/full',
            'win-x64/mini',
            'win-arm64/full',
            'win-arm64/mini',
            'ubuntu.24.04-x64/full',
            'ubuntu.24.04-x64/mini',
            'ubuntu.24.04-arm64/full',
            'ubuntu.24.04-arm64/mini',
            'ubuntu.22.04-x64/full',
            'ubuntu.22.04-arm64/full',
            'ubuntu.22.04-arm64/mini',
            'debian.12-x64/full',
            'debian.12-arm64/full',
            'debian.12-arm64/mini',
            'fedora.40-x64/full',
            'rhel.9-x64/full',
            'rocky.9-x64/full',
            'alpine.3.20-x64/full',
            'alpine.3.20-x64/mini'
          )
          $selectedTarget = '${{ inputs.rid }}/${{ inputs.runtime_profile }}'
          if ($supportedTargets -notcontains $selectedTarget) {
            throw "runtime-input.yml currently produces runtime-input-win-x64-full, runtime-input-win-x64-mini, runtime-input-win-arm64-full, runtime-input-win-arm64-mini, runtime-input-ubuntu.24.04-x64-full, runtime-input-ubuntu.24.04-x64-mini, runtime-input-ubuntu.24.04-arm64-full, runtime-input-ubuntu.24.04-arm64-mini, runtime-input-ubuntu.22.04-x64-full, runtime-input-ubuntu.22.04-arm64-full, runtime-input-ubuntu.22.04-arm64-mini, runtime-input-debian.12-x64-full, runtime-input-debian.12-arm64-full, runtime-input-debian.12-arm64-mini, runtime-input-fedora.40-x64-full, runtime-input-rhel.9-x64-full, runtime-input-rocky.9-x64-full, runtime-input-alpine.3.20-x64-full, and runtime-input-alpine.3.20-x64-mini. Windows x86 and remaining mini/distro RIDs need separate linked-component or platform-native producer steps before being advertised as real runtime inputs."
          }

  produce:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ubuntu.24.04-x64
            profile: full
            os: ubuntu-24.04
          - rid: ubuntu.24.04-x64
            profile: mini
            os: ubuntu-24.04
          - rid: ubuntu.24.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.24.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
          - rid: ubuntu.22.04-x64
            profile: full
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unmatched producer target
        if: ${{ inputs.rid != matrix.rid || inputs.runtime_profile != matrix.profile }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - uses: actions/checkout@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Check project invariants
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1
      - name: Install native build tools
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ninja-build
      - name: Record Ubuntu ARM64 runner evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' }}
        id: arm64_runner
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "${ID:-}" = "ubuntu"
          test "${VERSION_ID:-}" = "24.04"
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

          runner_image="${ImageOS:-unknown}"
          runner_image_version="${ImageVersion:-unknown}"
          libc="$(getconf GNU_LIBC_VERSION)"
          cpu_model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          memory_bytes="$(( $(awk '/^MemTotal:/ { print $2 }' /proc/meminfo) * 1024 ))"
          disk_available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          process_architecture="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()' | tr -d '\r')"
          compiler_path="$(command -v g++)"
          compiler_version="$(g++ --version | sed -n '1p') target=$(g++ -dumpmachine)"
          assembler_target="$(as --version | sed -n '$p' | tr -cd '[:alnum:]_.+-')"
          assembler_version="$(as --version | sed -n '1p') target=$assembler_target"
          cmake_version="$(cmake --version | head -n 1)"
          ninja_version="$(ninja --version)"
          powershell_version="$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()' | tr -d '\r')"
          dotnet_version="$(dotnet --version)"
          test "$runner_image" != "unknown"
          test "$runner_image_version" != "unknown"
          test -n "$cpu_model"
          test "$memory_bytes" -gt 0
          test "$disk_available_bytes" -gt 0
          test "$process_architecture" = "Arm64"
          test -x "$compiler_path"
          test -n "$compiler_version"
          test -n "$assembler_target"
          test -n "$assembler_version"
          test -n "$cmake_version"
          test -n "$ninja_version"
          test -n "$powershell_version"
          test -n "$dotnet_version"

          printf '%s\n' \
            '#include <arm_neon.h>' \
            'uint8x16_t probe(unsigned char value) { return vdupq_n_u8(value); }' \
            'int main() { return 0; }' \
            > /tmp/opencv-arm64-neon.cpp
          g++ -c -O2 /tmp/opencv-arm64-neon.cpp -o /tmp/opencv-arm64-neon.o
          readelf -h /tmp/opencv-arm64-neon.o | grep -q 'Machine:.*AArch64'

          echo "UBUNTU_24_04_ARM64_RUNNER_EVIDENCE ImageOS=$runner_image ImageVersion=$runner_image_version ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) PROCESS_ARCH=$process_architecture DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc CPU=$cpu_model MEMORY_BYTES=$memory_bytes DISK_AVAILABLE_BYTES=$disk_available_bytes"
          echo "UBUNTU_24_04_ARM64_TOOLCHAIN_EVIDENCE COMPILER=$compiler_path COMPILER_VERSION=$compiler_version ASSEMBLER_VERSION=$assembler_version CMAKE=$cmake_version NINJA=$ninja_version POWERSHELL=$powershell_version DOTNET=$dotnet_version"
          lscpu
          df -h /
          df -B1 /
          cmake --version
          gcc --version
          g++ --version
          as --version
          pwsh --version
          dotnet --info
          echo "UBUNTU_24_04_ARM64_NEON_EVIDENCE machine=AArch64 neon_compile=success"

          {
            echo "runner_image=$runner_image"
            echo "runner_image_version=$runner_image_version"
            echo "hosted_distro=$ID"
            echo "hosted_distro_version=$VERSION_ID"
            echo "hosted_architecture=$(uname -m)"
            echo "hosted_package_architecture=$(dpkg --print-architecture)"
            echo "hosted_libc=$libc"
            echo "hosted_cpu_model=$cpu_model"
            echo "hosted_memory_bytes=$memory_bytes"
            echo "hosted_disk_available_bytes=$disk_available_bytes"
            echo "hosted_process_architecture=$process_architecture"
            echo "compiler_path=$compiler_path"
            echo "compiler_version=$compiler_version"
            echo "assembler_version=$assembler_version"
            echo "cmake_version=$cmake_version"
            echo "ninja_version=$ninja_version"
            echo "powershell_version=$powershell_version"
            echo "dotnet_version=$dotnet_version"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve Linux runtime build plan and native profile evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: profile
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $rid = @($matrix.rids | Where-Object { $_.rid -eq '${{ matrix.rid }}' } | Select-Object -First 1)
          if ($rid.Count -eq 0) {
            throw "Runtime RID was not found: ${{ matrix.rid }}"
          }

          $profile = @($matrix.profiles | Where-Object { $_.name -eq '${{ matrix.profile }}' } | Select-Object -First 1)
          if ($profile.Count -eq 0) {
            throw "Runtime profile was not found: ${{ matrix.profile }}"
          }

          $profileName = '${{ matrix.profile }}'
          $plan = & ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -Rid '${{ matrix.rid }}' `
            -BuildList ([string]$profile[0].buildList) `
            -DescribeOnly | ConvertFrom-Json
          if ($plan.Generator -ne 'Ninja' -or
              $plan.BuildSystem -ne 'single-config' -or
              $plan.InstallTarget -ne 'install') {
            throw "Linux OpenCV build plan did not match the audited Ninja single-config boundary."
          }

          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          function Get-NativeSourceList([string]$variableName) {
            $match = [regex]::Match($cmakeText, "(?s)set\($variableName(?<body>.*?)\)")
            if (-not $match.Success) {
              throw "Native CMake source list was not found: $variableName"
            }
            return @(
              [regex]::Matches($match.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') |
                ForEach-Object { $_.Groups[1].Value }
            )
          }

          $miniSources = @(Get-NativeSourceList 'OPENCV_CSHARP_MINI_NATIVE_SOURCES')
          $fullOnlySources = @(Get-NativeSourceList 'OPENCV_CSHARP_FULL_ONLY_NATIVE_SOURCES')
          $nativeSources = if ($profileName -eq 'mini') { @($miniSources) } else { @($miniSources + $fullOnlySources) }
          $expectedSourceCount = if ($profileName -eq 'mini') { 8 } else { 45 }
          $expectedAbiFunctionCount = if ($profileName -eq 'mini') { 304 } else { 1966 }
          $abiManifest = if ($profileName -eq 'mini') {
            './src/OpenCvSharp.Native/generated/legacy_abi_mini_manifest.txt'
          }
          else {
            './src/OpenCvSharp.Native/generated/legacy_abi_manifest.txt'
          }
          $abiFunctionLine = @(Get-Content -LiteralPath $abiManifest | Where-Object { $_ -match '^function-count=' })
          if ($abiFunctionLine.Count -ne 1) {
            throw "Native ABI manifest did not contain exactly one function-count value for profile $profileName."
          }
          $abiFunctionCount = [int](([string]$abiFunctionLine[0]) -replace '^function-count=', '')
          if ($nativeSources.Count -ne $expectedSourceCount -or $abiFunctionCount -ne $expectedAbiFunctionCount) {
            throw "Linux native profile evidence mismatch for ${profileName}: sources=$($nativeSources.Count), ABI=$abiFunctionCount."
          }
          foreach ($source in $nativeSources) {
            if (-not (Test-Path -LiteralPath (Join-Path ./src/OpenCvSharp.Native $source) -PathType Leaf)) {
              throw "Linux native profile source was not found: $source"
            }
          }
          $nativeSourcesJson = ConvertTo-Json -InputObject ([object[]]$nativeSources) -Compress
          Write-Host "LINUX_NATIVE_PROFILE_EVIDENCE rid=${{ matrix.rid }} profile=$profileName sources=$($nativeSources.Count) abi_functions=$abiFunctionCount build_list=$($profile[0].buildList)"

          "build_list=$($profile[0].buildList)" >> $env:GITHUB_OUTPUT
          "opencv_rid=$($rid[0].opencvRid)" >> $env:GITHUB_OUTPUT
          "distro=$($rid[0].distro)" >> $env:GITHUB_OUTPUT
          "distro_version=$($rid[0].distroVersion)" >> $env:GITHUB_OUTPUT
          "generator=$($plan.Generator)" >> $env:GITHUB_OUTPUT
          "configuration=Release" >> $env:GITHUB_OUTPUT
          "cmake_arguments=$($plan.CMakeArgs | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "native_wrapper_sources=$nativeSourcesJson" >> $env:GITHUB_OUTPUT
          "native_wrapper_source_count=$($nativeSources.Count)" >> $env:GITHUB_OUTPUT
          "native_abi_function_count=$abiFunctionCount" >> $env:GITHUB_OUTPUT
          "opencv_extra_cmake_args=" >> $env:GITHUB_OUTPUT
      - name: Fetch OpenCV source
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $sourceRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'opencv-source'
          $sourceDir = Join-Path $sourceRoot "opencv-${{ inputs.opencv_version }}"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          git -c advice.detachedHead=false clone --depth 1 --branch '${{ inputs.opencv_version }}' https://github.com/opencv/opencv.git $sourceDir
      - name: Build OpenCV runtime
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          pwsh -NoProfile -File ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -WorkspaceRoot $workspaceRoot `
            -Rid '${{ matrix.rid }}' `
            -BuildList '${{ steps.profile.outputs.build_list }}' `
            -Build
      - name: Record OpenCV ARM64 CPU configuration
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' }}
        id: arm64_opencv
        shell: bash
        run: |
          set -euo pipefail
          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          build_dir="$workspace_root/artifacts/opencv-build/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          cache="$build_dir/CMakeCache.txt"
          cpu_config="$(find "$build_dir" -type f -name cv_cpu_config.h -print -quit)"
          test -f "$cache"
          test -n "$cpu_config"

          cpu_evidence="$({
            grep -E '^(CPU_BASELINE|CPU_DISPATCH|CV_DISABLE_OPTIMIZATION):' "$cache" || true
            grep -E '^#define CV_CPU_(COMPILE|BASELINE|DISPATCH).*' "$cpu_config" || true
          } | tr '\n' ';')"
          test -n "$cpu_evidence"
          printf '%s\n' "$cpu_evidence" | grep -q 'NEON'
          echo "UBUNTU_24_04_ARM64_OPENCV_CPU_EVIDENCE $cpu_evidence"
          echo "opencv_cpu_configuration=$cpu_evidence" >> "$GITHUB_OUTPUT"
      - name: Configure linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $openCvInstallDir = Join-Path $workspaceRoot "artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          $openCvDirCandidates = @(
            (Join-Path $openCvInstallDir 'lib/cmake/opencv5'),
            (Join-Path $openCvInstallDir 'lib64/cmake/opencv5')
          )
          $openCvDirMatches = @($openCvDirCandidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'OpenCVConfig.cmake') -PathType Leaf } | Select-Object -First 1)
          if ($openCvDirMatches.Count -eq 0) {
            throw "OpenCVConfig.cmake was not found for linked native wrapper build. Checked: $($openCvDirCandidates -join ', ')"
          }
          $openCvDir = [string]$openCvDirMatches[0]

          cmake `
            -S src/OpenCvSharp.Native `
            -B build/native-linked `
            -G Ninja `
            "-DOPENCV_VERSION=${{ inputs.opencv_version }}" `
            "-DOPENCV_CSHARP_OPENCV_DIR=$openCvDir" `
            "-DOPENCV_CSHARP_OPENCV_BUILD_LIST=${{ steps.profile.outputs.build_list }}" `
            "-DOPENCV_CSHARP_RUNTIME_PROFILE=${{ matrix.profile }}"
      - name: Build linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        run: cmake --build build/native-linked --config Release
      - name: Test linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/native-linked -C Release --output-on-failure | tee build/native-linked/ctest-output.txt
          if [ '${{ matrix.rid }}' = 'ubuntu.24.04-arm64' ]; then
            grep -Fq '100% tests passed, 0 tests failed out of 5' build/native-linked/ctest-output.txt
            echo 'UBUNTU_24_04_ARM64_LINKED_CTEST_EVIDENCE profile=${{ matrix.profile }} passed=5 total=5'
          fi
      - name: Audit Ubuntu ARM64 producer ELF closure
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' }}
        id: arm64_elf
        shell: bash
        run: |
          set -euo pipefail
          profile='${{ matrix.profile }}'
          case "$profile" in
            full)
              expected_module_count=16
              expected_canonical_count=18
              expected_runtime_file_count=50
              expected_direct_opencv=16
              ;;
            mini)
              expected_module_count=6
              expected_canonical_count=8
              expected_runtime_file_count=20
              expected_direct_opencv=6
              ;;
            *)
              echo "Unsupported Ubuntu ARM64 runtime profile: $profile" >&2
              exit 1
              ;;
          esac
          IFS=',' read -r -a required_modules <<< '${{ steps.profile.outputs.build_list }}'
          test "${#required_modules[@]}" -eq "$expected_module_count"

          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          open_cv_install_dir="$workspace_root/artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          open_cv_runtime_dir=""
          for candidate in "$open_cv_install_dir/lib" "$open_cv_install_dir/lib64"; do
            if [ -d "$candidate" ]; then
              open_cv_runtime_dir="$candidate"
              break
            fi
          done
          test -n "$open_cv_runtime_dir"

          audit_dir="$GITHUB_WORKSPACE/build/native-arm64-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"
          cp -a "$open_cv_runtime_dir"/libopencv_*.so* "$audit_dir/"
          cp build/native-linked/libJYPPX.OpenCV.Native.so "$audit_dir/"
          compatibility_loader="$(find build/native-linked -maxdepth 1 -type f -name 'lib*.Native.so' ! -name 'libJYPPX.OpenCV.Native.so' -print -quit)"
          test -n "$compatibility_loader"
          cp "$compatibility_loader" "$audit_dir/"
          compatibility_loader="$audit_dir/$(basename "$compatibility_loader")"

          expected_names="$audit_dir/expected-runtime-files.txt"
          actual_names="$audit_dir/actual-runtime-files.txt"
          printf '%s\n' 'libJYPPX.OpenCV.Native.so' "$(basename "$compatibility_loader")" > "$expected_names"
          for module in "${required_modules[@]}"; do
            printf '%s\n' \
              "libopencv_${module}.so" \
              "libopencv_${module}.so.500" \
              "libopencv_${module}.so.${{ inputs.opencv_version }}" \
              >> "$expected_names"
          done
          find "$audit_dir" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) \
            ! -name 'expected-runtime-files.txt' \
            ! -name 'actual-runtime-files.txt' \
            -printf '%f\n' | sort > "$actual_names"
          sort -o "$expected_names" "$expected_names"
          test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
          diff -u "$expected_names" "$actual_names"

          mapfile -t opencv_elfs < <(find "$audit_dir" -maxdepth 1 -type f -name 'libopencv_*.so.${{ inputs.opencv_version }}' | sort)
          test "${#opencv_elfs[@]}" -eq "$expected_module_count"
          elf_files=("$audit_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader" "${opencv_elfs[@]}")
          test "${#elf_files[@]}" -eq "$expected_canonical_count"

          machine_count=0
          origin_count=0
          producer_path_count=0
          missing_dependency_count=0
          for elf in "${elf_files[@]}"; do
            test -f "$elf"
            readelf -h "$elf" | grep -q 'Machine:.*AArch64'
            machine_count=$((machine_count + 1))
            dynamic_paths="$(readelf -d "$elf" | grep -E '\((RPATH|RUNPATH)\)' || true)"
            printf '%s\n' "$dynamic_paths"
            printf '%s\n' "$dynamic_paths" | grep -Fq "\$ORIGIN"
            origin_count=$((origin_count + 1))
            if printf '%s\n' "$dynamic_paths" | grep -Eq '(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)'; then
              producer_path_count=$((producer_path_count + 1))
            fi
            missing="$(ldd "$elf" | grep 'not found' || true)"
            if [ -n "$missing" ]; then
              printf '%s\n' "$missing" >&2
              missing_dependency_count=$((missing_dependency_count + 1))
            fi
          done

          direct_opencv_dependencies="$(readelf -d "$audit_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c 'libopencv_.*so.500')"
          test "$machine_count" -eq "$expected_canonical_count"
          test "$origin_count" -eq "$expected_canonical_count"
          test "$producer_path_count" -eq 0
          test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
          test "$missing_dependency_count" -eq 0
          cmp -s "$audit_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader"
          audit_evidence="UBUNTU_24_04_ARM64_PRODUCER_ELF_EVIDENCE profile=$profile files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=AArch64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 loader_equal=true"
          echo "$audit_evidence"
          echo "elf_audit_evidence=$audit_evidence" >> "$GITHUB_OUTPUT"
      - name: Create runtime input artifact layout
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        env:
          PRODUCER_RUNNER_IMAGE: ${{ steps.arm64_runner.outputs.runner_image }}
          PRODUCER_RUNNER_IMAGE_VERSION: ${{ steps.arm64_runner.outputs.runner_image_version }}
          PRODUCER_HOSTED_DISTRO: ${{ steps.arm64_runner.outputs.hosted_distro }}
          PRODUCER_HOSTED_DISTRO_VERSION: ${{ steps.arm64_runner.outputs.hosted_distro_version }}
          PRODUCER_HOSTED_ARCHITECTURE: ${{ steps.arm64_runner.outputs.hosted_architecture }}
          PRODUCER_HOSTED_PACKAGE_ARCHITECTURE: ${{ steps.arm64_runner.outputs.hosted_package_architecture }}
          PRODUCER_HOSTED_LIBC: ${{ steps.arm64_runner.outputs.hosted_libc }}
          PRODUCER_HOSTED_CPU_MODEL: ${{ steps.arm64_runner.outputs.hosted_cpu_model }}
          PRODUCER_HOSTED_MEMORY_BYTES: ${{ steps.arm64_runner.outputs.hosted_memory_bytes }}
          PRODUCER_HOSTED_DISK_AVAILABLE_BYTES: ${{ steps.arm64_runner.outputs.hosted_disk_available_bytes }}
          PRODUCER_HOSTED_PROCESS_ARCHITECTURE: ${{ steps.arm64_runner.outputs.hosted_process_architecture }}
          PRODUCER_CMAKE_VERSION: ${{ steps.arm64_runner.outputs.cmake_version }}
          PRODUCER_CMAKE_GENERATOR: ${{ steps.profile.outputs.generator }}
          PRODUCER_BUILD_CONFIGURATION: ${{ steps.profile.outputs.configuration }}
          PRODUCER_COMPILER_PATH: ${{ steps.arm64_runner.outputs.compiler_path }}
          PRODUCER_COMPILER_VERSION: ${{ steps.arm64_runner.outputs.compiler_version }}
          PRODUCER_ASSEMBLER_VERSION: ${{ steps.arm64_runner.outputs.assembler_version }}
          PRODUCER_NINJA_VERSION: ${{ steps.arm64_runner.outputs.ninja_version }}
          PRODUCER_DOTNET_VERSION: ${{ steps.arm64_runner.outputs.dotnet_version }}
          PRODUCER_POWERSHELL_VERSION: ${{ steps.arm64_runner.outputs.powershell_version }}
          PRODUCER_OPENCV_CMAKE_ARGUMENTS: ${{ steps.profile.outputs.cmake_arguments }}
          PRODUCER_ELF_AUDIT_EVIDENCE: ${{ steps.arm64_elf.outputs.elf_audit_evidence }}
          PRODUCER_OPENCV_CPU_CONFIGURATION: ${{ steps.arm64_opencv.outputs.opencv_cpu_configuration }}
          PRODUCER_NATIVE_WRAPPER_SOURCES: ${{ steps.profile.outputs.native_wrapper_sources }}
          PRODUCER_NATIVE_WRAPPER_SOURCE_COUNT: ${{ steps.profile.outputs.native_wrapper_source_count }}
          PRODUCER_NATIVE_ABI_FUNCTION_COUNT: ${{ steps.profile.outputs.native_abi_function_count }}
          PRODUCER_OPENCV_EXTRA_CMAKE_ARGS: ${{ steps.profile.outputs.opencv_extra_cmake_args }}
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $openCvInstallDir = Join-Path $workspaceRoot "artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          $openCvRuntimeDirCandidates = @(
            (Join-Path $openCvInstallDir 'lib'),
            (Join-Path $openCvInstallDir 'lib64'),
            (Join-Path $openCvInstallDir 'bin')
          )
          $openCvRuntimeDirMatches = @($openCvRuntimeDirCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          if ($openCvRuntimeDirMatches.Count -eq 0) {
            throw "OpenCV runtime directory was not found for artifact layout. Checked: $($openCvRuntimeDirCandidates -join ', ')"
          }
          $openCvRuntimeDir = [string]$openCvRuntimeDirMatches[0]
          $openCvSourceDir = Join-Path $workspaceRoot "opencv-source/opencv-${{ inputs.opencv_version }}"

          & ./scripts/New-RuntimeInputArtifact.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -NativeRuntimeDir ./build/native-linked `
            -OpenCvRuntimeDir $openCvRuntimeDir `
            -OpenCvSourceDir $openCvSourceDir `
            -OpenCvInstallDir $openCvInstallDir `
            -HostedRunner '${{ matrix.os }}' `
            -RunnerImage $env:PRODUCER_RUNNER_IMAGE `
            -RunnerImageVersion $env:PRODUCER_RUNNER_IMAGE_VERSION `
            -HostedDistro $env:PRODUCER_HOSTED_DISTRO `
            -HostedDistroVersion $env:PRODUCER_HOSTED_DISTRO_VERSION `
            -HostedArchitecture $env:PRODUCER_HOSTED_ARCHITECTURE `
            -HostedPackageArchitecture $env:PRODUCER_HOSTED_PACKAGE_ARCHITECTURE `
            -HostedLibc $env:PRODUCER_HOSTED_LIBC `
            -HostedCpuModel $env:PRODUCER_HOSTED_CPU_MODEL `
            -HostedMemoryBytes $env:PRODUCER_HOSTED_MEMORY_BYTES `
            -HostedDiskAvailableBytes $env:PRODUCER_HOSTED_DISK_AVAILABLE_BYTES `
            -HostedProcessArchitecture $env:PRODUCER_HOSTED_PROCESS_ARCHITECTURE `
            -CMakeVersion $env:PRODUCER_CMAKE_VERSION `
            -CMakeGenerator $env:PRODUCER_CMAKE_GENERATOR `
            -BuildConfiguration $env:PRODUCER_BUILD_CONFIGURATION `
            -CompilerPath $env:PRODUCER_COMPILER_PATH `
            -CompilerVersion $env:PRODUCER_COMPILER_VERSION `
            -AssemblerVersion $env:PRODUCER_ASSEMBLER_VERSION `
            -NinjaVersion $env:PRODUCER_NINJA_VERSION `
            -DotNetVersion $env:PRODUCER_DOTNET_VERSION `
            -PowerShellVersion $env:PRODUCER_POWERSHELL_VERSION `
            -OpenCvCMakeArguments $env:PRODUCER_OPENCV_CMAKE_ARGUMENTS `
            -ElfAuditEvidence $env:PRODUCER_ELF_AUDIT_EVIDENCE `
            -OpenCvCpuConfiguration $env:PRODUCER_OPENCV_CPU_CONFIGURATION `
            -NativeWrapperSources $env:PRODUCER_NATIVE_WRAPPER_SOURCES `
            -NativeWrapperSourceCount $env:PRODUCER_NATIVE_WRAPPER_SOURCE_COUNT `
            -NativeAbiFunctionCount $env:PRODUCER_NATIVE_ABI_FUNCTION_COUNT `
            -OpenCvExtraCMakeArgs $env:PRODUCER_OPENCV_EXTRA_CMAKE_ARGS `
            -OutputRoot ./artifacts/runtime-inputs
      - name: Upload runtime input artifact
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
          if-no-files-found: error

  produce-windows:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            profile: full
            os: windows-latest
            processor_architecture: AMD64
            runtime_architecture: X64
            package_architecture: AMD64
            platform: x64
            tool_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            tool_host: Hostx64
            tool_target: x64
            opencv_arch_folder: x64
            evidence_prefix: WINDOWS_X64
          - rid: win-x64
            profile: mini
            os: windows-latest
            processor_architecture: AMD64
            runtime_architecture: X64
            package_architecture: AMD64
            platform: x64
            tool_component: Microsoft.VisualStudio.Component.VC.Tools.x86.x64
            tool_host: Hostx64
            tool_target: x64
            opencv_arch_folder: x64
            evidence_prefix: WINDOWS_X64
          - rid: win-arm64
            profile: full
            os: windows-11-vs2026-arm
            processor_architecture: ARM64
            runtime_architecture: Arm64
            package_architecture: ARM64
            platform: ARM64
            tool_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            tool_host: Hostarm64
            tool_target: arm64
            opencv_arch_folder: ARM64
            evidence_prefix: WINDOWS_ARM64
          - rid: win-arm64
            profile: mini
            os: windows-11-vs2026-arm
            processor_architecture: ARM64
            runtime_architecture: Arm64
            package_architecture: ARM64
            platform: ARM64
            tool_component: Microsoft.VisualStudio.Component.VC.Tools.ARM64
            tool_host: Hostarm64
            tool_target: arm64
            opencv_arch_folder: ARM64
            evidence_prefix: WINDOWS_ARM64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unmatched Windows producer target
        if: ${{ inputs.rid != matrix.rid || inputs.runtime_profile != matrix.profile }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - uses: actions/checkout@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Check project invariants
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1
      - name: Record native Windows runner and toolchain evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: windows
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $osArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($env:PROCESSOR_ARCHITECTURE -ne '${{ matrix.processor_architecture }}' -or
              $osArchitecture -ne '${{ matrix.runtime_architecture }}' -or
              $processArchitecture -ne '${{ matrix.runtime_architecture }}' -or
              -not [Environment]::Is64BitProcess) {
            throw "${{ matrix.rid }}/${{ matrix.profile }} production requires an actual ${{ matrix.processor_architecture }} Windows host and native ${{ matrix.runtime_architecture }} process."
          }
          if ('${{ matrix.rid }}' -eq 'win-arm64' -and
              (-not [string]::IsNullOrWhiteSpace($env:PROCESSOR_ARCHITEW6432) -or $env:RUNNER_ARCH -ne 'ARM64')) {
            throw "win-arm64/${{ matrix.profile }} production must not run through x64 compatibility translation."
          }
          if ([string]::IsNullOrWhiteSpace($env:ImageOS) -or [string]::IsNullOrWhiteSpace($env:ImageVersion)) {
            throw "GitHub hosted Windows image evidence was not available."
          }

          $os = Get-CimInstance Win32_OperatingSystem
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $computer = Get-CimInstance Win32_ComputerSystem
          $workspaceDrive = [System.IO.Path]::GetPathRoot($env:GITHUB_WORKSPACE).TrimEnd(
            [System.IO.Path]::DirectorySeparatorChar,
            [System.IO.Path]::AltDirectorySeparatorChar)
          $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='$workspaceDrive'"
          if ($null -eq $cpu -or $null -eq $disk -or [long]$disk.FreeSpace -le 0) {
            throw "Native Windows CPU or workspace disk evidence was not available."
          }
          if ('${{ matrix.rid }}' -eq 'win-arm64' -and
              ([int]$cpu.Architecture -ne 12 -or [int]$cpu.AddressWidth -ne 64 -or [long]$computer.TotalPhysicalMemory -lt 8GB)) {
            throw "Windows ARM64 CPU or memory evidence did not match the audited native host boundary."
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) {
            throw "vswhere.exe was not found."
          }
          $instances = @(& $vswhere -latest -products * -requires '${{ matrix.tool_component }}' -format json | ConvertFrom-Json)
          if ($instances.Count -ne 1) {
            throw "Exactly one latest Visual Studio instance with native ${{ matrix.tool_target }} C++ tools was expected."
          }
          $visualStudio = $instances[0]
          if (-not ([string]$visualStudio.installationVersion).StartsWith("18.", [System.StringComparison]::Ordinal)) {
            throw "Visual Studio 18 is required by the audited native Windows build plan."
          }

          $compilerPattern = '[\\/]bin[\\/]' + [regex]::Escape('${{ matrix.tool_host }}') + '[\\/]' + [regex]::Escape('${{ matrix.tool_target }}') + '[\\/]cl\.exe$'
          $cl = Get-ChildItem -LiteralPath (Join-Path $visualStudio.installationPath "VC/Tools/MSVC") -Recurse -File -Filter cl.exe |
            Where-Object { $_.FullName -match $compilerPattern } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $cl) {
            throw "Native ${{ matrix.tool_host }}/${{ matrix.tool_target }} cl.exe was not found."
          }
          $dumpbin = Join-Path $cl.DirectoryName "dumpbin.exe"
          if (-not (Test-Path -LiteralPath $dumpbin -PathType Leaf)) {
            throw "dumpbin.exe was not found beside the selected native compiler."
          }

          $msvcToolsetVersion = [regex]::Match($cl.FullName, '[\\/]MSVC[\\/]([^\\/]+)[\\/]bin[\\/]').Groups[1].Value
          $msvcCompilerVersion = $cl.VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($msvcToolsetVersion) -or [string]::IsNullOrWhiteSpace($msvcCompilerVersion)) {
            throw "MSVC toolset/compiler versions could not be resolved."
          }

          $cmakeVersion = (& cmake --version | Select-Object -First 1).Trim()
          $powerShellVersion = $PSVersionTable.PSVersion.ToString()
          $dotnetVersion = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet --version failed."
          }

          $cpuName = $cpu.Name.Trim()
          $msvcVersion = "$msvcToolsetVersion (compiler $msvcCompilerVersion)"
          Write-Host "${{ matrix.evidence_prefix }}_PRODUCER_HOST_EVIDENCE ImageOS=$($env:ImageOS) ImageVersion=$($env:ImageVersion) Caption=$($os.Caption) OSVersion=$($os.Version) BuildNumber=$($os.BuildNumber) RUNNER_ARCH=$($env:RUNNER_ARCH) PROCESSOR_ARCHITECTURE=$($env:PROCESSOR_ARCHITECTURE) OSArchitecture=$osArchitecture ProcessArchitecture=$processArchitecture Is64BitProcess=$([Environment]::Is64BitProcess) PROCESSOR_ARCHITEW6432=$($env:PROCESSOR_ARCHITEW6432) WORKSPACE_DRIVE=$workspaceDrive CPU=$cpuName CPUArchitecture=$($cpu.Architecture) AddressWidth=$($cpu.AddressWidth) MEMORY_BYTES=$($computer.TotalPhysicalMemory) DISK_AVAILABLE_BYTES=$($disk.FreeSpace)"
          Write-Host "${{ matrix.evidence_prefix }}_PRODUCER_TOOLCHAIN_EVIDENCE VisualStudioVersion=$($visualStudio.installationVersion) VisualStudioPath=$($visualStudio.installationPath) MSVCVersion=$msvcVersion Compiler=$($cl.FullName) Dumpbin=$dumpbin CMake=$cmakeVersion PowerShell=$powerShellVersion DotNet=$dotnetVersion"

          "runner_image=$($env:ImageOS)" >> $env:GITHUB_OUTPUT
          "runner_image_version=$($env:ImageVersion)" >> $env:GITHUB_OUTPUT
          "os_caption=$($os.Caption)" >> $env:GITHUB_OUTPUT
          "os_version=$($os.Version)" >> $env:GITHUB_OUTPUT
          "os_build_number=$($os.BuildNumber)" >> $env:GITHUB_OUTPUT
          "os_architecture=$osArchitecture" >> $env:GITHUB_OUTPUT
          "process_architecture=$processArchitecture" >> $env:GITHUB_OUTPUT
          "cpu_model=$cpuName" >> $env:GITHUB_OUTPUT
          "memory_bytes=$($computer.TotalPhysicalMemory)" >> $env:GITHUB_OUTPUT
          "disk_available_bytes=$($disk.FreeSpace)" >> $env:GITHUB_OUTPUT
          "visual_studio_version=$($visualStudio.installationVersion)" >> $env:GITHUB_OUTPUT
          "msvc_version=$msvcVersion" >> $env:GITHUB_OUTPUT
          "compiler_path=$($cl.FullName)" >> $env:GITHUB_OUTPUT
          "dumpbin_path=$dumpbin" >> $env:GITHUB_OUTPUT
          "cmake_version=$cmakeVersion" >> $env:GITHUB_OUTPUT
      - name: Resolve Windows runtime build plan and native profile evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: profile
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $rid = @($matrix.rids | Where-Object { $_.rid -eq '${{ matrix.rid }}' })
          $profile = @($matrix.profiles | Where-Object { $_.name -eq '${{ matrix.profile }}' })
          if ($rid.Count -ne 1 -or $profile.Count -ne 1) {
            throw "Windows runtime RID/profile was not found exactly once in the matrix."
          }

          $profileName = '${{ matrix.profile }}'
          $extraCMakeArgs = if ($profileName -eq 'mini') { '-DCMAKE_ASM_COMPILER:FILEPATH=NOTFOUND' } else { '' }

          $plan = & ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -Rid '${{ matrix.rid }}' `
            -BuildList ([string]$profile[0].buildList) `
            -ExtraCMakeArgs $extraCMakeArgs `
            -DescribeOnly | ConvertFrom-Json
          if ($plan.Generator -ne 'Visual Studio 18 2026' -or
              $plan.Platform -ne '${{ matrix.platform }}' -or
              $plan.BuildSystem -ne 'multi-config' -or
              $plan.InstallTarget -ne 'INSTALL') {
            throw "Windows OpenCV build plan did not match the audited VS 18 ${{ matrix.platform }} multi-config boundary."
          }

          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          function Get-NativeSourceList([string]$variableName) {
            $match = [regex]::Match($cmakeText, "(?s)set\($variableName(?<body>.*?)\)")
            if (-not $match.Success) {
              throw "Native CMake source list was not found: $variableName"
            }

            return @(
              [regex]::Matches($match.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') |
                ForEach-Object { $_.Groups[1].Value }
            )
          }

          $miniSources = @(Get-NativeSourceList -variableName 'OPENCV_CSHARP_MINI_NATIVE_SOURCES')
          $fullOnlySources = @(Get-NativeSourceList -variableName 'OPENCV_CSHARP_FULL_ONLY_NATIVE_SOURCES')
          $nativeSources = if ($profileName -eq 'mini') { @($miniSources) } else { @($miniSources + $fullOnlySources) }
          $expectedSourceCount = if ($profileName -eq 'mini') { 8 } else { 45 }
          $expectedAbiFunctionCount = if ($profileName -eq 'mini') { 304 } else { 1966 }
          $abiManifest = if ($profileName -eq 'mini') {
            './src/OpenCvSharp.Native/generated/legacy_abi_mini_manifest.txt'
          }
          else {
            './src/OpenCvSharp.Native/generated/legacy_abi_manifest.txt'
          }
          $abiFunctionLine = Get-Content -LiteralPath $abiManifest | Where-Object { $_ -match '^function-count=' }
          if (@($abiFunctionLine).Count -ne 1) {
            throw "Native ABI manifest did not contain exactly one function-count value for profile $profileName."
          }
          $abiFunctionCount = [int](([string]$abiFunctionLine) -replace '^function-count=', '')
          if ($nativeSources.Count -ne $expectedSourceCount -or $abiFunctionCount -ne $expectedAbiFunctionCount) {
            throw "Windows native profile evidence mismatch for ${profileName}: sources=$($nativeSources.Count), ABI=$abiFunctionCount."
          }
          foreach ($source in $nativeSources) {
            if (-not (Test-Path -LiteralPath (Join-Path ./src/OpenCvSharp.Native $source) -PathType Leaf)) {
              throw "Windows native profile source was not found: $source"
            }
          }
          $nativeSourcesJson = ConvertTo-Json -InputObject ([object[]]$nativeSources) -Compress
          Write-Host "${{ matrix.evidence_prefix }}_NATIVE_PROFILE_EVIDENCE profile=$profileName sources=$($nativeSources.Count) abi_functions=$abiFunctionCount build_list=$($profile[0].buildList)"

          "build_list=$($profile[0].buildList)" >> $env:GITHUB_OUTPUT
          "opencv_extra_cmake_args=$extraCMakeArgs" >> $env:GITHUB_OUTPUT
          "opencv_rid=$($rid[0].opencvRid)" >> $env:GITHUB_OUTPUT
          "generator=$($plan.Generator)" >> $env:GITHUB_OUTPUT
          "platform=$($plan.Platform)" >> $env:GITHUB_OUTPUT
          "configuration=Release" >> $env:GITHUB_OUTPUT
          "cmake_arguments=$($plan.CMakeArgs | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "native_wrapper_sources=$nativeSourcesJson" >> $env:GITHUB_OUTPUT
          "native_wrapper_source_count=$($nativeSources.Count)" >> $env:GITHUB_OUTPUT
          "native_abi_function_count=$abiFunctionCount" >> $env:GITHUB_OUTPUT
      - name: Fetch OpenCV source
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $sourceRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'opencv-source'
          $sourceDir = Join-Path $sourceRoot "opencv-${{ inputs.opencv_version }}"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          git -c advice.detachedHead=false clone --depth 1 --branch '${{ inputs.opencv_version }}' https://github.com/opencv/opencv.git $sourceDir
          if ($LASTEXITCODE -ne 0) {
            throw "OpenCV source clone failed."
          }
      - name: Apply audited Windows ARM64 OpenCV MLAS processor patch
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'win-arm64' }}
        id: arm64_patch
        shell: pwsh
        run: |
          $relativePatchPath = 'packaging/runtime/patches/windows-arm64-mlas-processor-case.patch'
          $relativeTargetPath = '3rdparty/mlas/CMakeLists.txt'
          $patchPath = Join-Path $env:GITHUB_WORKSPACE $relativePatchPath
          $sourceDir = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'opencv-source/opencv-${{ inputs.opencv_version }}'
          $targetPath = Join-Path $sourceDir $relativeTargetPath
          if (-not (Test-Path -LiteralPath $patchPath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $targetPath -PathType Leaf)) {
            throw "Windows ARM64 OpenCV MLAS processor patch input was not found."
          }

          git -C $sourceDir apply --check $patchPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows ARM64 OpenCV MLAS processor patch did not apply cleanly to the selected source."
          }
          git -C $sourceDir apply $patchPath
          if ($LASTEXITCODE -ne 0) {
            throw "Windows ARM64 OpenCV MLAS processor patch failed."
          }
          git -C $sourceDir diff --check
          if ($LASTEXITCODE -ne 0) {
            throw "Patched Windows ARM64 OpenCV source failed git diff --check."
          }

          $changedFiles = @(git -C $sourceDir diff --name-only)
          $targetText = Get-Content -LiteralPath $targetPath -Raw
          if ($changedFiles.Count -ne 1 -or
              $changedFiles[0] -ne $relativeTargetPath -or
              $targetText -notmatch 'CMAKE_SYSTEM_PROCESSOR MATCHES "\^\(arm64\|ARM64\)\.\*"' -or
              $targetText -match 'CMAKE_SYSTEM_PROCESSOR MATCHES "\^arm64\.\*"') {
            throw "Windows ARM64 OpenCV patch did not retain the exact MLAS processor-case change."
          }

          $patchSha256 = (Get-FileHash -LiteralPath $patchPath -Algorithm SHA256).Hash
          $evidence = [ordered]@{
            Path = $relativePatchPath
            Sha256 = $patchSha256
            Target = $relativeTargetPath
            Reason = 'accept-uppercase-cmake-arm64-for-mlas-detection'
          } | ConvertTo-Json -Compress
          Write-Host "WINDOWS_ARM64_OPENCV_SOURCE_PATCH_OK path=$relativePatchPath sha256=$patchSha256 target=$relativeTargetPath"
          "source_patch_evidence=$evidence" >> $env:GITHUB_OUTPUT
      - name: Build native Windows OpenCV runtime
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: windows_build
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $foreignToolPattern = '(?i)(?:^|[\\/])(?:mingw(?:32|64)?|msys(?:2|64)?|cygwin(?:64)?)(?:[\\/]|$)'
          $pathEntries = @(
            $env:Path -split [System.IO.Path]::PathSeparator |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          )
          $genericCompilerNames = @('cc.exe', 'gcc.exe', 'g++.exe', 'c++.exe')
          $genericCompilerDirectorySet = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($tool in $genericCompilerNames) {
            foreach ($command in @(Get-Command -Name $tool -CommandType Application -All -ErrorAction SilentlyContinue)) {
              $commandDirectory = [System.IO.Path]::GetDirectoryName([string]$command.Source)
              [void]$genericCompilerDirectorySet.Add($commandDirectory)
            }
          }
          $excludedForeignToolDirectories = @(
            $pathEntries |
              Where-Object {
                $_ -match $foreignToolPattern -or
                  $genericCompilerDirectorySet.Contains($_.TrimEnd([System.IO.Path]::DirectorySeparatorChar, [System.IO.Path]::AltDirectorySeparatorChar))
              } |
              Sort-Object -Unique
          )
          $sanitizedPathEntries = @($pathEntries | Where-Object { $excludedForeignToolDirectories -notcontains $_ })
          if ($sanitizedPathEntries.Count -eq 0) {
            throw "Windows producer PATH sanitization removed every PATH entry."
          }

          $env:Path = $sanitizedPathEntries -join [System.IO.Path]::PathSeparator
          Remove-Item Env:ASM -ErrorAction SilentlyContinue
          foreach ($tool in $genericCompilerNames) {
            $foreignTool = Get-Command -Name $tool -CommandType Application -ErrorAction SilentlyContinue
            if ($null -ne $foreignTool) {
              throw "Foreign generic compiler remained in the Windows OpenCV producer PATH after sanitization: $($foreignTool.Source)"
            }
          }
          foreach ($requiredTool in @('cmake.exe', 'pwsh.exe')) {
            if ($null -eq (Get-Command -Name $requiredTool -CommandType Application -ErrorAction SilentlyContinue)) {
              throw "Required Windows producer tool was lost during PATH sanitization: $requiredTool"
            }
          }

          $excludedForeignToolDirectoriesJson = ConvertTo-Json -InputObject ([object[]]$excludedForeignToolDirectories) -Compress
          Write-Host "${{ matrix.evidence_prefix }}_OPENCV_PATH_SANITIZED excluded_foreign_tool_directories=$excludedForeignToolDirectoriesJson generic_gnu_compilers=absent asm_environment=cleared"
          "excluded_foreign_tool_directories=$excludedForeignToolDirectoriesJson" >> $env:GITHUB_OUTPUT

          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          & ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -WorkspaceRoot $workspaceRoot `
            -Rid '${{ matrix.rid }}' `
            -BuildList '${{ steps.profile.outputs.build_list }}' `
            -ExtraCMakeArgs '${{ steps.profile.outputs.opencv_extra_cmake_args }}' `
            -Build
      - name: Record Windows OpenCV build evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: opencv_build
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $buildDir = Join-Path $workspaceRoot 'artifacts/opencv-build/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}'
          $cachePath = Join-Path $buildDir 'CMakeCache.txt'
          $cache = Get-Content -LiteralPath $cachePath -Raw
          if ($cache -notmatch '(?m)^CMAKE_GENERATOR:INTERNAL=Visual Studio 18 2026\r?$' -or
              $cache -notmatch '(?m)^CMAKE_GENERATOR_PLATFORM:INTERNAL=${{ matrix.platform }}\r?$') {
            throw "OpenCV CMake cache did not retain the audited VS 18 ${{ matrix.platform }} boundary."
          }

          $ridName = '${{ matrix.rid }}'
          $profileName = '${{ matrix.profile }}'
          $asmCompilerMatch = [regex]::Match($cache, '(?m)^CMAKE_ASM_COMPILER:[^=]+=([^\r\n]+)\r?$')
          $mlasEnabledMatch = [regex]::Match($cache, '(?m)^OPENCV_DNN_MLAS_ENABLED:INTERNAL=([^\r\n]+)\r?$')
          $mlasSkipReasonMatch = [regex]::Match($cache, '(?m)^OPENCV_DNN_MLAS_SKIP_REASON:INTERNAL=([^\r\n]+)\r?$')
          Write-Host "${{ matrix.evidence_prefix }}_OPENCV_ASM_CACHE_EVIDENCE CMAKE_ASM_COMPILER=$($asmCompilerMatch.Groups[1].Value) OPENCV_DNN_MLAS_ENABLED=$($mlasEnabledMatch.Groups[1].Value) OPENCV_DNN_MLAS_SKIP_REASON=$($mlasSkipReasonMatch.Groups[1].Value)"
          if (-not $asmCompilerMatch.Success -or
              $asmCompilerMatch.Groups[1].Value -ne 'NOTFOUND') {
            throw "Windows OpenCV build did not retain the pure-MSVC generic-ASM fallback boundary."
          }
          if ($ridName -eq 'win-arm64' -and $profileName -eq 'full') {
            if (-not $mlasEnabledMatch.Success -or
                $mlasEnabledMatch.Groups[1].Value -ne '0' -or
                -not $mlasSkipReasonMatch.Success -or
                $mlasSkipReasonMatch.Groups[1].Value -notmatch '^no ASM compiler available for (?:ARM64|arm64)$') {
              throw "Windows ARM64 full OpenCV build did not retain its factual pure-MSVC MLAS fallback boundary."
            }
            $mlasEnabled = $mlasEnabledMatch.Groups[1].Value
            $mlasSkipReason = $mlasSkipReasonMatch.Groups[1].Value
          }
          elseif ($profileName -eq 'full') {
            if (-not $mlasEnabledMatch.Success -or
                $mlasEnabledMatch.Groups[1].Value -ne '0' -or
                -not $mlasSkipReasonMatch.Success -or
                $mlasSkipReasonMatch.Groups[1].Value -notmatch '^no ASM compiler available for (?:AMD64|amd64)$') {
              throw "Windows full OpenCV build did not retain the audited MLAS fallback boundary."
            }
            $mlasEnabled = $mlasEnabledMatch.Groups[1].Value
            $mlasSkipReason = $mlasSkipReasonMatch.Groups[1].Value
          }
          else {
            if ($mlasEnabledMatch.Success -or $mlasSkipReasonMatch.Success) {
              throw "Windows mini OpenCV build unexpectedly configured full-only DNN MLAS."
            }
            if (Get-ChildItem -LiteralPath $buildDir -Recurse -File -Filter opencv_dnn.vcxproj | Select-Object -First 1) {
              throw "Windows mini OpenCV build unexpectedly generated the full-only DNN project."
            }
            $mlasEnabled = 'NOT_BUILT'
            $mlasSkipReason = 'dnn excluded by mini profile'
          }
          if ($cache -match '(?i)(?:mingw|msys|cygwin)') {
            throw "Windows OpenCV CMake cache retained a foreign GNU toolchain path."
          }

          $coreProject = Get-ChildItem -LiteralPath $buildDir -Recurse -File -Filter opencv_core.vcxproj | Select-Object -First 1
          if ($null -eq $coreProject) {
            throw "Generated opencv_core.vcxproj was not found."
          }
          $coreProjectText = Get-Content -LiteralPath $coreProject.FullName -Raw
          foreach ($foreignLinkToken in @('-lpthread', '.dll.a', 'mingw', 'msys', 'cygwin')) {
            if ($coreProjectText.IndexOf($foreignLinkToken, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
              throw "Generated OpenCV MSVC project retained foreign linker/toolchain token '$foreignLinkToken'."
            }
          }
          if ($ridName -eq 'win-arm64') {
            foreach ($x64Token in @('Hostx64\x64', '<Platform>x64</Platform>', 'MachineX64', '/machine:x64', '-mavx')) {
              if ($coreProjectText.IndexOf($x64Token, [System.StringComparison]::OrdinalIgnoreCase) -ge 0) {
                throw "Generated Windows ARM64 OpenCV project retained x64 compiler or machine evidence '$x64Token'."
              }
            }
          }
          [xml]$project = Get-Content -LiteralPath $coreProject.FullName -Raw
          $sdkVersions = @(
            $project.SelectNodes("//*[local-name()='WindowsTargetPlatformVersion']") |
              ForEach-Object { $_.InnerText.Trim() } |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
              Sort-Object -Unique
          )
          if ($sdkVersions.Count -ne 1) {
            throw "OpenCV project did not record exactly one Windows SDK version."
          }

          $cpuConfiguration = @(
            $cache -split '\r?\n' |
              Where-Object { $_ -match '^(CPU_BASELINE|CPU_DISPATCH|CV_DISABLE_OPTIMIZATION):[^=]*=' }
          ) -join ';'
          if ([string]::IsNullOrWhiteSpace($cpuConfiguration)) {
            throw "OpenCV CPU baseline/dispatch configuration was not recorded."
          }
          if ($ridName -eq 'win-arm64' -and $cpuConfiguration -match '(?i)(?:SSE|AVX)') {
            throw "Windows ARM64 OpenCV CPU configuration retained x86/x64 SIMD evidence: $cpuConfiguration"
          }

          $asmConfiguration = "CMAKE_ASM_COMPILER=$($asmCompilerMatch.Groups[1].Value);OPENCV_DNN_MLAS_ENABLED=$mlasEnabled;OPENCV_DNN_MLAS_SKIP_REASON=$mlasSkipReason"
          Write-Host "${{ matrix.evidence_prefix }}_OPENCV_BUILD_EVIDENCE Generator=${{ steps.profile.outputs.generator }} Platform=${{ steps.profile.outputs.platform }} Configuration=${{ steps.profile.outputs.configuration }} WindowsSDK=$($sdkVersions[0]) BuildList=${{ steps.profile.outputs.build_list }} CPU=$cpuConfiguration ASM=$asmConfiguration"
          "windows_sdk_version=$($sdkVersions[0])" >> $env:GITHUB_OUTPUT
          "opencv_cpu_configuration=$cpuConfiguration" >> $env:GITHUB_OUTPUT
          "opencv_asm_configuration=$asmConfiguration" >> $env:GITHUB_OUTPUT
      - name: Resolve Windows OpenCV install layout
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: opencv
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $installDir = Join-Path $workspaceRoot 'artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}'
          $binarySuffix = (('${{ inputs.opencv_version }}' -split '\.') | Select-Object -First 3) -join ''
          $configCandidates = @(
            (Join-Path $installDir '${{ matrix.opencv_arch_folder }}/vc18/lib'),
            (Join-Path $installDir 'lib/cmake/opencv5'),
            (Join-Path $installDir 'lib'),
            $installDir
          )
          $runtimeCandidates = @(
            (Join-Path $installDir '${{ matrix.opencv_arch_folder }}/vc18/bin'),
            (Join-Path $installDir '${{ matrix.opencv_arch_folder }}/vc18/bin/Release'),
            (Join-Path $installDir 'bin'),
            (Join-Path $installDir 'bin/Release')
          )
          $configMatches = @($configCandidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'OpenCVConfig.cmake') -PathType Leaf } | Select-Object -First 1)
          $runtimeMatches = @($runtimeCandidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ "opencv_core$binarySuffix.dll") -PathType Leaf } | Select-Object -First 1)
          if ($configMatches.Count -ne 1 -or $runtimeMatches.Count -ne 1) {
            throw "Exact Windows OpenCV config/runtime directories were not resolved. Config matches: $($configMatches -join ', '); runtime matches: $($runtimeMatches -join ', ')."
          }

          "install_dir=$installDir" >> $env:GITHUB_OUTPUT
          "config_dir=$($configMatches[0])" >> $env:GITHUB_OUTPUT
          "runtime_dir=$($runtimeMatches[0])" >> $env:GITHUB_OUTPUT
      - name: Configure linked Windows native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          cmake `
            -S src/OpenCvSharp.Native `
            -B build/native-linked `
            -G '${{ steps.profile.outputs.generator }}' `
            -A '${{ steps.profile.outputs.platform }}' `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            '-DOPENCV_VERSION=${{ inputs.opencv_version }}' `
            '-DOPENCV_CSHARP_OPENCV_DIR=${{ steps.opencv.outputs.config_dir }}' `
            '-DOPENCV_CSHARP_OPENCV_BUILD_LIST=${{ steps.profile.outputs.build_list }}' `
            '-DOPENCV_CSHARP_RUNTIME_PROFILE=${{ matrix.profile }}' `
            '-DOPENCV_CSHARP_OPENCV_RUNTIME_ROOT=${{ steps.opencv.outputs.runtime_dir }}'
          if ($LASTEXITCODE -ne 0) {
            throw "Linked Windows native wrapper configuration failed."
          }
      - name: Build linked Windows native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          cmake --build build/native-linked --config Release
          if ($LASTEXITCODE -ne 0) {
            throw "Linked Windows native wrapper build failed."
          }
      - name: Test linked Windows native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $output = @(ctest --test-dir build/native-linked -C Release --output-on-failure 2>&1)
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          $text = $output -join [System.Environment]::NewLine
          $successSummaryPattern = '(?m)^100% tests passed(?:, 0 tests failed)? out of 5\r?$'
          if ($exitCode -ne 0 -or $text -notmatch $successSummaryPattern) {
            throw "Linked Windows native wrapper did not pass all five CTests."
          }
          Write-Host '${{ matrix.evidence_prefix }}_LINKED_CTEST_EVIDENCE passed=5 total=5'
      - name: Audit native Windows producer PE closure
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: pe
        shell: pwsh
        run: |
          $output = @(
            pwsh -NoProfile -File ./scripts/Test-WindowsRuntimePeClosure.ps1 `
              -RuntimeDirectory ./build/native-linked/Release `
              -Rid '${{ matrix.rid }}' `
              -RuntimeProfile '${{ matrix.profile }}' `
              -OpenCvVersion '${{ inputs.opencv_version }}' `
              -DumpbinPath '${{ steps.windows.outputs.dumpbin_path }}' 2>&1
          )
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
            throw "${{ matrix.rid }} producer PE closure audit failed."
          }
          $markers = @($output | Where-Object { ([string]$_).StartsWith('WINDOWS_PE_AUDIT_OK ', [System.StringComparison]::Ordinal) })
          if ($markers.Count -ne 1) {
            throw "${{ matrix.rid }} producer PE audit emitted no unique success marker."
          }
          "pe_audit=$($markers[0])" >> $env:GITHUB_OUTPUT
      - name: Create Windows runtime input artifact layout
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $openCvSourceDir = Join-Path $workspaceRoot 'opencv-source/opencv-${{ inputs.opencv_version }}'
          & ./scripts/New-RuntimeInputArtifact.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -NativeRuntimeDir ./build/native-linked/Release `
            -OpenCvRuntimeDir '${{ steps.opencv.outputs.runtime_dir }}' `
            -OpenCvSourceDir $openCvSourceDir `
            -OpenCvInstallDir '${{ steps.opencv.outputs.install_dir }}' `
            -HostedRunner '${{ matrix.os }}' `
            -RunnerImage '${{ steps.windows.outputs.runner_image }}' `
            -RunnerImageVersion '${{ steps.windows.outputs.runner_image_version }}' `
            -HostedDistro 'windows' `
            -HostedDistroVersion '${{ steps.windows.outputs.os_version }}' `
            -HostedArchitecture '${{ steps.windows.outputs.os_architecture }}' `
            -HostedPackageArchitecture '${{ matrix.package_architecture }}' `
            -HostedCpuModel '${{ steps.windows.outputs.cpu_model }}' `
            -HostedMemoryBytes '${{ steps.windows.outputs.memory_bytes }}' `
            -HostedDiskAvailableBytes '${{ steps.windows.outputs.disk_available_bytes }}' `
            -HostedOsCaption '${{ steps.windows.outputs.os_caption }}' `
            -HostedOsVersion '${{ steps.windows.outputs.os_version }}' `
            -HostedOsBuildNumber '${{ steps.windows.outputs.os_build_number }}' `
            -HostedProcessArchitecture '${{ steps.windows.outputs.process_architecture }}' `
            -VisualStudioVersion '${{ steps.windows.outputs.visual_studio_version }}' `
            -MsvcVersion '${{ steps.windows.outputs.msvc_version }}' `
            -WindowsSdkVersion '${{ steps.opencv_build.outputs.windows_sdk_version }}' `
            -CMakeVersion '${{ steps.windows.outputs.cmake_version }}' `
            -CMakeGenerator '${{ steps.profile.outputs.generator }}' `
            -CMakePlatform '${{ steps.profile.outputs.platform }}' `
            -BuildConfiguration '${{ steps.profile.outputs.configuration }}' `
            -CompilerPath '${{ steps.windows.outputs.compiler_path }}' `
            -OpenCvCMakeArguments '${{ steps.profile.outputs.cmake_arguments }}' `
            -PeAuditEvidence '${{ steps.pe.outputs.pe_audit }}' `
            -OpenCvCpuConfiguration '${{ steps.opencv_build.outputs.opencv_cpu_configuration }}' `
            -ExcludedForeignToolDirectories '${{ steps.windows_build.outputs.excluded_foreign_tool_directories }}' `
            -OpenCvAsmConfiguration '${{ steps.opencv_build.outputs.opencv_asm_configuration }}' `
            -NativeWrapperSources '${{ steps.profile.outputs.native_wrapper_sources }}' `
            -NativeWrapperSourceCount '${{ steps.profile.outputs.native_wrapper_source_count }}' `
            -NativeAbiFunctionCount '${{ steps.profile.outputs.native_abi_function_count }}' `
            -OpenCvExtraCMakeArgs '${{ steps.profile.outputs.opencv_extra_cmake_args }}' `
            -OpenCvSourcePatchEvidence '${{ steps.arm64_patch.outputs.source_patch_evidence }}' `
            -OutputRoot ./artifacts/runtime-inputs
      - name: Upload Windows runtime input artifact
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
          if-no-files-found: error

  produce-container:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ubuntu.22.04-arm64
            profile: full
            os: ubuntu-24.04-arm
            container_image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
            opencv_extra_cmake_args: ""
          - rid: ubuntu.22.04-arm64
            profile: mini
            os: ubuntu-24.04-arm
            container_image: ubuntu:22.04@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982
            opencv_extra_cmake_args: ""
          - rid: debian.12-arm64
            profile: full
            os: ubuntu-24.04-arm
            container_image: debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
            opencv_extra_cmake_args: ""
          - rid: debian.12-arm64
            profile: mini
            os: ubuntu-24.04-arm
            container_image: debian:12@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc
            opencv_extra_cmake_args: ""
          - rid: debian.12-x64
            profile: full
            os: ubuntu-24.04
            container_image: debian:12
            opencv_extra_cmake_args: ""
          - rid: fedora.40-x64
            profile: full
            os: ubuntu-24.04
            container_image: fedora:40
            opencv_extra_cmake_args: ""
          - rid: rhel.9-x64
            profile: full
            os: ubuntu-24.04
            container_image: registry.access.redhat.com/ubi9/ubi:9.8
            opencv_extra_cmake_args: "-DCMAKE_CXX_FLAGS=-DCV_AVXVNNI_AVAILABLE=0"
          - rid: rocky.9-x64
            profile: full
            os: ubuntu-24.04
            container_image: rockylinux:9
            opencv_extra_cmake_args: "-DCMAKE_CXX_FLAGS=-DCV_AVXVNNI_AVAILABLE=0"
          - rid: alpine.3.20-x64
            profile: full
            os: ubuntu-24.04
            container_image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
            opencv_extra_cmake_args: ""
          - rid: alpine.3.20-x64
            profile: mini
            os: ubuntu-24.04
            container_image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
            opencv_extra_cmake_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unmatched container producer target
        if: ${{ inputs.rid != matrix.rid || inputs.runtime_profile != matrix.profile }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - uses: actions/checkout@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Check project invariants
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1
      - name: Resolve runtime profile build list
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: profile
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $rid = @($matrix.rids | Where-Object { $_.rid -eq '${{ matrix.rid }}' } | Select-Object -First 1)
          if ($rid.Count -eq 0) {
            throw "Runtime RID was not found: ${{ matrix.rid }}"
          }

          $profile = @($matrix.profiles | Where-Object { $_.name -eq '${{ matrix.profile }}' } | Select-Object -First 1)
          if ($profile.Count -eq 0) {
            throw "Runtime profile was not found: ${{ matrix.profile }}"
          }

          $profileName = '${{ matrix.profile }}'
          $plan = & ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -Rid '${{ matrix.rid }}' `
            -BuildList ([string]$profile[0].buildList) `
            -ExtraCMakeArgs '${{ matrix.opencv_extra_cmake_args }}' `
            -DescribeOnly | ConvertFrom-Json
          if ($plan.Generator -ne 'Ninja' -or
              $plan.BuildSystem -ne 'single-config' -or
              $plan.InstallTarget -ne 'install') {
            throw "Container OpenCV build plan did not match the audited Ninja single-config boundary."
          }

          $cmakeText = Get-Content -LiteralPath ./src/OpenCvSharp.Native/CMakeLists.txt -Raw
          function Get-NativeSourceList([string]$variableName) {
            $match = [regex]::Match($cmakeText, "(?s)set\($variableName(?<body>.*?)\)")
            if (-not $match.Success) {
              throw "Native CMake source list was not found: $variableName"
            }
            return @(
              [regex]::Matches($match.Groups['body'].Value, '(?m)^\s*(src/[^\s\)]+)\s*$') |
                ForEach-Object { $_.Groups[1].Value }
            )
          }

          $miniSources = @(Get-NativeSourceList 'OPENCV_CSHARP_MINI_NATIVE_SOURCES')
          $fullOnlySources = @(Get-NativeSourceList 'OPENCV_CSHARP_FULL_ONLY_NATIVE_SOURCES')
          $nativeSources = if ($profileName -eq 'mini') { @($miniSources) } else { @($miniSources + $fullOnlySources) }
          $expectedSourceCount = if ($profileName -eq 'mini') { 8 } else { 45 }
          $expectedAbiFunctionCount = if ($profileName -eq 'mini') { 304 } else { 1966 }
          $abiManifest = if ($profileName -eq 'mini') {
            './src/OpenCvSharp.Native/generated/legacy_abi_mini_manifest.txt'
          }
          else {
            './src/OpenCvSharp.Native/generated/legacy_abi_manifest.txt'
          }
          $abiFunctionLine = @(Get-Content -LiteralPath $abiManifest | Where-Object { $_ -match '^function-count=' })
          if ($abiFunctionLine.Count -ne 1) {
            throw "Native ABI manifest did not contain exactly one function-count value for profile $profileName."
          }
          $abiFunctionCount = [int](([string]$abiFunctionLine[0]) -replace '^function-count=', '')
          if ($nativeSources.Count -ne $expectedSourceCount -or $abiFunctionCount -ne $expectedAbiFunctionCount) {
            throw "Container native profile evidence mismatch for ${profileName}: sources=$($nativeSources.Count), ABI=$abiFunctionCount."
          }
          foreach ($source in $nativeSources) {
            if (-not (Test-Path -LiteralPath (Join-Path ./src/OpenCvSharp.Native $source) -PathType Leaf)) {
              throw "Container native profile source was not found: $source"
            }
          }
          $nativeSourcesJson = ConvertTo-Json -InputObject ([object[]]$nativeSources) -Compress
          Write-Host "LINUX_CONTAINER_NATIVE_PROFILE_EVIDENCE rid=${{ matrix.rid }} profile=$profileName sources=$($nativeSources.Count) abi_functions=$abiFunctionCount build_list=$($profile[0].buildList)"

          "build_list=$($profile[0].buildList)" >> $env:GITHUB_OUTPUT
          "opencv_rid=$($rid[0].opencvRid)" >> $env:GITHUB_OUTPUT
          "distro=$($rid[0].distro)" >> $env:GITHUB_OUTPUT
          "distro_version=$($rid[0].distroVersion)" >> $env:GITHUB_OUTPUT
          "cmake_arguments=$($plan.CMakeArgs | ConvertTo-Json -Compress)" >> $env:GITHUB_OUTPUT
          "native_wrapper_sources=$nativeSourcesJson" >> $env:GITHUB_OUTPUT
          "native_wrapper_source_count=$($nativeSources.Count)" >> $env:GITHUB_OUTPUT
          "native_abi_function_count=$abiFunctionCount" >> $env:GITHUB_OUTPUT
      - name: Run distro container producer
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          CONTAINER_IMAGE: ${{ matrix.container_image }}
          HOSTED_RUNNER: ${{ matrix.os }}
          OPENCV_RID: ${{ steps.profile.outputs.opencv_rid }}
          OPENCV_VERSION: ${{ inputs.opencv_version }}
          OPENCV_EXTRA_CMAKE_ARGS: ${{ matrix.opencv_extra_cmake_args }}
          PRODUCER_RID: ${{ matrix.rid }}
          RUNTIME_PROFILE: ${{ matrix.profile }}
          BUILD_LIST: ${{ steps.profile.outputs.build_list }}
          OPENCV_CMAKE_ARGUMENTS: ${{ steps.profile.outputs.cmake_arguments }}
          NATIVE_WRAPPER_SOURCES: ${{ steps.profile.outputs.native_wrapper_sources }}
          NATIVE_WRAPPER_SOURCE_COUNT: ${{ steps.profile.outputs.native_wrapper_source_count }}
          NATIVE_ABI_FUNCTION_COUNT: ${{ steps.profile.outputs.native_abi_function_count }}
          EXPECTED_DISTRO: ${{ steps.profile.outputs.distro }}
          EXPECTED_DISTRO_VERSION: ${{ steps.profile.outputs.distro_version }}
          POWERSHELL_VERSION: 7.4.17
          POWERSHELL_SHA256: 68f3874cdb6cd564acf404103dfc410ee85435b02f0ad648e73a958853175d6c
        run: |
          set -euo pipefail
          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          repo_name="$(basename "$GITHUB_WORKSPACE")"
          container_shell="bash"
           if [ "$PRODUCER_RID" = "alpine.3.20-x64" ]; then
             container_shell="sh"
           fi

          hosted_runner_image=""
          hosted_runner_image_version=""
          hosted_distro=""
          hosted_distro_version=""
          hosted_architecture=""
          hosted_package_architecture=""
          hosted_libc=""
          hosted_cpu_model=""
          hosted_memory_bytes=""
          hosted_disk_available_bytes=""
          hosted_process_architecture=""
          hosted_dotnet_version=""
          container_image_id=""
          container_image_digest=""
           if [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ] || [ "$PRODUCER_RID" = "debian.12-arm64" ]; then
            . /etc/os-release
            test "${ID:-}" = "ubuntu"
            test "${VERSION_ID:-}" = "24.04"
            test "$(uname -m)" = "aarch64"
            test "$(dpkg --print-architecture)" = "arm64"
            test "$(docker info --format '{{.Architecture}}')" = "aarch64"
            docker pull "$CONTAINER_IMAGE"
            test "$(docker image inspect "$CONTAINER_IMAGE" --format '{{.Architecture}}')" = "arm64"
            container_image_id="$(docker image inspect "$CONTAINER_IMAGE" --format '{{.Id}}')"
            container_image_digest="$(docker image inspect "$CONTAINER_IMAGE" --format '{{join .RepoDigests ","}}')"
            if [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ]; then
              printf '%s\n' "$container_image_digest" | grep -Fq 'ubuntu@sha256:0e0a0fc6d18feda9db1590da249ac93e8d5abfea8f4c3c0c849ce512b5ef8982'
            else
              printf '%s\n' "$container_image_digest" | grep -Fq 'debian@sha256:9344f8b8992482f80cba753f323adeaf17690076c095ccff6cc9536be98185dc'
            fi

            hosted_runner_image="${ImageOS:-unknown}"
            hosted_runner_image_version="${ImageVersion:-unknown}"
            hosted_distro="$ID"
            hosted_distro_version="$VERSION_ID"
            hosted_architecture="$(uname -m)"
            hosted_package_architecture="$(dpkg --print-architecture)"
