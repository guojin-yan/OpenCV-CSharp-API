name: runtime-input

on:
  workflow_dispatch:
    inputs:
      opencv_version:
        description: OpenCV version used for real runtime input production
        required: true
        default: 5.0.0
      rid:
        description: Real producer target; currently Ubuntu 24.04 x64/ARM64, Ubuntu 22.04 x64, Debian 12 x64, Fedora 40 x64, RHEL 9 x64, Rocky 9 x64, or Alpine 3.20 x64
        required: true
        default: ubuntu.24.04-x64
      runtime_profile:
        description: Real producer profile; full for all targets, mini currently for ubuntu.24.04-x64 only
        required: true
        default: full

permissions:
  contents: read

jobs:
  validate-target:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate real producer target
        shell: pwsh
        run: |
          $supportedTargets = @(
            'ubuntu.24.04-x64/full',
            'ubuntu.24.04-x64/mini',
            'ubuntu.24.04-arm64/full',
            'ubuntu.22.04-x64/full',
            'debian.12-x64/full',
            'fedora.40-x64/full',
            'rhel.9-x64/full',
            'rocky.9-x64/full',
            'alpine.3.20-x64/full'
          )
          $selectedTarget = '${{ inputs.rid }}/${{ inputs.runtime_profile }}'
          if ($supportedTargets -notcontains $selectedTarget) {
            throw "runtime-input.yml currently produces runtime-input-ubuntu.24.04-x64-full, runtime-input-ubuntu.24.04-x64-mini, runtime-input-ubuntu.24.04-arm64-full, runtime-input-ubuntu.22.04-x64-full, runtime-input-debian.12-x64-full, runtime-input-fedora.40-x64-full, runtime-input-rhel.9-x64-full, runtime-input-rocky.9-x64-full, and runtime-input-alpine.3.20-x64-full. Ubuntu ARM64 mini and remaining mini/distro RIDs need separate linked-component or platform-native producer steps before being advertised as real runtime inputs."
          }

  produce:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: ubuntu.24.04-x64
            profile: full
            os: ubuntu-24.04
          - rid: ubuntu.24.04-x64
            profile: mini
            os: ubuntu-24.04
          - rid: ubuntu.24.04-arm64
            profile: full
            os: ubuntu-24.04-arm
          - rid: ubuntu.22.04-x64
            profile: full
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unmatched producer target
        if: ${{ inputs.rid != matrix.rid || inputs.runtime_profile != matrix.profile }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - uses: actions/checkout@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Check project invariants
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1
      - name: Install native build tools
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ninja-build
      - name: Record Ubuntu ARM64 runner evidence
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' && matrix.profile == 'full' }}
        id: arm64_runner
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          . /etc/os-release
          test "${ID:-}" = "ubuntu"
          test "${VERSION_ID:-}" = "24.04"
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

          runner_image="${ImageOS:-unknown}"
          runner_image_version="${ImageVersion:-unknown}"
          libc="$(getconf GNU_LIBC_VERSION)"
          cpu_model="$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)"
          disk_available_bytes="$(df --output=avail -B1 / | tail -n 1 | tr -d ' ')"
          test "$runner_image" != "unknown"
          test "$runner_image_version" != "unknown"
          test -n "$cpu_model"
          test "$disk_available_bytes" -gt 0

          printf '%s\n' \
            '#include <arm_neon.h>' \
            'uint8x16_t probe(unsigned char value) { return vdupq_n_u8(value); }' \
            'int main() { return 0; }' \
            > /tmp/opencv-arm64-neon.cpp
          g++ -c -O2 /tmp/opencv-arm64-neon.cpp -o /tmp/opencv-arm64-neon.o
          readelf -h /tmp/opencv-arm64-neon.o | grep -q 'Machine:.*AArch64'

          echo "UBUNTU_24_04_ARM64_RUNNER_EVIDENCE ImageOS=$runner_image ImageVersion=$runner_image_version ID=$ID VERSION_ID=$VERSION_ID UNAME=$(uname -m) DPKG_ARCH=$(dpkg --print-architecture) LIBC=$libc CPU=$cpu_model DISK_AVAILABLE_BYTES=$disk_available_bytes"
          lscpu
          df -h /
          df -B1 /
          cmake --version
          gcc --version
          g++ --version
          as --version
          pwsh --version
          dotnet --info
          echo "UBUNTU_24_04_ARM64_NEON_EVIDENCE machine=AArch64 neon_compile=success"

          {
            echo "runner_image=$runner_image"
            echo "runner_image_version=$runner_image_version"
            echo "hosted_distro=$ID"
            echo "hosted_distro_version=$VERSION_ID"
            echo "hosted_architecture=$(uname -m)"
            echo "hosted_package_architecture=$(dpkg --print-architecture)"
            echo "hosted_libc=$libc"
            echo "hosted_cpu_model=$cpu_model"
            echo "hosted_disk_available_bytes=$disk_available_bytes"
          } >> "$GITHUB_OUTPUT"
      - name: Resolve runtime profile build list
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: profile
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $rid = @($matrix.rids | Where-Object { $_.rid -eq '${{ matrix.rid }}' } | Select-Object -First 1)
          if ($rid.Count -eq 0) {
            throw "Runtime RID was not found: ${{ matrix.rid }}"
          }

          $profile = @($matrix.profiles | Where-Object { $_.name -eq '${{ matrix.profile }}' } | Select-Object -First 1)
          if ($profile.Count -eq 0) {
            throw "Runtime profile was not found: ${{ matrix.profile }}"
          }

          "build_list=$($profile[0].buildList)" >> $env:GITHUB_OUTPUT
          "opencv_rid=$($rid[0].opencvRid)" >> $env:GITHUB_OUTPUT
          "distro=$($rid[0].distro)" >> $env:GITHUB_OUTPUT
          "distro_version=$($rid[0].distroVersion)" >> $env:GITHUB_OUTPUT
      - name: Fetch OpenCV source
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $sourceRoot = Join-Path (Split-Path $env:GITHUB_WORKSPACE -Parent) 'opencv-source'
          $sourceDir = Join-Path $sourceRoot "opencv-${{ inputs.opencv_version }}"
          New-Item -ItemType Directory -Force -Path $sourceRoot | Out-Null
          git -c advice.detachedHead=false clone --depth 1 --branch '${{ inputs.opencv_version }}' https://github.com/opencv/opencv.git $sourceDir
      - name: Build OpenCV runtime
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          pwsh -NoProfile -File ./scripts/Build-OpenCV.ps1 `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -WorkspaceRoot $workspaceRoot `
            -Rid '${{ matrix.rid }}' `
            -BuildList '${{ steps.profile.outputs.build_list }}' `
            -Build
      - name: Record OpenCV ARM64 CPU configuration
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' && matrix.profile == 'full' }}
        id: arm64_opencv
        shell: bash
        run: |
          set -euo pipefail
          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          build_dir="$workspace_root/artifacts/opencv-build/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          cache="$build_dir/CMakeCache.txt"
          cpu_config="$(find "$build_dir" -type f -name cv_cpu_config.h -print -quit)"
          test -f "$cache"
          test -n "$cpu_config"

          cpu_evidence="$({
            grep -E '^(CPU_BASELINE|CPU_DISPATCH|CV_DISABLE_OPTIMIZATION):' "$cache" || true
            grep -E '^#define CV_CPU_(COMPILE|BASELINE|DISPATCH).*' "$cpu_config" || true
          } | tr '\n' ';')"
          test -n "$cpu_evidence"
          printf '%s\n' "$cpu_evidence" | grep -q 'NEON'
          echo "UBUNTU_24_04_ARM64_OPENCV_CPU_EVIDENCE $cpu_evidence"
          echo "opencv_cpu_configuration=$cpu_evidence" >> "$GITHUB_OUTPUT"
      - name: Configure linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $openCvInstallDir = Join-Path $workspaceRoot "artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          $openCvDirCandidates = @(
            (Join-Path $openCvInstallDir 'lib/cmake/opencv5'),
            (Join-Path $openCvInstallDir 'lib64/cmake/opencv5')
          )
          $openCvDirMatches = @($openCvDirCandidates | Where-Object { Test-Path -LiteralPath (Join-Path $_ 'OpenCVConfig.cmake') -PathType Leaf } | Select-Object -First 1)
          if ($openCvDirMatches.Count -eq 0) {
            throw "OpenCVConfig.cmake was not found for linked native wrapper build. Checked: $($openCvDirCandidates -join ', ')"
          }
          $openCvDir = [string]$openCvDirMatches[0]

          cmake `
            -S src/OpenCvSharp.Native `
            -B build/native-linked `
            -G Ninja `
            "-DOPENCV_VERSION=${{ inputs.opencv_version }}" `
            "-DOPENCV_CSHARP_OPENCV_DIR=$openCvDir" `
            "-DOPENCV_CSHARP_OPENCV_BUILD_LIST=${{ steps.profile.outputs.build_list }}" `
            "-DOPENCV_CSHARP_RUNTIME_PROFILE=${{ matrix.profile }}"
      - name: Build linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        run: cmake --build build/native-linked --config Release
      - name: Test linked native wrapper
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: bash
        run: |
          set -euo pipefail
          ctest --test-dir build/native-linked -C Release --output-on-failure | tee build/native-linked/ctest-output.txt
          if [ '${{ matrix.rid }}' = 'ubuntu.24.04-arm64' ] && [ '${{ matrix.profile }}' = 'full' ]; then
            grep -Fq '100% tests passed, 0 tests failed out of 5' build/native-linked/ctest-output.txt
            echo 'UBUNTU_24_04_ARM64_LINKED_CTEST_EVIDENCE passed=5 total=5'
          fi
      - name: Audit Ubuntu ARM64 producer ELF closure
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile && matrix.rid == 'ubuntu.24.04-arm64' && matrix.profile == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          open_cv_install_dir="$workspace_root/artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          open_cv_runtime_dir=""
          for candidate in "$open_cv_install_dir/lib" "$open_cv_install_dir/lib64"; do
            if [ -d "$candidate" ]; then
              open_cv_runtime_dir="$candidate"
              break
            fi
          done
          test -n "$open_cv_runtime_dir"

          audit_dir="$GITHUB_WORKSPACE/build/native-arm64-audit"
          rm -rf "$audit_dir"
          mkdir -p "$audit_dir"
          cp -a "$open_cv_runtime_dir"/libopencv_*.so* "$audit_dir/"
          cp build/native-linked/libJYPPX.OpenCV.Native.so "$audit_dir/"
          compatibility_loader="$(find build/native-linked -maxdepth 1 -type f -name 'lib*.Native.so' ! -name 'libJYPPX.OpenCV.Native.so' -print -quit)"
          test -n "$compatibility_loader"
          cp "$compatibility_loader" "$audit_dir/"
          compatibility_loader="$audit_dir/$(basename "$compatibility_loader")"

          mapfile -t opencv_elfs < <(find "$audit_dir" -maxdepth 1 -type f -name 'libopencv_*.so.${{ inputs.opencv_version }}' | sort)
          test "${#opencv_elfs[@]}" -eq 16
          elf_files=("$audit_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader" "${opencv_elfs[@]}")
          test "${#elf_files[@]}" -eq 18

          machine_count=0
          origin_count=0
          producer_path_count=0
          missing_dependency_count=0
          for elf in "${elf_files[@]}"; do
            test -f "$elf"
            readelf -h "$elf" | grep -q 'Machine:.*AArch64'
            machine_count=$((machine_count + 1))
            dynamic_paths="$(readelf -d "$elf" | grep -E '\((RPATH|RUNPATH)\)' || true)"
            printf '%s\n' "$dynamic_paths"
            printf '%s\n' "$dynamic_paths" | grep -Fq "\$ORIGIN"
            origin_count=$((origin_count + 1))
            if printf '%s\n' "$dynamic_paths" | grep -Eq '(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)'; then
              producer_path_count=$((producer_path_count + 1))
            fi
            missing="$(ldd "$elf" | grep 'not found' || true)"
            if [ -n "$missing" ]; then
              printf '%s\n' "$missing" >&2
              missing_dependency_count=$((missing_dependency_count + 1))
            fi
          done

          direct_opencv_dependencies="$(readelf -d "$audit_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c 'libopencv_.*so.500')"
          test "$machine_count" -eq 18
          test "$origin_count" -eq 18
          test "$producer_path_count" -eq 0
          test "$direct_opencv_dependencies" -eq 16
          test "$missing_dependency_count" -eq 0
          echo "UBUNTU_24_04_ARM64_PRODUCER_ELF_EVIDENCE files=18 machine=AArch64 origin=18 producer_paths=0 direct_opencv=16 missing_dependencies=0"
      - name: Create runtime input artifact layout
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: |
          $workspaceRoot = Split-Path $env:GITHUB_WORKSPACE -Parent
          $openCvInstallDir = Join-Path $workspaceRoot "artifacts/opencv-install/opencv-${{ inputs.opencv_version }}-${{ steps.profile.outputs.opencv_rid }}"
          $openCvRuntimeDirCandidates = @(
            (Join-Path $openCvInstallDir 'lib'),
            (Join-Path $openCvInstallDir 'lib64'),
            (Join-Path $openCvInstallDir 'bin')
          )
          $openCvRuntimeDirMatches = @($openCvRuntimeDirCandidates | Where-Object { Test-Path -LiteralPath $_ -PathType Container } | Select-Object -First 1)
          if ($openCvRuntimeDirMatches.Count -eq 0) {
            throw "OpenCV runtime directory was not found for artifact layout. Checked: $($openCvRuntimeDirCandidates -join ', ')"
          }
          $openCvRuntimeDir = [string]$openCvRuntimeDirMatches[0]
          $openCvSourceDir = Join-Path $workspaceRoot "opencv-source/opencv-${{ inputs.opencv_version }}"

          pwsh -NoProfile -File ./scripts/New-RuntimeInputArtifact.ps1 `
            -Rid '${{ matrix.rid }}' `
            -RuntimeProfile '${{ matrix.profile }}' `
            -OpenCvVersion '${{ inputs.opencv_version }}' `
            -NativeRuntimeDir ./build/native-linked `
            -OpenCvRuntimeDir $openCvRuntimeDir `
            -OpenCvSourceDir $openCvSourceDir `
            -OpenCvInstallDir $openCvInstallDir `
            -HostedRunner '${{ matrix.os }}' `
            -RunnerImage '${{ steps.arm64_runner.outputs.runner_image }}' `
            -RunnerImageVersion '${{ steps.arm64_runner.outputs.runner_image_version }}' `
            -HostedDistro '${{ steps.arm64_runner.outputs.hosted_distro }}' `
            -HostedDistroVersion '${{ steps.arm64_runner.outputs.hosted_distro_version }}' `
            -HostedArchitecture '${{ steps.arm64_runner.outputs.hosted_architecture }}' `
            -HostedPackageArchitecture '${{ steps.arm64_runner.outputs.hosted_package_architecture }}' `
            -HostedLibc '${{ steps.arm64_runner.outputs.hosted_libc }}' `
            -HostedCpuModel '${{ steps.arm64_runner.outputs.hosted_cpu_model }}' `
            -HostedDiskAvailableBytes '${{ steps.arm64_runner.outputs.hosted_disk_available_bytes }}' `
            -OpenCvCpuConfiguration '${{ steps.arm64_opencv.outputs.opencv_cpu_configuration }}' `
            -OutputRoot ./artifacts/runtime-inputs
      - name: Upload runtime input artifact
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
          if-no-files-found: error

  produce-container:
    needs: validate-target
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: debian.12-x64
            profile: full
            os: ubuntu-24.04
            container_image: debian:12
            opencv_extra_cmake_args: ""
          - rid: fedora.40-x64
            profile: full
            os: ubuntu-24.04
            container_image: fedora:40
            opencv_extra_cmake_args: ""
          - rid: rhel.9-x64
            profile: full
            os: ubuntu-24.04
            container_image: registry.access.redhat.com/ubi9/ubi:9.8
            opencv_extra_cmake_args: "-DCMAKE_CXX_FLAGS=-DCV_AVXVNNI_AVAILABLE=0"
          - rid: rocky.9-x64
            profile: full
            os: ubuntu-24.04
            container_image: rockylinux:9
            opencv_extra_cmake_args: "-DCMAKE_CXX_FLAGS=-DCV_AVXVNNI_AVAILABLE=0"
          - rid: alpine.3.20-x64
            profile: full
            os: ubuntu-24.04
            container_image: alpine:3.20
            opencv_extra_cmake_args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - name: Skip unmatched container producer target
        if: ${{ inputs.rid != matrix.rid || inputs.runtime_profile != matrix.profile }}
        run: echo "Skipping ${{ matrix.rid }} / ${{ matrix.profile }} for selected workflow inputs."
      - uses: actions/checkout@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
      - uses: actions/setup-dotnet@v4
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x
      - name: Check project invariants
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: pwsh
        run: pwsh -NoProfile -File ./scripts/Test-ProjectInvariants.ps1
      - name: Resolve runtime profile build list
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        id: profile
        shell: pwsh
        run: |
          $matrix = Get-Content -LiteralPath ./packaging/runtime/runtime-package-matrix.json -Raw | ConvertFrom-Json
          $rid = @($matrix.rids | Where-Object { $_.rid -eq '${{ matrix.rid }}' } | Select-Object -First 1)
          if ($rid.Count -eq 0) {
            throw "Runtime RID was not found: ${{ matrix.rid }}"
          }

          $profile = @($matrix.profiles | Where-Object { $_.name -eq '${{ matrix.profile }}' } | Select-Object -First 1)
          if ($profile.Count -eq 0) {
            throw "Runtime profile was not found: ${{ matrix.profile }}"
          }

          "build_list=$($profile[0].buildList)" >> $env:GITHUB_OUTPUT
          "opencv_rid=$($rid[0].opencvRid)" >> $env:GITHUB_OUTPUT
          "distro=$($rid[0].distro)" >> $env:GITHUB_OUTPUT
          "distro_version=$($rid[0].distroVersion)" >> $env:GITHUB_OUTPUT
      - name: Run distro container producer
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 2
          CONTAINER_IMAGE: ${{ matrix.container_image }}
          HOSTED_RUNNER: ${{ matrix.os }}
          OPENCV_RID: ${{ steps.profile.outputs.opencv_rid }}
          OPENCV_VERSION: ${{ inputs.opencv_version }}
          OPENCV_EXTRA_CMAKE_ARGS: ${{ matrix.opencv_extra_cmake_args }}
          PRODUCER_RID: ${{ matrix.rid }}
          RUNTIME_PROFILE: ${{ matrix.profile }}
          BUILD_LIST: ${{ steps.profile.outputs.build_list }}
          EXPECTED_DISTRO: ${{ steps.profile.outputs.distro }}
          EXPECTED_DISTRO_VERSION: ${{ steps.profile.outputs.distro_version }}
        run: |
          set -euo pipefail
          workspace_root="$(dirname "$GITHUB_WORKSPACE")"
          repo_name="$(basename "$GITHUB_WORKSPACE")"
          container_shell="bash"
          if [ "$CONTAINER_IMAGE" = "alpine:3.20" ]; then
            container_shell="sh"
          fi

          docker run --rm \
            -e CMAKE_BUILD_PARALLEL_LEVEL="$CMAKE_BUILD_PARALLEL_LEVEL" \
            -e CONTAINER_IMAGE="$CONTAINER_IMAGE" \
            -e HOSTED_RUNNER="$HOSTED_RUNNER" \
            -e OPENCV_RID="$OPENCV_RID" \
            -e OPENCV_VERSION="$OPENCV_VERSION" \
            -e OPENCV_EXTRA_CMAKE_ARGS="$OPENCV_EXTRA_CMAKE_ARGS" \
            -e PRODUCER_RID="$PRODUCER_RID" \
            -e RUNTIME_PROFILE="$RUNTIME_PROFILE" \
            -e BUILD_LIST="$BUILD_LIST" \
            -e EXPECTED_DISTRO="$EXPECTED_DISTRO" \
            -e EXPECTED_DISTRO_VERSION="$EXPECTED_DISTRO_VERSION" \
            -v "$workspace_root:/workspace" \
            -w "/workspace/$repo_name" \
            "$CONTAINER_IMAGE" \
            "$container_shell" -lc '
              set -euo pipefail
              . /etc/os-release
              musl_version=""
              case "${ID:-}" in
                debian|ubuntu)
                  export DEBIAN_FRONTEND=noninteractive

                  apt-get update
                  apt-get install -y --no-install-recommends \
                    apt-transport-https \
                    binutils \
                    ca-certificates \
                    cmake \
                    curl \
                    g++ \
                    git \
                    gnupg \
                    make \
                    ninja-build \
                    pkg-config

                  install -d -m 0755 /etc/apt/keyrings
                  curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /etc/apt/keyrings/packages.microsoft.gpg
                  chmod go+r /etc/apt/keyrings/packages.microsoft.gpg
                  if [ "${ID:-}" = "ubuntu" ]; then
                    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/ubuntu/${VERSION_ID}/prod ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/microsoft-prod.list
                  else
                    echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/debian/${VERSION_ID}/prod ${VERSION_CODENAME} main" > /etc/apt/sources.list.d/microsoft-prod.list
                  fi
                  apt-get update
                  apt-get install -y --no-install-recommends powershell
                  ;;
                alpine)
                  grep -q "/v3.20/main" /etc/apk/repositories
                  grep -q "/v3.20/community" /etc/apk/repositories
                  echo "ALPINE_3_20_REPOSITORY_EVIDENCE v3.20/main,v3.20/community"

                  apk add --no-cache \
                    bash \
                    binutils \
                    build-base \
                    ca-certificates \
                    cmake \
                    curl \
                    git \
                    gzip \
                    linux-headers \
                    make \
                    pkgconf \
                    powershell \
                    samurai \
                    tar \
                    unzip

                  musl_loader="/lib/ld-musl-x86_64.so.1"
                  test -x "$musl_loader"
                  musl_status=0
                  musl_banner="$("$musl_loader" 2>&1)" || musl_status=$?
                  test "$musl_status" -eq 1
                  musl_version="$(printf "%s\n" "$musl_banner" | sed -n "s/^Version //p" | head -n 1)"
                  test -n "$musl_version"
                  echo "ALPINE_3_20_MUSL_EVIDENCE ID=${ID:-unknown} VERSION_ID=${VERSION_ID:-unknown} ARCH=$(uname -m) LIBC=musl $musl_version"

                  assembler="$(as --version | head -n 1)"
                  echo "ALPINE_3_20_ASSEMBLER_EVIDENCE $assembler"
                  printf "%s\n" \
                    "#include <immintrin.h>" \
                    "#pragma GCC target(\"avxvnni\")" \
                    "__m256i probe(__m256i d, __m256i a, __m256i b) { return _mm256_dpbusd_epi32(d, a, b); }" \
                    "int main() { return 0; }" \
                    > /tmp/opencv-alpine-avxvnni.cpp
                  g++ -c -O2 /tmp/opencv-alpine-avxvnni.cpp -o /tmp/opencv-alpine-avxvnni.o
                  objdump -d /tmp/opencv-alpine-avxvnni.o | grep -q "vpdpbusd"
                  echo "ALPINE_3_20_AVXVNNI_EVIDENCE supported with no OpenCV CMake workaround"
                  ;;
                fedora|rhel|rocky)
                  curl_package="curl"
                  if [ "${ID:-}" = "rocky" ]; then
                    dnf install -y dnf-plugins-core
                    dnf config-manager --set-enabled crb
                    curl_package="curl-minimal"
                  elif [ "${ID:-}" = "rhel" ]; then
                    enabled_repositories="$(dnf repolist --enabled)"
                    for repository in ubi-9-baseos-rpms ubi-9-appstream-rpms ubi-9-codeready-builder-rpms; do
                      printf "%s\n" "$enabled_repositories" | grep -q "^${repository}"
                    done
                    echo "RHEL_9_UBI_REPOSITORY_EVIDENCE ubi-9-baseos-rpms,ubi-9-appstream-rpms,ubi-9-codeready-builder-rpms"
                    curl_package="curl-minimal"
                  fi

                  dnf install -y \
                    binutils \
                    ca-certificates \
                    cmake \
                    "$curl_package" \
                    findutils \
                    gcc-c++ \
                    git \
                    glibc-common \
                    gnupg2 \
                    gzip \
                    make \
                    ninja-build \
                    pkgconf-pkg-config \
                    tar \
                    unzip

                  as --version

                  rpm --import https://packages.microsoft.com/keys/microsoft.asc
                  curl -fsSL https://packages.microsoft.com/config/rhel/9/prod.repo -o /etc/yum.repos.d/microsoft-prod.repo
                  dnf install -y powershell
                  ;;
                *)
                  echo "Unsupported container distro for runtime input producer: ${ID:-unknown}" >&2
                  exit 1
                  ;;
              esac

              container_distro="${ID:-debian}"
              container_distro_version="${VERSION_ID:-12}"
              if [ "$container_distro" = "alpine" ]; then
                container_libc="musl $musl_version"
              else
                container_libc="$(getconf GNU_LIBC_VERSION 2>/dev/null || ldd --version | head -n 1)"
              fi
              if [ "$container_distro" != "$EXPECTED_DISTRO" ]; then
                echo "Container distro mismatch for $PRODUCER_RID: expected $EXPECTED_DISTRO, got $container_distro" >&2
                exit 1
              fi
              case "$container_distro_version" in
                "$EXPECTED_DISTRO_VERSION"|"$EXPECTED_DISTRO_VERSION".*) ;;
                *)
                  echo "Container distro version mismatch for $PRODUCER_RID: expected $EXPECTED_DISTRO_VERSION or $EXPECTED_DISTRO_VERSION.x, got $container_distro_version" >&2
                  exit 1
                  ;;
              esac

              source_root="/workspace/opencv-source"
              source_dir="$source_root/opencv-$OPENCV_VERSION"
              mkdir -p "$source_root"
              if [ ! -d "$source_dir/.git" ]; then
                git -c advice.detachedHead=false clone --depth 1 --branch "$OPENCV_VERSION" https://github.com/opencv/opencv.git "$source_dir"
              fi

              pwsh -NoProfile -File ./scripts/Build-OpenCV.ps1 \
                -OpenCvVersion "$OPENCV_VERSION" \
                -WorkspaceRoot /workspace \
                -Rid "$PRODUCER_RID" \
                -BuildList "$BUILD_LIST" \
                -ExtraCMakeArgs "$OPENCV_EXTRA_CMAKE_ARGS" \
                -Build

              open_cv_install_dir="/workspace/artifacts/opencv-install/opencv-$OPENCV_VERSION-$OPENCV_RID"
              open_cv_dir=""
              for candidate in \
                "$open_cv_install_dir/lib/cmake/opencv5" \
                "$open_cv_install_dir/lib64/cmake/opencv5"; do
                if [ -f "$candidate/OpenCVConfig.cmake" ]; then
                  open_cv_dir="$candidate"
                  break
                fi
              done
              if [ -z "$open_cv_dir" ]; then
                echo "OpenCVConfig.cmake was not found for linked native wrapper build under $open_cv_install_dir/lib or $open_cv_install_dir/lib64" >&2
                exit 1
              fi

              cmake \
                -S src/OpenCvSharp.Native \
                -B build/native-linked \
                -G Ninja \
                "-DOPENCV_VERSION=$OPENCV_VERSION" \
                "-DOPENCV_CSHARP_OPENCV_DIR=$open_cv_dir" \
                "-DOPENCV_CSHARP_OPENCV_BUILD_LIST=$BUILD_LIST" \
                "-DOPENCV_CSHARP_RUNTIME_PROFILE=$RUNTIME_PROFILE"

              cmake --build build/native-linked --config Release
              ctest --test-dir build/native-linked -C Release --output-on-failure

              if [ "$container_distro" = "alpine" ]; then
                alpine_elf_count=0
                alpine_origin_count=0
                compatibility_loader="$(find build/native-linked -maxdepth 1 -type f -name "lib*.Native.so" ! -name "libJYPPX.OpenCV.Native.so" | head -n 1)" # compatibility loader for already-compiled consumers
                test -n "$compatibility_loader"
                for elf in \
                  build/native-linked/libJYPPX.OpenCV.Native.so \
                  "$compatibility_loader" \
                  "$open_cv_install_dir"/lib/libopencv_*.so."$OPENCV_VERSION"; do
                  test -f "$elf"
                  alpine_elf_count=$((alpine_elf_count + 1))
                  dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
                  printf "%s\n" "$dynamic_paths"
                  if ! printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"; then
                    echo "Alpine producer ELF is missing a dollar-ORIGIN dynamic path: $elf" >&2
                    exit 1
                  fi
                  if printf "%s\n" "$dynamic_paths" | grep -Eq "\[(/[A-Za-z0-9]|[A-Za-z]:)"; then
                    echo "Alpine producer ELF retained an absolute dynamic path: $elf" >&2
                    exit 1
                  fi
                  alpine_origin_count=$((alpine_origin_count + 1))
                done
                if [ "$alpine_elf_count" -ne 18 ] || [ "$alpine_origin_count" -ne 18 ]; then
                  echo "Expected two Alpine loaders plus 16 canonical OpenCV ELF files with dollar-ORIGIN paths; got $alpine_elf_count / $alpine_origin_count." >&2
                  exit 1
                fi
                alpine_direct_opencv_dependencies="$(readelf -d build/native-linked/libJYPPX.OpenCV.Native.so | grep NEEDED | grep -c "libopencv_.*so.500")"
                if [ "$alpine_direct_opencv_dependencies" -ne 16 ]; then
                  echo "Expected 16 direct Alpine OpenCV loader dependencies, got $alpine_direct_opencv_dependencies." >&2
                  exit 1
                fi
                echo "ALPINE_3_20_PRODUCER_ELF_EVIDENCE files=18 origin=18 direct_opencv=16"
              fi

              open_cv_runtime_dir=""
              for candidate in \
                "$open_cv_install_dir/lib" \
                "$open_cv_install_dir/lib64" \
                "$open_cv_install_dir/bin"; do
                if [ -d "$candidate" ]; then
                  open_cv_runtime_dir="$candidate"
                  break
                fi
              done
              if [ -z "$open_cv_runtime_dir" ]; then
                echo "OpenCV runtime directory was not found under $open_cv_install_dir/lib, $open_cv_install_dir/lib64, or $open_cv_install_dir/bin" >&2
                exit 1
              fi

              pwsh -NoProfile -File ./scripts/New-RuntimeInputArtifact.ps1 \
                -Rid "$PRODUCER_RID" \
                -RuntimeProfile "$RUNTIME_PROFILE" \
                -OpenCvVersion "$OPENCV_VERSION" \
                -NativeRuntimeDir ./build/native-linked \
                -OpenCvRuntimeDir "$open_cv_runtime_dir" \
                -OpenCvSourceDir "$source_dir" \
                -OpenCvInstallDir "$open_cv_install_dir" \
                -HostedRunner "$HOSTED_RUNNER" \
                -ContainerImage "$CONTAINER_IMAGE" \
                -ContainerDistro "$container_distro" \
                -ContainerDistroVersion "$container_distro_version" \
                -ContainerLibc "$container_libc" \
                -OpenCvExtraCMakeArgs "$OPENCV_EXTRA_CMAKE_ARGS" \
                -OutputRoot ./artifacts/runtime-inputs
            '
      - name: Upload runtime input artifact
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
          if-no-files-found: error
