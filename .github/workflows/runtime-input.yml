              fi

              cmake \
                -S src/OpenCvSharp.Native \
                -B build/native-linked \
                -G Ninja \
                "-DOPENCV_VERSION=$OPENCV_VERSION" \
                "-DOPENCV_CSHARP_OPENCV_DIR=$open_cv_dir" \
                "-DOPENCV_CSHARP_OPENCV_BUILD_LIST=$BUILD_LIST" \
                "-DOPENCV_CSHARP_RUNTIME_PROFILE=$RUNTIME_PROFILE"

              cmake --build build/native-linked --config Release
              ctest --test-dir build/native-linked -C Release --output-on-failure | tee build/native-linked/ctest-output.txt
               if [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ] || [ "$PRODUCER_RID" = "debian.12-arm64" ] || [ "$PRODUCER_RID" = "alpine.3.20-x64" ]; then
                 grep -Fq "100% tests passed, 0 tests failed out of 5" build/native-linked/ctest-output.txt
                 if [ "$PRODUCER_RID" = "alpine.3.20-x64" ]; then
                   echo "ALPINE_3_20_LINKED_CTEST_EVIDENCE profile=$RUNTIME_PROFILE passed=5 total=5"
                 elif [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ]; then
                   echo "UBUNTU_22_04_ARM64_LINKED_CTEST_EVIDENCE profile=$RUNTIME_PROFILE passed=5 total=5"
                else
                  echo "DEBIAN_12_ARM64_LINKED_CTEST_EVIDENCE profile=$RUNTIME_PROFILE passed=5 total=5"
                fi
              fi

               elf_audit_evidence=""
               if [ "$container_distro" = "alpine" ]; then
                 case "$RUNTIME_PROFILE" in
                   full)
                     modules="core imgproc imgcodecs videoio flann geometry calib stereo dnn objdetect photo features video highgui stitching ptcloud"
                     expected_opencv_count=16
                     expected_canonical_count=18
                     expected_runtime_file_count=50
                     expected_direct_opencv=16
                     ;;
                   mini)
                     modules="core imgproc imgcodecs videoio geometry flann"
                     expected_opencv_count=6
                     expected_canonical_count=8
                     expected_runtime_file_count=20
                     expected_direct_opencv=6
                     ;;
                   *)
                     echo "Unsupported Alpine runtime profile: $RUNTIME_PROFILE" >&2
                     exit 1
                     ;;
                 esac

                 open_cv_runtime_audit_dir=""
                 for candidate in "$open_cv_install_dir/lib" "$open_cv_install_dir/lib64"; do
                   if [ -d "$candidate" ]; then
                     open_cv_runtime_audit_dir="$candidate"
                     break
                   fi
                 done
                 test -n "$open_cv_runtime_audit_dir"

                 audit_dir="build/native-$PRODUCER_RID-audit"
                 rm -rf "$audit_dir"
                 mkdir -p "$audit_dir"
                 cp -a "$open_cv_runtime_audit_dir"/libopencv_*.so* "$audit_dir/"
                 cp build/native-linked/libJYPPX.OpenCV.Native.so "$audit_dir/"
                 compatibility_loader="$(find build/native-linked -maxdepth 1 -type f -name "lib*.Native.so" ! -name "libJYPPX.OpenCV.Native.so" | head -n 1)" # compatibility loader for already-compiled consumers
                 test -n "$compatibility_loader"
                 cp "$compatibility_loader" "$audit_dir/"
                 compatibility_loader="$audit_dir/$(basename "$compatibility_loader")"

                 expected_names="/tmp/alpine-$RUNTIME_PROFILE-expected-runtime-files.txt"
                 actual_names="/tmp/alpine-$RUNTIME_PROFILE-actual-runtime-files.txt"
                 printf "%s\n" "libJYPPX.OpenCV.Native.so" "$(basename "$compatibility_loader")" > "$expected_names"
                 for module in $modules; do
                   printf "%s\n" \
                     "libopencv_${module}.so" \
                     "libopencv_${module}.so.500" \
                     "libopencv_${module}.so.$OPENCV_VERSION" \
                     >> "$expected_names"
                 done
                 sort -o "$expected_names" "$expected_names"
                 for path in "$audit_dir"/*; do basename "$path"; done | sort > "$actual_names"
                 test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
                 diff -u "$expected_names" "$actual_names"

                 alpine_elf_count=0
                 alpine_origin_count=0
                 alpine_producer_path_count=0
                 alpine_missing_dependency_count=0
                 alpine_opencv_count=0
                 for elf in \
                   "$audit_dir/libJYPPX.OpenCV.Native.so" \
                   "$compatibility_loader" \
                   "$audit_dir"/libopencv_*.so."$OPENCV_VERSION"; do
                   test -f "$elf"
                   readelf -h "$elf" | grep -q "Machine:.*X86-64"
                   case "$(basename "$elf")" in libopencv_*) alpine_opencv_count=$((alpine_opencv_count + 1)) ;; esac
                   alpine_elf_count=$((alpine_elf_count + 1))
                   dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
                   printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
                   alpine_origin_count=$((alpine_origin_count + 1))
                   if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then
                     alpine_producer_path_count=$((alpine_producer_path_count + 1))
                   fi
                   missing="$(ldd "$elf" | grep "not found" || true)"
                   if [ -n "$missing" ]; then
                     printf "%s\n" "$missing" >&2
                     alpine_missing_dependency_count=$((alpine_missing_dependency_count + 1))
                   fi
                 done
                 alpine_direct_opencv_dependencies="$(readelf -d "$audit_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
                 test "$alpine_opencv_count" -eq "$expected_opencv_count"
                 test "$alpine_elf_count" -eq "$expected_canonical_count"
                 test "$alpine_origin_count" -eq "$expected_canonical_count"
                 test "$alpine_producer_path_count" -eq 0
                 test "$alpine_direct_opencv_dependencies" -eq "$expected_direct_opencv"
                 test "$alpine_missing_dependency_count" -eq 0
                 cmp -s "$audit_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader"
                 elf_audit_evidence="ALPINE_3_20_PRODUCER_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=X86-64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 loader_equal=true"
                 echo "$elf_audit_evidence"
               fi

               if [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ] || [ "$PRODUCER_RID" = "debian.12-arm64" ]; then
                case "$RUNTIME_PROFILE" in
                  full)
                    modules="core imgproc imgcodecs videoio flann geometry calib stereo dnn objdetect photo features video highgui stitching ptcloud"
                    expected_opencv_count=16
                    expected_canonical_count=18
                    expected_runtime_file_count=50
                    expected_direct_opencv=16
                    ;;
                  mini)
                    modules="core imgproc imgcodecs videoio geometry flann"
                    expected_opencv_count=6
                    expected_canonical_count=8
                    expected_runtime_file_count=20
                    expected_direct_opencv=6
                    ;;
                  *)
                    echo "Unsupported ARM64 container runtime profile: $RUNTIME_PROFILE" >&2
                    exit 1
                    ;;
                esac

                open_cv_runtime_audit_dir=""
                for candidate in "$open_cv_install_dir/lib" "$open_cv_install_dir/lib64"; do
                  if [ -d "$candidate" ]; then
                    open_cv_runtime_audit_dir="$candidate"
                    break
                  fi
                done
                test -n "$open_cv_runtime_audit_dir"

                audit_dir="build/native-$PRODUCER_RID-audit"
                rm -rf "$audit_dir"
                mkdir -p "$audit_dir"
                cp -a "$open_cv_runtime_audit_dir"/libopencv_*.so* "$audit_dir/"
                cp build/native-linked/libJYPPX.OpenCV.Native.so "$audit_dir/"
                compatibility_loader="$(find build/native-linked -maxdepth 1 -type f -name "lib*.Native.so" ! -name "libJYPPX.OpenCV.Native.so" -print -quit)"
                test -n "$compatibility_loader"
                cp "$compatibility_loader" "$audit_dir/"
                compatibility_loader="$audit_dir/$(basename "$compatibility_loader")"

                expected_names="/tmp/$PRODUCER_RID-$RUNTIME_PROFILE-expected-runtime-files.txt"
                actual_names="/tmp/$PRODUCER_RID-$RUNTIME_PROFILE-actual-runtime-files.txt"
                printf "%s\n" "libJYPPX.OpenCV.Native.so" "$(basename "$compatibility_loader")" > "$expected_names"
                for module in $modules; do
                  printf "%s\n" \
                    "libopencv_${module}.so" \
                    "libopencv_${module}.so.500" \
                    "libopencv_${module}.so.$OPENCV_VERSION" \
                    >> "$expected_names"
                done
                sort -o "$expected_names" "$expected_names"
                find "$audit_dir" -mindepth 1 -maxdepth 1 \( -type f -o -type l \) -printf "%f\n" | sort > "$actual_names"
                test "$(wc -l < "$actual_names")" -eq "$expected_runtime_file_count"
                diff -u "$expected_names" "$actual_names"

                opencv_elf_count="$(find "$audit_dir" -maxdepth 1 -type f -name "libopencv_*.so.$OPENCV_VERSION" | wc -l | tr -d " ")"
                test "$opencv_elf_count" -eq "$expected_opencv_count"

                machine_count=0
                origin_count=0
                producer_path_count=0
                missing_dependency_count=0
                for elf in \
                  "$audit_dir/libJYPPX.OpenCV.Native.so" \
                  "$compatibility_loader" \
                  "$audit_dir"/libopencv_*.so."$OPENCV_VERSION"; do
                  test -f "$elf"
                  readelf -h "$elf" | grep -q "Machine:.*AArch64"
                  machine_count=$((machine_count + 1))
                  dynamic_paths="$(readelf -d "$elf" | grep -E "\((RPATH|RUNPATH)\)" || true)"
                  printf "%s\n" "$dynamic_paths"
                  printf "%s\n" "$dynamic_paths" | grep -Fq "\$ORIGIN"
                  origin_count=$((origin_count + 1))
                  if printf "%s\n" "$dynamic_paths" | grep -Eq "(\[|:)(/[A-Za-z0-9]|[A-Za-z]:)"; then
                    producer_path_count=$((producer_path_count + 1))
                  fi
                  missing="$(ldd "$elf" | grep "not found" || true)"
                  if [ -n "$missing" ]; then
                    printf "%s\n" "$missing" >&2
                    missing_dependency_count=$((missing_dependency_count + 1))
                  fi
                done

                direct_opencv_dependencies="$(readelf -d "$audit_dir/libJYPPX.OpenCV.Native.so" | grep NEEDED | grep -c "libopencv_.*so.500")"
                test "$machine_count" -eq "$expected_canonical_count"
                test "$origin_count" -eq "$expected_canonical_count"
                test "$producer_path_count" -eq 0
                test "$direct_opencv_dependencies" -eq "$expected_direct_opencv"
                test "$missing_dependency_count" -eq 0
                cmp -s "$audit_dir/libJYPPX.OpenCV.Native.so" "$compatibility_loader"
                if [ "$PRODUCER_RID" = "ubuntu.22.04-arm64" ]; then
                  elf_audit_evidence="UBUNTU_22_04_ARM64_PRODUCER_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=AArch64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 loader_equal=true"
                  echo "$elf_audit_evidence"
                else
                  elf_audit_evidence="DEBIAN_12_ARM64_PRODUCER_ELF_EVIDENCE profile=$RUNTIME_PROFILE files=$expected_canonical_count runtime_files=$expected_runtime_file_count machine=AArch64 origin=$expected_canonical_count producer_paths=0 direct_opencv=$expected_direct_opencv missing_dependencies=0 loader_equal=true"
                  echo "$elf_audit_evidence"
                fi
              fi

              open_cv_runtime_dir=""
              for candidate in \
                "$open_cv_install_dir/lib" \
                "$open_cv_install_dir/lib64" \
                "$open_cv_install_dir/bin"; do
                if [ -d "$candidate" ]; then
                  open_cv_runtime_dir="$candidate"
                  break
                fi
              done
              if [ -z "$open_cv_runtime_dir" ]; then
                echo "OpenCV runtime directory was not found under $open_cv_install_dir/lib, $open_cv_install_dir/lib64, or $open_cv_install_dir/bin" >&2
                exit 1
              fi

              pwsh -NoProfile -File ./scripts/New-RuntimeInputArtifact.ps1 \
                -Rid "$PRODUCER_RID" \
                -RuntimeProfile "$RUNTIME_PROFILE" \
                -OpenCvVersion "$OPENCV_VERSION" \
                -NativeRuntimeDir ./build/native-linked \
                -OpenCvRuntimeDir "$open_cv_runtime_dir" \
                -OpenCvSourceDir "$source_dir" \
                -OpenCvInstallDir "$open_cv_install_dir" \
                -HostedRunner "$HOSTED_RUNNER" \
                -RunnerImage "$HOSTED_RUNNER_IMAGE" \
                -RunnerImageVersion "$HOSTED_RUNNER_IMAGE_VERSION" \
                -HostedDistro "$HOSTED_DISTRO" \
                -HostedDistroVersion "$HOSTED_DISTRO_VERSION" \
                -HostedArchitecture "$HOSTED_ARCHITECTURE" \
                -HostedPackageArchitecture "$HOSTED_PACKAGE_ARCHITECTURE" \
                -HostedLibc "$HOSTED_LIBC" \
                -HostedCpuModel "$HOSTED_CPU_MODEL" \
                -HostedMemoryBytes "$HOSTED_MEMORY_BYTES" \
                -HostedDiskAvailableBytes "$HOSTED_DISK_AVAILABLE_BYTES" \
                -HostedProcessArchitecture "$HOSTED_PROCESS_ARCHITECTURE" \
                -CMakeVersion "$cmake_version" \
                -CMakeGenerator "Ninja" \
                -BuildConfiguration "Release" \
                -CompilerPath "$compiler_path" \
                -CompilerVersion "$compiler_version" \
                -AssemblerVersion "$assembler_version" \
                -NinjaVersion "$ninja_version" \
                -DotNetVersion "$HOSTED_DOTNET_VERSION" \
                -OpenCvCMakeArguments "$OPENCV_CMAKE_ARGUMENTS" \
                -ElfAuditEvidence "$elf_audit_evidence" \
                -OpenCvCpuConfiguration "$opencv_cpu_configuration" \
                -NativeWrapperSources "$NATIVE_WRAPPER_SOURCES" \
                -NativeWrapperSourceCount "$NATIVE_WRAPPER_SOURCE_COUNT" \
                -NativeAbiFunctionCount "$NATIVE_ABI_FUNCTION_COUNT" \
                -ContainerImage "$CONTAINER_IMAGE" \
                -ContainerImageId "$CONTAINER_IMAGE_ID" \
                -ContainerImageDigest "$CONTAINER_IMAGE_DIGEST" \
                -ContainerDistro "$container_distro" \
                -ContainerDistroVersion "$container_distro_version" \
                -ContainerArchitecture "$container_architecture" \
                -ContainerPackageArchitecture "$container_package_architecture" \
                -ContainerLibc "$container_libc" \
                -PowerShellVersion "$provenance_powershell_version" \
                -PowerShellArchiveSha256 "$provenance_powershell_sha256" \
                -OpenCvExtraCMakeArgs "$OPENCV_EXTRA_CMAKE_ARGS" \
                -OutputRoot ./artifacts/runtime-inputs
            '
      - name: Upload runtime input artifact
        if: ${{ inputs.rid == matrix.rid && inputs.runtime_profile == matrix.profile }}
        uses: actions/upload-artifact@v4
        with:
          name: runtime-input-${{ matrix.rid }}-${{ matrix.profile }}
          path: artifacts/runtime-inputs/${{ matrix.rid }}-${{ matrix.profile }}
          if-no-files-found: error
