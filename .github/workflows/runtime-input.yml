            hosted_process_architecture="$(pwsh -NoProfile -Command '[System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()' | tr -d '\r')"
            hosted_dotnet_version="$(dotnet --version)"
            test "$hosted_runner_image" != "unknown"
